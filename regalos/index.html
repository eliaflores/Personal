<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestra Lista de Regalos</title>
<meta name="theme-color" content="#D2335A">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Regalos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: app de una columna para el cel; cada regalo es una "etiqueta de regalo" con su hoyito; barra de pestañas abajo. */
:root {
  --bg: #F5F1F8;
  --surface: #FFFFFF;
  --surface-2: #EEE7F3;
  --ink: #2A1F3D;
  --muted: #6E6280;
  --line: #DED4E7;
  --accent: #D2335A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE3E9;
  --ribbon: #D99A1E;
  --ribbon-soft: #FBEFD3;
  --ok: #2F8A5B;
  --shadow: 0 1px 2px rgba(42,31,61,.06), 0 6px 18px rgba(42,31,61,.07);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16111E; --surface: #211A2C; --surface-2: #2B2238; --ink: #F1EBF7; --muted: #A99CBB;
  --line: #3A2F4A; --accent: #F0577C; --accent-ink: #1A0F16; --accent-soft: #3B1C29;
  --ribbon: #F0B848; --ribbon-soft: #3A2E17; --ok: #5CC48E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #16111E; --surface: #211A2C; --surface-2: #2B2238; --ink: #F1EBF7; --muted: #A99CBB;
  --line: #3A2F4A; --accent: #F0577C; --accent-ink: #1A0F16; --accent-soft: #3B1C29;
  --ribbon: #F0B848; --ribbon-soft: #3A2E17; --ok: #5CC48E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ribbon); outline-offset: 2px; border-radius: 8px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 1.25rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-btn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 800; font-size: .85rem; }
.avatar.b { background: var(--ribbon); color: #2A1F3D; }

/* Generic */
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }
.btn { border: none; border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:active { transform: translateY(1px); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: .9rem; }
label.field .opt { font-weight: 400; color: var(--muted); }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-height: 48px; }
.input:focus { border-color: var(--accent); outline: none; }
textarea.input { min-height: 72px; resize: vertical; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: .9rem; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.money { font-variant-numeric: tabular-nums; }

/* Budget hero */
.budget-q { font-size: clamp(1.6rem, 7vw, 2.1rem); font-weight: 800; line-height: 1.1; }
.budget-q em { font-style: normal; color: var(--accent); }
.money-input { position: relative; }
.money-input span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-family: var(--f-display); font-size: 1.8rem; font-weight: 700; color: var(--muted); pointer-events: none; }
.money-input input { font-family: var(--f-display); font-size: 2rem; font-weight: 800; padding-left: 40px; min-height: 64px; font-variant-numeric: tabular-nums; }
.money-input small { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; font-size: .85rem; }

/* Gift tag cards */
.tags { display: flex; flex-direction: column; gap: 14px; }
.tag { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 6px 18px 18px 6px; padding: 16px 16px 16px 34px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tag::before { content: ""; position: absolute; left: 12px; top: 20px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); }
.tag::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 6px 0 0 6px; background: var(--accent); }
.tag.owner-b::after { background: var(--ribbon); }
.tag.reserved { border-color: var(--ok); }
.tag-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tag-title { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.price { flex: none; font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.tag-note { margin: 0; color: var(--muted); font-size: .93rem; overflow-wrap: anywhere; }
.occ { display: flex; flex-wrap: wrap; gap: 6px; }
.occ span { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--ribbon-soft); color: var(--ink); }
.occ span.any { background: var(--surface-2); color: var(--muted); }
.tag-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-actions .btn { min-height: 42px; padding: 10px 14px; font-size: .92rem; border-radius: 12px; }
a.btn { text-decoration: none; }
.btn-link { background: var(--accent-soft); color: var(--accent); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-danger { background: transparent; color: var(--accent); border: 1.5px solid var(--accent-soft); }
.btn-danger.armed { background: var(--accent); color: var(--accent-ink); }
.fit { font-size: .8rem; font-weight: 700; color: var(--ok); }

.results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.results-head h2 { font-size: 1.2rem; }
.meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }

.empty { text-align: center; padding: 28px 18px; border: 2px dashed var(--line); border-radius: 20px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 1.1rem; margin-bottom: 6px; }
.empty p { margin: 0; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; height: var(--tabbar-h); }
.tab { border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: .8rem; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }

/* Sheet (form) */
.sheet-bg { position: fixed; inset: 0; background: rgba(20,12,28,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.sheet-grip { width: 44px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
.sheet-head h2 { font-size: 1.3rem; }
.x { border: none; background: var(--surface-2); width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; font-weight: 700; }
.row2 { display: grid; grid-template-columns: 1fr; gap: 14px; }

.fab { position: fixed; z-index: 7; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 8px 24px rgba(210,51,90,.35); border-radius: 999px; padding: 14px 20px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: .92rem; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

.who { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.who button { border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.who .avatar { width: 52px; height: 52px; font-size: 1.4rem; }
.notice { background: var(--ribbon-soft); border-radius: 14px; padding: 12px 14px; font-size: .92rem; }

@media (prefers-reduced-motion: no-preference) {
  .tag { animation: rise .25s ease both; }
  .sheet { animation: up .22s ease both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes up { from { transform: translateY(40px); } to { transform: none; } }
}
</style>
</head>
<body>
<header class="wrap" style="padding-block:0">
  <div class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="12" width="24" height="16" rx="3" fill="var(--accent)"/><rect x="2" y="8" width="28" height="6" rx="2" fill="var(--accent)"/><rect x="14" y="8" width="4" height="20" fill="var(--ribbon)"/><path d="M16 8c-3-6-9-5-8-1 1 2 5 2 8 1zm0 0c3-6 9-5 8-1-1 2-5 2-8 1z" fill="var(--ribbon)"/></svg>
      <h1 id="appTitle">Nuestra lista</h1>
    </div>
    <button class="me-btn" id="meBtn" hidden aria-label="Cerrar sesión"><span class="avatar" id="meAv">?</span><span id="meName"></span></button>
  </div>
</header>

<main class="wrap" id="app" style="padding-top:4px">
  <div class="panel stack"><p class="hint">Cargando su lista de regalos…</p></div>
</main>

<nav class="tabbar" id="tabbar" hidden>
  <div class="tabbar-in" role="tablist">
    <button class="tab" role="tab" id="tabGive" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 9h18M12 9v12M12 9c-2-4-6-4-6-1.5S9 9 12 9zm0 0c2-4 6-4 6-1.5S15 9 12 9z"/></svg>
      <span id="tabGiveLbl">Regalar</span>
    </button>
    <button class="tab" role="tab" id="tabMine" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg>
      <span>Mi wishlist</span>
    </button>
  </div>
</nav>

<button class="btn btn-primary fab" id="fab" hidden>+ Agregar regalo</button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, limit, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Mismo proyecto de Firebase que Mi Cartera, pero datos aparte en la colección "regalos".
const firebaseConfig = {
  apiKey: "AIzaSyC2j-keohRRLs8dnQk6hQXGT9eItJXmzik",
  authDomain: "personal-75acf.firebaseapp.com",
  projectId: "personal-75acf",
  storageBucket: "personal-75acf.firebasestorage.app",
  messagingSenderId: "12344295289",
  appId: "1:12344295289:web:5b54150483457bb94439a8"
};
const fbApp = initializeApp(firebaseConfig, "regalos");
const auth = getAuth(fbApp);
let fdb;
try { fdb = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fdb = initializeFirestore(fbApp, {}); }

const OCCASIONS = [
  { k: "navidad", l: "Navidad" },
  { k: "aniversario", l: "Aniversario" },
  { k: "sanvalentin", l: "San Valentín" },
  { k: "cumple", l: "Cumpleaños" },
  { k: "otro", l: "Otro" },
];
const occLabel = k => (OCCASIONS.find(o => o.k === k) || {}).l || k;
const QUICK = [500, 1000, 3000, 5000, 10000];
const mxn = n => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: n % 1 ? 2 : 0 }).format(n);

const S = {
  user: null, listId: null, list: null, items: [], loaded: false, authReady: false,
  tab: "give", budget: null, budgetDraft: "", occasion: "any", armedDelete: null, stale: false, error: "",
};
try { S.tab = localStorage.getItem("regalos.tab") || "give"; } catch (e) {}
const joinId = new URLSearchParams(location.search).get("unir");

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const r = $("#toastRoot");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (r.innerHTML = ""), 2800);
}
function writeErr(e) {
  if (e && e.code === "permission-denied") toast("Firestore no dio permiso. Revisa que pegaste las reglas nuevas.");
  else toast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
}

const me = () => S.user && S.user.uid;
const members = () => (S.list && Array.isArray(S.list.members)) ? S.list.members : [];
const partner = () => members().find(u => u !== me()) || null;
const nameOf = uid => (S.list && S.list.names && S.list.names[uid]) || "Tu pareja";
const avClass = uid => (members()[0] === uid ? "a" : "b");
const initial = n => (n || "?").trim().charAt(0).toUpperCase() || "?";
const firstName = u => ((u && u.displayName) || "Yo").trim().split(/\s+/)[0];
const safeUrl = u => { u = (u || "").trim(); if (!u) return ""; if (!/^https?:\/\//i.test(u)) u = "https://" + u; try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch (e) { return ""; } };
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
const inviteLink = () => location.origin + location.pathname + "?unir=" + encodeURIComponent(S.listId);

/* ---------- Render ---------- */
function render() {
  const chrome = !!(S.user && S.list && S.loaded);
  $("#tabbar").hidden = !chrome;
  $("#meBtn").hidden = !S.user;
  $("#fab").hidden = !(chrome && S.tab === "mine");
  if (S.user) {
    $("#meName").textContent = firstName(S.user);
    $("#meAv").textContent = initial(firstName(S.user));
    $("#meAv").className = "avatar " + (S.list ? avClass(me()) : "a");
  }
  if (!S.authReady) { app.innerHTML = `<div class="panel stack"><p class="hint">Cargando…</p></div>`; return; }
  if (!S.user) return renderSignIn();
  if (S.error) { app.innerHTML = `<div class="panel stack"><h2>No se pudo abrir la lista</h2><p class="hint">${esc(S.error)}</p></div>`; return; }
  if (!S.loaded) {
    app.innerHTML = `<div class="panel stack"><p class="hint">${S.stale ? "Todavía no se puede conectar. Revisa tu internet; se carga sola en cuanto responda." : "Cargando su lista de regalos…"}</p></div>`;
    return;
  }
  if (!S.list) return renderCreate();
  $("#appTitle").textContent = partner() ? `${nameOf(members()[0])} & ${nameOf(members()[1])}` : "Nuestra lista";
  if (!partner()) return renderInvite();
  $("#tabGiveLbl").textContent = `Regalar a ${nameOf(partner())}`;
  $("#tabGive").setAttribute("aria-selected", S.tab === "give");
  $("#tabMine").setAttribute("aria-selected", S.tab === "mine");
  S.tab === "mine" ? renderMine() : renderGive();
}

function renderSignIn() {
  app.innerHTML = `
    <div class="panel stack">
      <div class="stack" style="gap:6px">
        <span class="eyebrow">Lista de regalos</span>
        <h2 style="font-size:1.6rem">Regalos que sí quieren</h2>
        <p class="hint">Cada quien arma su wishlist. Quien regala pone su presupuesto y la ocasión, y solo le salen los regalos que caben.</p>
      </div>
      ${joinId ? `<p class="notice">Te invitaron a una lista. Inicia sesión para unirte.</p>` : ""}
      <button class="btn btn-primary btn-block" id="signIn">Entrar con Google</button>
    </div>`;
  $("#signIn").addEventListener("click", async () => {
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) signInWithRedirect(auth, provider);
      else if (e && e.code === "auth/unauthorized-domain") toast("Falta autorizar este sitio en Firebase → Authentication → Authorized domains: " + location.hostname);
      else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("No se pudo iniciar sesión.");
    }
  });
}

function renderCreate() {
  app.innerHTML = `
    <div class="panel stack">
      <div class="stack" style="gap:6px">
        <span class="eyebrow">Primera vez</span>
        <h2 style="font-size:1.6rem">Hola, ${esc(firstName(S.user))}</h2>
        <p class="hint">Crea su lista y luego mándale el link de invitación a tu pareja. Si tu pareja ya la creó, pídele que te mande su link.</p>
      </div>
      <button class="btn btn-primary btn-block" id="create">Crear nuestra lista</button>
    </div>`;
  $("#create").addEventListener("click", async ev => {
    ev.currentTarget.disabled = true;
    try {
      const ref = doc(collection(fdb, "regalos"));
      await setDoc(ref, { members: [me()], names: { [me()]: firstName(S.user) }, createdAt: Date.now() });
      openList(ref.id);
    } catch (e) { ev.currentTarget.disabled = false; writeErr(e); }
  });
}

function renderInvite() {
  const link = inviteLink();
  app.innerHTML = `
    <div class="panel stack">
      <div class="stack" style="gap:6px">
        <span class="eyebrow">Falta tu pareja</span>
        <h2 style="font-size:1.6rem">Invita a tu pareja</h2>
        <p class="hint">Mándale este link. Cuando entre con su cuenta de Google, la lista queda conectada para los dos. Solo pueden entrar dos personas.</p>
      </div>
      <input class="input" id="inviteLink" readonly value="${esc(link)}" aria-label="Link de invitación">
      <button class="btn btn-primary btn-block" id="share">Compartir link</button>
      <p class="hint">Mientras tanto ya puedes armar tu wishlist.</p>
      <button class="btn btn-ghost btn-block" id="startMine">Agregar mis regalos</button>
    </div>`;
  $("#share").addEventListener("click", async () => {
    if (navigator.share) { try { await navigator.share({ title: "Nuestra lista de regalos", url: link }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(link); toast("Link copiado"); }
    catch (e) { const i = $("#inviteLink"); i.focus(); i.select(); toast("Copia el link de arriba"); }
  });
  $("#startMine").addEventListener("click", () => openSheet(null));
}

function setTab(t) { S.tab = t; S.armedDelete = null; try { localStorage.setItem("regalos.tab", t); } catch (e) {} render(); window.scrollTo(0, 0); }

function occChips(selected, attr) {
  return [{ k: "any", l: "Cualquiera" }, ...OCCASIONS].map(o =>
    `<button type="button" class="chip" ${attr}="${o.k}" aria-pressed="${selected === o.k}">${o.l}</button>`).join("");
}
function occTags(it) {
  const occ = Array.isArray(it.occasions) ? it.occasions : [];
  if (!occ.length) return `<div class="occ"><span class="any">Cualquier ocasión</span></div>`;
  return `<div class="occ">${occ.map(k => `<span>${esc(k === "otro" && it.otherOccasion ? it.otherOccasion : occLabel(k))}</span>`).join("")}</div>`;
}

function renderGive() {
  const p = partner(), pn = nameOf(p);
  const theirs = S.items.filter(i => i.owner === p);
  let html = `
    <form class="panel stack" id="budgetForm">
      <span class="eyebrow">Regalo para ${esc(pn)}</span>
      <h2 class="budget-q">¿Cuánto es tu <em>presupuesto</em>?</h2>
      <div class="money-input">
        <span>$</span>
        <input class="input" id="budgetIn" inputmode="numeric" pattern="[0-9,]*" placeholder="3,000" value="${esc(S.budgetDraft)}" aria-label="Presupuesto en pesos" autocomplete="off">
        <small>MXN</small>
      </div>
      <div class="chips">${QUICK.map(q => `<button type="button" class="chip money" data-q="${q}">${mxn(q)}</button>`).join("")}</div>
      <div class="stack" style="gap:8px">
        <span class="eyebrow">¿Para qué ocasión?</span>
        <div class="chips">${occChips(S.occasion, "data-occ")}</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Ver ideas de regalo</button>
    </form>`;
  if (S.budget == null) {
    html += `<p class="hint" style="text-align:center;margin-top:18px">Los precios se mantienen ocultos hasta que pongas tu presupuesto.<br>${theirs.length ? `${esc(pn)} tiene ${theirs.length} ${theirs.length === 1 ? "idea" : "ideas"} en su wishlist.` : `${esc(pn)} todavía no agrega nada a su wishlist.`}</p>`;
  } else {
    const fits = theirs
      .filter(i => Number(i.price) <= S.budget)
      .filter(i => S.occasion === "any" || !(i.occasions || []).length || (i.occasions || []).includes(S.occasion))
      .sort((x, y) => (!!x.reservedBy - !!y.reservedBy) || (Number(y.price) - Number(x.price)));
    const occTxt = S.occasion === "any" ? "" : ` para ${occLabel(S.occasion)}`;
    html += `<section class="stack" style="margin-top:22px" aria-live="polite">
      <div class="results-head">
        <h2>${fits.length ? `${fits.length} ${fits.length === 1 ? "opción" : "opciones"}${esc(occTxt)}` : "Sin opciones por ahora"}</h2>
        <span class="eyebrow">Hasta ${mxn(S.budget)}</span>
      </div>`;
    html += fits.length
      ? `<div class="tags">${fits.map(giveCard).join("")}</div>`
      : `<div class="empty"><h3>Nada entra en ese presupuesto${esc(occTxt)}</h3><p>Prueba con otra cantidad u otra ocasión. Si quieres, pídele a ${esc(pn)} que agregue más ideas.</p></div>`;
    html += `</section>`;
  }
  app.innerHTML = html;

  const inp = $("#budgetIn");
  inp.addEventListener("input", () => {
    const digits = inp.value.replace(/[^\d]/g, "");
    S.budgetDraft = digits ? Number(digits).toLocaleString("es-MX") : "";
    inp.value = S.budgetDraft;
  });
  app.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => {
    S.budgetDraft = Number(b.dataset.q).toLocaleString("es-MX"); S.budget = Number(b.dataset.q); render();
  }));
  app.querySelectorAll("[data-occ]").forEach(b => b.addEventListener("click", () => {
    S.occasion = b.dataset.occ;
    const v = Number((S.budgetDraft || "").replace(/[^\d]/g, ""));
    if (v > 0) S.budget = v;
    render();
  }));
  $("#budgetForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const v = Number((S.budgetDraft || "").replace(/[^\d]/g, ""));
    if (!v) { toast("Escribe una cantidad primero"); inp.focus(); return; }
    S.budget = v; render();
  });
  app.querySelectorAll("[data-reserve]").forEach(b => b.addEventListener("click", () => toggleReserve(b.dataset.reserve)));
}

function giveCard(i) {
  const pct = Math.max(4, Math.min(100, Math.round((Number(i.price) / S.budget) * 100)));
  const url = safeUrl(i.url);
  const mine = i.reservedBy === me();
  const left = S.budget - Number(i.price);
  return `<article class="tag owner-${avClass(i.owner)} ${i.reservedBy ? "reserved" : ""}">
    <div class="tag-head"><h3 class="tag-title">${esc(i.title)}</h3><span class="price">${mxn(Number(i.price))}</span></div>
    <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <span class="fit">${left > 0 ? `Te sobran ${mxn(left)}` : "Justo tu presupuesto"}${i.reservedBy ? " · Ya lo apartaste" : ""}</span>
    ${occTags(i)}
    ${i.note ? `<p class="tag-note">${esc(i.note)}</p>` : ""}
    <div class="tag-actions">
      ${url ? `<a class="btn btn-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Ver en ${esc(hostOf(url) || "la tienda")} ↗</a>` : ""}
      <button class="btn ${mine ? "btn-ok" : "btn-ghost"}" data-reserve="${esc(i.id)}">${mine ? "✓ Apartado" : "Apartar"}</button>
    </div>
  </article>`;
}

async function toggleReserve(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  try {
    await updateDoc(doc(fdb, "regalos", S.listId, "items", id), { reservedBy: it.reservedBy ? null : me() });
    toast(it.reservedBy ? "Ya no está apartado" : "Apartado. No se le muestra a tu pareja.");
  } catch (e) { writeErr(e); }
}

function renderMine() {
  const mine = S.items.filter(i => i.owner === me()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  let html = `<div class="stack" style="gap:6px;margin-block:6px 16px">
      <span class="eyebrow">Mi wishlist</span>
      <h2 style="font-size:1.6rem">Lo que me gustaría recibir</h2>
      <p class="hint">${esc(nameOf(partner()))} nunca ve tus precios de golpe: solo le salen los que caben en su presupuesto.</p>
    </div>`;
  if (!mine.length) {
    html += `<div class="empty"><h3>Tu wishlist está vacía</h3><p>Toca <b>+ Agregar regalo</b>, pega el link y ponle precio y ocasión.</p></div>`;
  } else {
    html += `<div class="tags">${mine.map(i => {
      const url = safeUrl(i.url);
      const armed = S.armedDelete === i.id;
      return `<article class="tag owner-${avClass(i.owner)}">
        <div class="tag-head"><h3 class="tag-title">${esc(i.title)}</h3><span class="price">${mxn(Number(i.price))}</span></div>
        ${occTags(i)}
        ${i.note ? `<p class="tag-note">${esc(i.note)}</p>` : ""}
        <div class="tag-actions">
          ${url ? `<a class="btn btn-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(url) || "Link")} ↗</a>` : ""}
          <button class="btn btn-ghost" data-edit="${esc(i.id)}">Editar</button>
          <button class="btn btn-danger ${armed ? "armed" : ""}" data-del="${esc(i.id)}">${armed ? "¿Seguro? Toca de nuevo" : "Borrar"}</button>
        </div>
      </article>`; }).join("")}</div>`;
  }
  app.innerHTML = html;
  app.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.edit)));
  app.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    const id = b.dataset.del;
    if (S.armedDelete !== id) { S.armedDelete = id; render(); clearTimeout(renderMine.t); renderMine.t = setTimeout(() => { if (S.armedDelete === id) { S.armedDelete = null; render(); } }, 4000); return; }
    S.armedDelete = null;
    try { await deleteDoc(doc(fdb, "regalos", S.listId, "items", id)); toast("Regalo borrado"); } catch (e) { writeErr(e); }
  }));
}

/* ---------- Add / edit sheet ---------- */
function openSheet(editId) {
  const it = editId ? S.items.find(x => x.id === editId) : null;
  const sel = new Set(it ? (it.occasions || []) : []);
  const root = $("#sheetRoot");
  root.innerHTML = `
    <div class="sheet-bg" id="sheetBg">
      <form class="sheet stack" id="itemForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-head"><h2 id="sheetTitle">${it ? "Editar regalo" : "Nuevo regalo"}</h2><button type="button" class="x" id="sheetX" aria-label="Cerrar">×</button></div>
        <label class="field">¿Qué es?<input class="input" id="fTitle" required maxlength="120" placeholder="Ej. Libro “Cien años de soledad”" value="${esc(it?.title)}"></label>
        <label class="field">Link <span class="opt">(Amazon, Liverpool, Mercado Libre…)</span><input class="input" id="fUrl" inputmode="url" autocomplete="off" placeholder="https://…" value="${esc(it?.url)}"></label>
        <label class="field">Precio aproximado (MXN)<input class="input" id="fPrice" required inputmode="decimal" placeholder="Ej. 450" value="${it ? esc(it.price) : ""}"></label>
        <div class="stack" style="gap:8px">
          <span class="field" style="font-weight:700;font-size:.9rem">¿Para qué ocasión me lo darías? <span class="opt" style="font-weight:400;color:var(--muted)">Si no eliges, sirve para cualquiera</span></span>
          <div class="chips" id="fOcc">${OCCASIONS.map(o => `<button type="button" class="chip" data-o="${o.k}" aria-pressed="${sel.has(o.k)}">${o.l}</button>`).join("")}</div>
        </div>
        <label class="field" id="otherWrap" ${sel.has("otro") ? "" : "hidden"}>¿Cuál ocasión?<input class="input" id="fOther" maxlength="40" placeholder="Ej. graduación, Día del Niño" value="${esc(it?.otherOccasion)}"></label>
        <label class="field">Nota <span class="opt">(talla, color, modelo…)</span><textarea class="input" id="fNote" maxlength="300" placeholder="Ej. en pasta dura, talla M, color verde">${esc(it?.note)}</textarea></label>
        <button class="btn btn-primary btn-block" type="submit" id="fSave">${it ? "Guardar cambios" : "Agregar a mi wishlist"}</button>
      </form>
    </div>`;
  const close = () => (root.innerHTML = "");
  $("#sheetX").addEventListener("click", close);
  $("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") close(); });
  root.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.o; sel.has(k) ? sel.delete(k) : sel.add(k);
    b.setAttribute("aria-pressed", sel.has(k));
    $("#otherWrap").hidden = !sel.has("otro");
  }));
  setTimeout(() => $("#fTitle").focus(), 50);
  $("#itemForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const title = $("#fTitle").value.trim();
    const price = Number($("#fPrice").value.replace(/[^\d.]/g, ""));
    if (!title) return;
    if (!(price > 0)) { toast("Pon un precio aproximado"); $("#fPrice").focus(); return; }
    const rawUrl = $("#fUrl").value.trim();
    if (rawUrl && !safeUrl(rawUrl)) { toast("Ese link no se ve bien. Revísalo."); $("#fUrl").focus(); return; }
    const body = {
      title, price, url: rawUrl ? safeUrl(rawUrl) : "",
      occasions: OCCASIONS.map(o => o.k).filter(k => sel.has(k)),
      otherOccasion: sel.has("otro") ? $("#fOther").value.trim() : "",
      note: $("#fNote").value.trim(),
    };
    $("#fSave").disabled = true;
    try {
      if (it) await updateDoc(doc(fdb, "regalos", S.listId, "items", it.id), body);
      else await addDoc(collection(fdb, "regalos", S.listId, "items"), { ...body, owner: me(), createdAt: Date.now(), reservedBy: null });
      close(); toast(it ? "Cambios guardados" : "Agregado a tu wishlist");
    } catch (e) { $("#fSave").disabled = false; writeErr(e); }
  });
}

/* ---------- Data ---------- */
let unsubs = [];
function stopAll() { unsubs.forEach(u => u()); unsubs = []; }

function openList(id) {
  stopAll();
  S.listId = id; S.loaded = false; S.stale = false;
  try { localStorage.setItem("regalos.list", id); } catch (e) {}
  if (joinId) history.replaceState(null, "", location.pathname);
  let gotList = false, gotItems = false;
  const timer = setTimeout(() => { if (!S.loaded) { S.stale = true; render(); } }, 10000);
  const done = () => { if (gotList && gotItems) { S.loaded = true; clearTimeout(timer); } render(); };
  unsubs.push(onSnapshot(doc(fdb, "regalos", id), snap => {
    S.list = snap.exists() ? snap.data() : null; gotList = true; done();
  }, err => { clearTimeout(timer); S.error = err && err.code === "permission-denied" ? "Firestore no dio permiso. Revisa que pegaste las reglas nuevas en Firebase." : "No se pudo cargar la lista."; render(); }));
  unsubs.push(onSnapshot(collection(fdb, "regalos", id, "items"), snap => {
    S.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); gotItems = true; done();
  }, () => { gotItems = true; done(); }));
}

async function findList() {
  S.error = "";
  try {
    if (joinId) {
      const ref = doc(fdb, "regalos", joinId);
      const snap = await getDoc(ref);
      if (!snap.exists()) { S.error = "Ese link de invitación no existe. Pide que te lo manden otra vez."; S.loaded = true; return render(); }
      const d = snap.data();
      if (!(d.members || []).includes(me())) {
        if ((d.members || []).length >= 2) { S.error = "Esa lista ya tiene a dos personas."; S.loaded = true; return render(); }
        await updateDoc(ref, { members: arrayUnion(me()), ["names." + me()]: firstName(S.user) });
      }
      return openList(joinId);
    }
    const q = query(collection(fdb, "regalos"), where("members", "array-contains", me()), limit(1));
    const res = await getDocs(q);
    if (!res.empty) return openList(res.docs[0].id);
    S.list = null; S.loaded = true; render();
  } catch (e) {
    S.error = e && e.code === "permission-denied" ? "Firestore no dio permiso. Revisa que pegaste las reglas nuevas en Firebase." : "No se pudo conectar. Revisa tu internet y recarga.";
    S.loaded = true; render();
  }
}

/* ---------- Wire up ---------- */
$("#tabGive").addEventListener("click", () => setTab("give"));
$("#tabMine").addEventListener("click", () => setTab("mine"));
$("#fab").addEventListener("click", () => openSheet(null));
$("#meBtn").addEventListener("click", () => {
  if (S.armedOut) { signOut(auth); S.armedOut = false; return; }
  S.armedOut = true; toast("Toca otra vez tu nombre para cerrar sesión");
  setTimeout(() => (S.armedOut = false), 3000);
});

getRedirectResult(auth).catch(() => {});
onAuthStateChanged(auth, user => {
  stopAll();
  S.authReady = true; S.user = user; S.list = null; S.items = []; S.loaded = false; S.listId = null;
  render();
  if (user) findList();
});
</script>
</body>
</html>
