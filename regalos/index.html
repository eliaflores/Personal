<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestra Lista de Regalos</title>
<meta name="theme-color" content="#F4F1EB">
<script>
  // Tema guardado en este cel: "colorido" (normal) o "discreto" (gris perla).
  (function () { var t = "colorido"; try { t = localStorage.getItem("regalos.tema") || t; } catch (e) {} document.documentElement.setAttribute("data-tema", t);
    if (t === "discreto") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111116"); })();
</script>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=5">
<link rel="manifest" href="manifest.json?v=5">
<meta name="apple-mobile-web-app-title" content="Regalos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para el cel. Fondo gris perla con manchas difuminadas, tarjetas blancas tipo vidrio,
   acentos casi negros y títulos con serifa; barra de navegación en píldora blanca. Un solo tema claro a propósito. */
:root {
  --bg: #E8E9EF;
  --glass: rgba(255,255,255,.82);
  --card: #FFFFFF;
  --soft: #F1F1F5;
  --soft-2: #E4E5EC;
  --ink: #1F1E25;
  --ink-2: #3A3943;
  --muted: #8B8C97;
  --line: #ECECF1;
  --icon: #6F7080;
  --warn-bg: #F6F1E7;
  --warn: #8A6A2F;
  --danger: #B5483A;
  --shadow: 0 1px 2px rgba(31,30,37,.04), 0 14px 34px rgba(60,62,80,.10);
  --f-title: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --on-ink: #FFFFFF;                 /* texto sobre botones/píldoras de color --ink */
  --glass-border: rgba(255,255,255,.9);
  --tile-bg: linear-gradient(145deg, #F4F4F7, #DFE0E7);
  --sheet-bg: #F4F4F7;
  --nav-bg: rgba(255,255,255,.85);
  --late-bg: #FDECEA;
  --solid-bg: linear-gradient(110deg, #7B7C86 0%, #3A3943 45%, #1F1E25 100%);
  --photo-bg: #FFFFFF;               /* fondo para fotos de producto (se ven completas) */
  --nav-h: 68px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42% 32% at 8% 12%, rgba(255,255,255,.95), transparent 70%),
    radial-gradient(38% 30% at 92% 34%, rgba(196,201,214,.85), transparent 70%),
    radial-gradient(46% 34% at 30% 62%, rgba(214,222,236,.9), transparent 70%),
    radial-gradient(40% 30% at 85% 88%, rgba(246,240,236,.95), transparent 70%),
    radial-gradient(35% 28% at 10% 92%, rgba(190,193,205,.7), transparent 70%),
    var(--bg); }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.title, .pf-h, .page-h { font-family: var(--f-title); font-weight: 400; font-size: 2.3rem; line-height: 1.1; letter-spacing: -0.01em; }

.wrap { max-width: 520px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom, 0px)); }
.wrap.no-nav { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
.full { margin-left: calc(-1 * max(18px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(18px, env(safe-area-inset-right, 0px))); }
.full > .in { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.solid { background: var(--solid-bg); color: #fff; }
.card { background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-border); border-radius: 30px; box-shadow: var(--shadow); }

/* Top bar */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 12px 14px; }
.bar .l { justify-self: start; display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; overflow: hidden; }
.bar .r { justify-self: end; display: flex; gap: 10px; align-items: center; }
.hdr-btns { display: flex; gap: 10px; align-items: center; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar .brand { font-family: var(--f-title); font-size: 1.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: var(--shadow); }
.logo svg { width: 26px; height: 26px; }
.icon-btn, .circle-btn { border: none; background: var(--card); color: var(--ink); width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; box-shadow: var(--shadow); }
.icon-btn svg, .circle-btn svg { width: 22px; height: 22px; }
.bagbtn { position: relative; }
.bagbtn b { position: absolute; top: -2px; right: -2px; background: var(--ink); color: var(--on-ink); font-size: .7rem; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; padding: 0 5px; font-weight: 700; border: 2px solid var(--bg); }
.mini-av { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--card); overflow: hidden; display: grid; place-items: center; background: var(--soft-2); color: var(--ink); font-weight: 700; font-size: 1.05rem; padding: 0; box-shadow: var(--shadow); }
.mini-av img { width: 100%; height: 100%; object-fit: cover; }

/* Buttons */
.btn { border: none; border-radius: 999px; padding: 14px 22px; font-weight: 600; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; text-decoration: none; }
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: var(--ink); color: var(--on-ink); box-shadow: 0 10px 22px rgba(31,30,37,.22); }
.btn-light { background: #fff; color: #1F1E25; }
.btn-ghost-light { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.75); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.link-danger { background: none; border: none; color: var(--danger); font-weight: 600; padding: 10px 4px; }

.sec { font-family: var(--f-title); font-weight: 400; font-size: 1.45rem; margin: 26px 0 12px; }
.hint { color: var(--muted); font-size: .92rem; margin: 0; }
.center { text-align: center; }

.ic { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--soft); color: var(--ink); display: grid; place-items: center; }
.ic svg { width: 21px; height: 21px; }

/* Listas */
.list { background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-border); border-radius: 30px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; width: 100%; background: none; border: none; text-align: left; text-decoration: none; color: inherit; }
.row + .row { border-top: 1px solid var(--line); }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 500; font-size: 1rem; overflow-wrap: anywhere; }
.row .tx span { display: block; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.row .ch { flex: none; color: var(--ink); }
.row .ch svg { width: 20px; height: 20px; }
.menu .row .ic { background: none; width: 28px; height: 28px; color: var(--ink); }
.menu .row .ic svg { width: 23px; height: 23px; stroke-width: 1.7; }
.row.armed { background: var(--danger); color: #fff; }
.row.armed .ic, .row.armed .ch { color: #fff; }
.secret-note { display: flex; gap: 10px; align-items: flex-start; background: var(--glass); border-radius: 20px; padding: 12px 14px; color: var(--ink-2); font-size: .86rem; margin-top: 16px; border: 1px solid var(--glass-border); }
.secret-note svg { flex: none; width: 20px; height: 20px; color: var(--ink); }
.empty { text-align: center; padding: 26px 18px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 28px; color: var(--muted); box-shadow: var(--shadow); }
.empty h3 { font-family: var(--f-title); font-weight: 400; color: var(--ink); font-size: 1.3rem; margin-bottom: 6px; }
.empty p { margin: 0; font-size: .92rem; }

/* Festividades (mosaico) */
.page-h { margin: 14px 0 18px; }
.ftiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ftile { background: var(--card); border: none; border-radius: 30px; padding: 22px 18px 18px; box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; color: inherit; }
.ftile .fi { align-self: center; width: 64px; height: 64px; display: grid; place-items: center; color: var(--icon); margin-bottom: 12px; filter: drop-shadow(0 6px 8px rgba(60,62,80,.18)); }
.ftile .fi svg { width: 54px; height: 54px; stroke-width: 1.5; }
.ftile b { font-family: var(--f-title); font-weight: 400; font-size: 1.22rem; line-height: 1.15; overflow-wrap: anywhere; }
.ftile span.s { color: var(--muted); font-size: .82rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
.ftile .go { margin-top: 10px; color: var(--ink); }
.ftile .go svg { width: 22px; height: 22px; stroke-width: 2; }
.ftile.new { background: var(--ink); color: var(--on-ink); }
.ftile.new .fi { color: var(--on-ink); filter: none; }
.ftile.new span.s { color: var(--on-ink); opacity: .7; }
.ftile.new .go { color: var(--on-ink); }

/* Wizard */
.wz { min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
.wz-top { display: flex; align-items: center; justify-content: space-between; padding-block: 12px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: #CACBD4; transition: width .2s; }
.dots i.on { width: 26px; background: var(--ink); }
.dots i.done { background: var(--ink-2); }
.wz-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
.wz-step { font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wz-q { font-family: var(--f-title); font-weight: 400; font-size: clamp(2rem, 8.5vw, 2.6rem); line-height: 1.08; }
.occ-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.occ-opt { border: none; background: var(--card); border-radius: 26px; padding: 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 600; box-shadow: var(--shadow); }
.occ-opt svg { width: 34px; height: 34px; color: var(--icon); stroke-width: 1.6; }
.occ-opt[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.occ-opt[aria-pressed="true"] svg { color: var(--on-ink); }
.occ-opt.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 18px; padding: 13px 16px; font-size: 16px; min-height: 52px; }
.input:focus { border-color: var(--ink); outline: none; }
.input::placeholder { color: var(--muted); opacity: .75; }
textarea.input { min-height: 84px; resize: vertical; }
.money { position: relative; }
.money span { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-family: var(--f-title); font-size: 2rem; color: var(--muted); pointer-events: none; }
.money input { font-family: var(--f-title); font-size: 2.3rem; padding-left: 44px; min-height: 78px; font-variant-numeric: tabular-nums; }
.money small { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: none; background: var(--card); border-radius: 999px; padding: 9px 15px; font-weight: 600; font-size: .88rem; min-height: 40px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(60,62,80,.07); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.summary { border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.summary .k { font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.65); }
.summary .v { font-family: var(--f-title); font-size: 1.5rem; }
.warn { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--ink); border-radius: 18px; padding: 12px 14px; font-size: .9rem; }
.warn svg { flex: none; width: 20px; height: 20px; color: var(--warn); }
.wz-foot { padding-block: 16px 8px; display: flex; flex-direction: column; gap: 6px; }

/* Festividad */
.band { border-radius: 30px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-border); box-shadow: var(--shadow); }
.band-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.band .name { font-family: var(--f-title); font-size: 1.35rem; }
.band .lbl { display: flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--muted); font-weight: 500; }
.band .lbl svg { width: 16px; height: 16px; }
.band .big { font-family: var(--f-title); font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: var(--soft-2); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.for { font-family: var(--f-title); font-weight: 400; font-size: 1.55rem; margin: 24px 0 12px; }
.tabs { display: flex; gap: 6px; margin-bottom: 18px; background: var(--glass); border-radius: 999px; padding: 6px; box-shadow: var(--shadow); border: 1px solid var(--glass-border); }
.tabs button { flex: 1; border: none; background: none; padding: 10px 8px; font-weight: 600; color: var(--muted); font-size: .92rem; border-radius: 999px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gcard { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; background: var(--card); border: none; padding: 8px 8px 14px; border-radius: 28px; text-align: left; min-width: 0; box-shadow: var(--shadow); }
.tile { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 22px; overflow: hidden; background: var(--tile-bg); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--icon); opacity: .7; }
.tile .ph svg { width: 40%; height: 40%; stroke-width: 1.4; }
.tile .top { position: absolute; inset: 8px 8px auto 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tile .top span { background: var(--card); color: var(--ink); border-radius: 99px; padding: 3px 9px; font-size: .72rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tile .top .p { background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: .8rem; font-variant-numeric: tabular-nums; flex: none; }
.tile.bought::after { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: .55; }
.stamp { position: absolute; z-index: 2; left: 50%; top: 55%; transform: translate(-50%,-50%) rotate(-8deg); border: 2.5px solid var(--ink); color: var(--ink); background: var(--card); border-radius: 12px; padding: 4px 10px; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.gcard h3 { font-family: var(--f-title); font-weight: 400; font-size: 1.12rem; line-height: 1.2; padding-inline: 6px; overflow-wrap: anywhere; }
.gcard .desc { display: flex; gap: 6px; align-items: flex-end; padding-inline: 6px; }
.gcard .desc p { margin: 0; flex: 1; min-width: 0; font-size: .78rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gcard .desc svg { flex: none; width: 22px; height: 22px; color: var(--ink); stroke-width: 2; }
.gcard .was { font-size: .74rem; font-weight: 600; color: var(--ink-2); padding-inline: 6px; }
.del-fiesta { display: flex; justify-content: center; margin-top: 30px; }

/* Detalle */
.hero-img { position: relative; width: 100%; max-width: 380px; aspect-ratio: 1; margin: 4px auto 12px; border-radius: 30px; overflow: hidden; background: var(--tile-bg); box-shadow: var(--shadow); }
.hero-img img { width: 100%; height: 100%; object-fit: cover; }
.hero-img .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--icon); opacity: .7; }
.hero-img .ph svg { width: 40%; height: 40%; stroke-width: 1.4; }
.dt-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 30px 0 16px; }
.dt-title h1 { font-family: var(--f-title); font-weight: 400; font-size: 2rem; line-height: 1.1; overflow-wrap: anywhere; min-width: 0; }
.dt-title svg { flex: none; width: 26px; height: 26px; color: var(--ink); margin-top: 4px; }
.panel { border-radius: 34px 34px 0 0; padding-block: 4px calc(24px + env(safe-area-inset-bottom, 0px)); min-height: 46vh; }
.panel .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 16px 14px; border-bottom: 1px solid rgba(255,255,255,.16); font-size: .88rem; font-weight: 500; color: rgba(255,255,255,.8); }
.panel .meta span { overflow-wrap: anywhere; }
.panel .body { padding-top: 14px; display: flex; flex-direction: column; gap: 14px; }
.panel .body p { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
.panel .host { font-size: .82rem; color: rgba(255,255,255,.6); }
.panel .price { align-self: flex-end; font-family: var(--f-title); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.panel .price small { font-size: 1.3rem; }
.panel .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.panel .acts .btn { padding-inline: 10px; }
.panel .short { font-size: .86rem; color: rgba(255,255,255,.75); text-align: center; margin: 0; }

/* Perfil */
.pf-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0 0; }
.pf-avatar { display: flex; justify-content: center; margin: -6px 0 -46px; position: relative; z-index: 2; }
.pf-av { width: 116px; height: 116px; border-radius: 50%; overflow: hidden; border: 5px solid var(--card); background: var(--soft-2); color: var(--ink); display: grid; place-items: center; font-family: var(--f-title); font-size: 2.8rem; box-shadow: 0 0 0 9px rgba(255,255,255,.5), 0 0 0 18px rgba(255,255,255,.22), 0 14px 30px rgba(60,62,80,.16); }
.pf-av img { width: 100%; height: 100%; object-fit: cover; }
.pf-card { padding: 62px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.pf-name { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pf-name h2 { font-weight: 700; font-size: 1.3rem; line-height: 1.2; overflow-wrap: anywhere; }
.pf-name span.u { display: block; color: var(--muted); font-size: .88rem; margin-top: 2px; }
.pill-dark { flex: none; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .85rem; border: none; }
.pill-dark svg { width: 16px; height: 16px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats3 div { background: var(--card); border-radius: 22px; padding: 14px 6px; text-align: center; box-shadow: 0 4px 14px rgba(60,62,80,.07); min-width: 0; }
.stats3 b { display: block; font-family: var(--f-title); font-weight: 400; font-size: 1.8rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: .8rem; color: var(--ink-2); }
.banner { display: flex; align-items: center; gap: 12px; border-radius: 24px; padding: 14px 14px 14px 16px; }
.banner .bi { flex: none; color: #fff; }
.banner .bi svg { width: 24px; height: 24px; fill: currentColor; }
.banner .bt { flex: 1; min-width: 0; }
.banner .bt b { display: block; font-weight: 700; font-size: .95rem; }
.banner .bt span { display: block; font-size: .82rem; color: rgba(255,255,255,.75); }
.btn-mini { flex: none; border: none; background: #fff; color: #1F1E25; border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: .88rem; }
.menu { margin-top: 12px; }

/* Mi wishlist */
.mine-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0 10px; }
.mine-head .btn { min-height: 46px; padding: 10px 18px; }

/* Bottom nav */
.nav { position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.nav-in { pointer-events: auto; display: flex; gap: 8px; padding: 8px; border-radius: 999px; background: var(--nav-bg); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 14px 34px rgba(60,62,80,.18); border: 1px solid var(--glass-border); }
.nav button { border: none; background: var(--soft); color: var(--ink); height: 52px; min-width: 52px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font-family: var(--f-title); font-size: 1.02rem; transition: background .15s, padding .15s; }
.nav button svg { width: 22px; height: 22px; }
.nav button .lb { display: none; }
.nav button[aria-current="page"] { background: var(--ink); color: var(--on-ink); padding: 0 22px; }
.nav button[aria-current="page"] .lb { display: inline; }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(31,30,37,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet-bg); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 32px 32px 0 0; padding: 16px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet > * { flex-shrink: 0; }   /* en formularios largos, que la foto no se aplaste */
.grip { width: 44px; height: 5px; border-radius: 99px; background: #CACBD4; margin: 0 auto 2px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { font-family: var(--f-title); font-weight: 400; font-size: 1.7rem; }
.x { border: none; background: var(--card); width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem; font-weight: 500; color: var(--ink); box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
.field .opt { font-weight: 400; color: var(--muted); }
.photo-pick { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 24px; border: 1.5px dashed #C4C5CF; background: var(--card); color: var(--icon); overflow: hidden; cursor: pointer; }
.photo-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-pick .lbl { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; }
.photo-pick .lbl svg { width: 34px; height: 34px; stroke-width: 1.6; }
.photo-pick .chg { position: absolute; right: 10px; bottom: 10px; background: var(--ink); color: var(--on-ink); border-radius: 99px; padding: 6px 12px; font-size: .8rem; font-weight: 600; }
.photo-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 34px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--on-ink); padding: 11px 18px; border-radius: 16px; font-weight: 500; font-size: .9rem; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

.signin { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; align-items: center; }
.signin .logo { width: 96px; height: 96px; }
.signin .logo svg { width: 54px; height: 54px; }
.signin h1 { font-family: var(--f-title); font-weight: 400; font-size: 2.6rem; }
.signin p { margin: 0; color: var(--muted); max-width: 32ch; }
.invite { border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.invite h2 { font-family: var(--f-title); font-weight: 400; font-size: 1.5rem; }
.invite p { margin: 0; color: rgba(255,255,255,.8); font-size: .92rem; }
.invite .input { color: var(--ink); }

/* ---------- Tema "Colorido" (el normal): fondo crema, bloques terracota, lavanda, salvia, vino, turquesa y mostaza ----------
   El tema "Discreto" es el gris perla de arriba. Se elige en Ajustes y se guarda en cada cel. */
:root[data-tema="colorido"] {
  --bg: #F4F1EB;
  --glass: #FFFFFF;
  --card: #FFFFFF;
  --soft: #EEEAE2;
  --soft-2: #E4DED3;
  --ink: #1C1B1A;
  --ink-2: #33312E;
  --muted: #8A857C;
  --line: #E8E3DA;
  --icon: #1C1B1A;
  --terra: #D95B3F;
  --lav: #8F94DB;
  --sage: #9CC487;
  --wine: #8E4C55;
  --teal: #2F8FA6;
  --mustard: #D4CF4A;
  --late: #C62828;
  --shadow: 0 1px 2px rgba(28,27,26,.03), 0 8px 22px rgba(28,27,26,.05);
  --f-title: "Lexend", "DM Sans", system-ui, sans-serif;
  --f: "Lexend", "DM Sans", system-ui, sans-serif;
}
body { font-size: 14.5px; }
[data-tema="colorido"] body::before { background: var(--bg); }
[data-tema="colorido"] .bgfx { display: none; }
:is(.title, .pf-h, .page-h, .bar .brand, .sec, .empty h3, .ftile b, .wz-q, .money span, .money input, .summary .v, .band .name, .band .big, .for, .gcard h3, .dt-title h1, .panel .price, .stats3 b, .nav button, .sheet-head h2, .signin h1, .invite h2) { font-weight: 600; letter-spacing: -0.02em; }
.title { font-size: 1.9rem; }
[data-tema="colorido"] :is(.card, .list, .tabs, .empty, .secret-note, .gcard, .ftile, .occ-opt, .chip, .stat) { border: 1.5px solid var(--line); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
[data-tema="colorido"] :is(.icon-btn, .circle-btn, .logo, .x, .mini-av) { box-shadow: none; border: 1.5px solid var(--ink); background: transparent; }
[data-tema="colorido"] .nav-in { background: #fff; border: 1.5px solid var(--line); box-shadow: 0 10px 30px rgba(28,27,26,.10); }
[data-tema="colorido"] .nav button { background: transparent; border: 1.5px solid var(--ink); }
[data-tema="colorido"] .nav button[aria-current="page"] { background: var(--ink); color: #fff; }
[data-tema="colorido"] .btn-primary { box-shadow: none; }
[data-tema="colorido"] .chip { border-color: var(--ink); background: transparent; }
[data-tema="colorido"] .chip[aria-pressed="true"] { background: var(--ink); }

/* Bloques de color. "on" = texto blanco; los claros (salvia, mostaza) llevan texto negro. */
[data-tema="colorido"] .solid { background: var(--wine); color: #fff; }
[data-tema="colorido"] .banner.solid { background: var(--wine); }
[data-tema="colorido"] .invite.solid { background: var(--teal); }
[data-tema="colorido"] .summary.solid { background: var(--lav); }
[data-tema="colorido"] .panel.solid { background: var(--wine); }
[data-tema="colorido"] :is(.invite p, .summary .k, .panel .meta, .panel .host, .panel .short, .banner .bt span) { color: rgba(255,255,255,.78); }
[data-tema="colorido"] .btn-ghost-light { color: #fff; border-color: rgba(255,255,255,.85); }

/* Perfil */
[data-tema="colorido"] .pf-av { box-shadow: 0 0 0 8px var(--terra), 0 0 0 16px #F3C9BD; border-color: #fff; background: var(--lav); color: #fff; }
[data-tema="colorido"] .stats3 div { box-shadow: none; border: none; }
[data-tema="colorido"] .stats3 div:nth-child(1) { background: var(--terra); color: #fff; }
[data-tema="colorido"] .stats3 div:nth-child(2) { background: var(--lav); color: #fff; }
[data-tema="colorido"] .stats3 div:nth-child(3) { background: var(--sage); }
[data-tema="colorido"] .stats3 div:is(:nth-child(1), :nth-child(2)) span { color: rgba(255,255,255,.85); }
[data-tema="colorido"] .menu .row .ic { width: 38px; height: 38px; border-radius: 50%; color: #fff; }
[data-tema="colorido"] .menu .row .ic svg { width: 19px; height: 19px; }
[data-tema="colorido"] .menu .row:nth-child(5n+1) .ic { background: var(--terra); }
[data-tema="colorido"] .menu .row:nth-child(5n+2) .ic { background: var(--lav); }
[data-tema="colorido"] .menu .row:nth-child(5n+3) .ic { background: var(--sage); color: var(--ink); }
[data-tema="colorido"] .menu .row:nth-child(5n+4) .ic { background: var(--teal); }
[data-tema="colorido"] .menu .row:nth-child(5n+5) .ic { background: var(--wine); }

/* Cada ocasión con su color (tarjetas de festividad, opciones del asistente y banda de la festividad) */
[data-tema="colorido"] [data-occ="cumple"] { --oc: var(--terra); --on: #fff; }
[data-tema="colorido"] [data-occ="navidad"] { --oc: var(--sage); --on: var(--ink); }
[data-tema="colorido"] [data-occ="aniversario"] { --oc: var(--lav); --on: #fff; }
[data-tema="colorido"] [data-occ="sanvalentin"] { --oc: var(--wine); --on: #fff; }
[data-tema="colorido"] [data-occ="otro"] { --oc: var(--teal); --on: #fff; }
[data-tema="colorido"] :is(.ftile, .occ-opt, .band)[data-occ] { background: var(--oc); color: var(--on); border-color: transparent; }
[data-tema="colorido"] :is(.ftile, .occ-opt)[data-occ] :is(.fi, svg, .go) { color: var(--on); }
[data-tema="colorido"] :is(.ftile, .band)[data-occ] :is(span.s, .lbl, .days) { color: var(--on); opacity: .82; }
[data-tema="colorido"] .band[data-occ] .meter { background: rgba(255,255,255,.45); }
[data-tema="colorido"] .band[data-occ] .meter i { background: var(--on); }
[data-tema="colorido"] .ftile .fi { filter: none; }
[data-tema="colorido"] .ftile.new { background: var(--mustard); color: var(--ink); border-color: transparent; }
[data-tema="colorido"] .ftile.new :is(.fi, .go) { color: var(--ink); }
[data-tema="colorido"] .ftile.new span.s { color: rgba(28,27,26,.7); }
[data-tema="colorido"] .occ-opt[aria-pressed="true"] { background: var(--ink) !important; color: #fff !important; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
[data-tema="colorido"] .occ-opt[aria-pressed="true"] svg { color: #fff !important; }
[data-tema="colorido"] .tabs { background: var(--soft); border-color: transparent; }
[data-tema="colorido"] .secret-note { background: var(--soft); border-color: transparent; }
[data-tema="colorido"] .warn { background: #F4EFC9; }

/* Regalos: fondo de color en cada tarjeta */
[data-tema="colorido"] .grid > :nth-child(4n+1) .tile { background: var(--lav); }
[data-tema="colorido"] .grid > :nth-child(4n+2) .tile { background: var(--sage); }
[data-tema="colorido"] .grid > :nth-child(4n+3) .tile { background: var(--terra); }
[data-tema="colorido"] .grid > :nth-child(4n+4) .tile { background: var(--mustard); }
[data-tema="colorido"] .tile .ph { color: #fff; opacity: .8; }
[data-tema="colorido"] .stamp { border-color: var(--ink); background: var(--mustard); }
[data-tema="colorido"] .hero-img { background: var(--lav); box-shadow: none; border: 1.5px solid var(--line); }
[data-tema="colorido"] .hero-img .ph { color: #fff; opacity: .85; }
[data-tema="colorido"] .sheet { background: var(--bg); }
[data-tema="colorido"] .photo-pick { background: #fff; border-color: #D8D1C4; }
[data-tema="colorido"] .dots i.on { background: var(--terra); }

/* ---------- Tema "Discreto": oscuro, grafito con brillos suaves y acentos blancos ---------- */
:root[data-tema="discreto"] {
  --bg: #111116;
  --glass: rgba(32,32,41,.78);
  --card: #1D1D25;
  --soft: #262630;
  --soft-2: #30303B;
  --ink: #F1F1F6;
  --ink-2: #CFCFD8;
  --muted: #9797A5;
  --line: #2D2D38;
  --icon: #B9B9C6;
  --warn-bg: #2D2819;
  --warn: #E7BE62;
  --danger: #FF7B6B;
  --late: #FF8A80;
  --late-bg: rgba(229,57,53,.16);
  --on-ink: #111116;
  --glass-border: rgba(255,255,255,.07);
  --tile-bg: linear-gradient(145deg, #2A2A34, #1E1E26);
  --sheet-bg: #16161C;
  --nav-bg: rgba(28,28,36,.88);
  --solid-bg: linear-gradient(115deg, #3D3D4B 0%, #2B2B36 50%, #1F1F28 100%);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.40);
  color-scheme: dark;
}
[data-tema="discreto"] .bgfx { background:
    radial-gradient(45% 30% at 12% 8%, rgba(120,122,150,.22), transparent 70%),
    radial-gradient(40% 30% at 92% 36%, rgba(90,95,130,.20), transparent 70%),
    radial-gradient(46% 34% at 28% 70%, rgba(70,72,95,.25), transparent 70%),
    radial-gradient(40% 30% at 88% 92%, rgba(130,110,120,.14), transparent 70%),
    var(--bg); }
[data-tema="discreto"] .warn { color: var(--ink); }
[data-tema="discreto"] .lookup.done { color: var(--ink); }
[data-tema="discreto"] .theme-opt[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
[data-tema="discreto"] .mini-av, [data-tema="discreto"] .pf-av { border-color: #2A2A34; }
/* En oscuro, los bloques grandes no van en blanco (deslumbran): grafito con texto claro */
[data-tema="discreto"] .remind { background: var(--solid-bg); color: #fff; border: 1px solid var(--glass-border) !important; }
[data-tema="discreto"] .ftile.new { background: linear-gradient(145deg, #34343F, #26262F); color: var(--ink); border: 1px solid var(--glass-border); }
[data-tema="discreto"] .ftile.new :is(.fi, .go) { color: var(--ink); }
[data-tema="discreto"] .ftile.new span.s { color: var(--muted); opacity: 1; }

/* Fechas, entregas y recordatorios (los dos temas) */
:root { --late: #C62828; }
.late-box { display: flex; gap: 10px; align-items: flex-start; background: var(--late-bg); color: var(--late); border-radius: 18px; padding: 12px 14px; font-size: .92rem; font-weight: 600; line-height: 1.35; }
.late-box svg { flex: none; width: 20px; height: 20px; }
.ontime { display: flex; gap: 8px; align-items: center; font-size: .86rem; font-weight: 500; }
.ontime svg { flex: none; width: 18px; height: 18px; }
.late-badge { position: absolute; z-index: 2; left: 8px; bottom: 8px; background: var(--late); color: #fff; border-radius: 99px; padding: 3px 9px; font-size: .7rem; font-weight: 700; }
.datechip { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: .82rem; font-weight: 600; cursor: pointer; }
.datechip svg { width: 15px; height: 15px; }
.datechip input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.days { font-size: .84rem; font-weight: 600; }
.remind { display: flex; align-items: center; gap: 12px; border-radius: 24px; padding: 14px 14px 14px 16px; margin-bottom: 30px; }
.remind .rt { flex: 1; min-width: 0; }
.remind .rt b { display: block; font-weight: 700; font-size: .98rem; }
.remind .rt span { display: block; font-size: .84rem; opacity: .85; }
.remind .ri svg { width: 26px; height: 26px; }
.remind { background: var(--ink); color: var(--on-ink); }
[data-tema="colorido"] .remind { background: var(--terra); }

.lookup:empty { display: none; }
.lookup { display: flex; align-items: center; gap: 8px; font-size: .86rem; font-weight: 500; margin-top: -6px; padding: 10px 12px; border-radius: 14px; background: var(--soft); }
.lookup svg { width: 17px; height: 17px; flex: none; }
.lookup .spin { display: inline-grid; }
.lookup .spin svg { animation: spin .8s linear infinite; }
.lookup.done { color: var(--ink); }
.lookup.warn-t { color: var(--muted); }

/* Fotos: las de tienda/internet completas sobre blanco; galería de miniaturas */
.tile img.fit, .hero-img img.fit, .photo-pick img.fit { object-fit: contain; background: var(--photo-bg); padding: 8%; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 2px; margin-top: -4px; }
.thumbs:empty { display: none; }
.thumbs .th { position: relative; flex: none; width: 64px; height: 64px; border-radius: 16px; overflow: hidden; border: 2px solid transparent; background: var(--tile-bg); padding: 0; cursor: pointer; }
.thumbs .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs .th.fit img { object-fit: contain; background: var(--photo-bg); padding: 4px; }
.thumbs .th[aria-current="true"] { border-color: var(--ink); }
.thumbs .th .rm { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.62); color: #fff; border: none; font-size: 15px; line-height: 1; display: grid; place-items: center; padding: 0; }
.thumbs .add { position: relative; flex: none; width: 64px; height: 64px; border-radius: 16px; border: 1.5px dashed var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink); font-size: .66rem; font-weight: 600; cursor: pointer; text-align: center; }
.thumbs .add svg { width: 18px; height: 18px; }
.thumbs .add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.thumbs.gal { justify-content: center; margin: 0 0 6px; }
.btn-sm { min-height: 44px; padding: 10px 16px; font-size: .92rem; }

/* Perfil */
.pf-card { padding: 18px; margin-top: 16px; }
.pf-top2 { display: flex; align-items: center; gap: 16px; }
.pf-av2 { position: relative; flex: none; width: 84px; height: 84px; cursor: pointer; }
.pf-av2 .pic { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--soft-2); color: var(--ink); font-weight: 600; font-size: 2rem; box-shadow: 0 0 0 4px var(--card), 0 0 0 6px var(--line); }
.pf-av2 .pic img { width: 100%; height: 100%; object-fit: cover; }
.pf-av2 .cam { position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; border: 3px solid var(--card); }
.pf-av2 .cam svg { width: 15px; height: 15px; }
.pf-av2 input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pf-who { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pf-who h2 { font-weight: 600; font-size: 1.3rem; line-height: 1.2; overflow-wrap: anywhere; }
.pf-who .u { color: var(--muted); font-size: .88rem; }
.pf-who .with { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; background: var(--soft); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: .86rem; font-weight: 500; }
.pf-who .mini { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-size: .78rem; font-weight: 600; }
.pf-who .mini img { width: 100%; height: 100%; object-fit: cover; }
.pf-card .stats3 { margin-top: 18px; }
.remind { margin: 12px 0 0 !important; }
.banner { margin-top: 12px; }
.for { display: flex; align-items: center; gap: 10px; }
.for-av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
[data-tema="colorido"] .pf-av2 .pic { background: var(--lav); color: #fff; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--terra); }

/* Ajustes */
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.theme-opt { border: 2px solid var(--line); background: var(--card); border-radius: 26px; padding: 14px; display: flex; flex-direction: column; gap: 12px; text-align: left; box-shadow: var(--shadow); }
.theme-opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.theme-opt .sw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.theme-opt .sw i { aspect-ratio: 1; max-width: 100%; border-radius: 50%; }
.theme-opt b { font-weight: 600; font-size: 1rem; }
.theme-opt span { color: var(--muted); font-size: .82rem; line-height: 1.3; }
.theme-opt .ok { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); font-size: .82rem; }
.theme-opt .ok svg { width: 16px; height: 16px; }

@media (prefers-reduced-motion: no-preference) {
  .screen { animation: fade .22s ease both; }
  .sheet { animation: up .22s ease both; }
  @keyframes fade { from { transform: translateY(6px); } to { transform: none; } }
  @keyframes up { from { transform: translateY(40px); } to { transform: none; } }
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div id="app"><div class="wrap no-nav"><p class="hint center" style="margin-top:40vh">Cargando…</p></div></div>
<nav class="nav" id="nav" hidden aria-label="Navegación">
  <div class="nav-in">
    <button id="navHome" aria-label="Festividades"><span></span><span class="lb">Festividades</span></button>
    <button id="navMine" aria-label="Mi wishlist"><span></span><span class="lb">Wishlist</span></button>
    <button id="navProfile" aria-label="Mi perfil"><span></span><span class="lb">Perfil</span></button>
  </div>
</nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script type="module">

const daysUntil = iso => { if (!iso) return null; const [y, m, d] = iso.split("-").map(Number); const t = new Date(); return Math.round((new Date(y, m - 1, d) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000); };

function route() {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  if (h[0] === "nueva") return { v: "wizard" };
  if (h[0] === "f" && h[1] && h[2] === "i" && h[3]) return { v: "detail", f: h[1], i: h[3] };
  if (h[0] === "f" && h[1]) return { v: "fiesta", f: h[1] };
  if (h[0] === "mia") return { v: "mine" };
  if (h[0] === "fiestas") return { v: "fiestas" };
  if (h[0] === "ajustes") return { v: "settings" };
  return { v: "profile" };
}
const go = h => { if (location.hash !== h) location.hash = h; else render(); };

/* ---------- Render ---------- */
function setNav(r) {
  const show = !!(S.user && S.list && S.loaded) && ["fiestas", "fiesta", "mine", "profile", "settings"].includes(r.v);
  $("#nav").hidden = !show;
  const cur = r.v === "mine" ? "navMine" : (r.v === "profile" || r.v === "settings") ? "navProfile" : "navHome";
  [["navHome", "grid"], ["navMine", "heart"], ["navProfile", "user"]].forEach(([id, ic]) => {
    const b = $("#" + id); b.querySelector("span").innerHTML = NAVI[ic];
    if (id === cur) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}

function render() {
  const r = route();
  setNav(r);
  if (!S.authReady) { app.innerHTML = `<div class="wrap no-nav"><p class="hint center" style="margin-top:40vh">Cargando…</p></div>`; return; }
  if (!S.user) return renderSignIn();
  if (S.error) { app.innerHTML = `<div class="wrap no-nav screen"><div class="empty" style="margin-top:20vh"><h3>No se pudo abrir la lista</h3><p>${esc(S.error)}</p><button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">Volver a intentar</button></div></div>`; return; }
  if (!S.loaded) { app.innerHTML = `<div class="wrap no-nav"><p class="hint center" style="margin-top:40vh">${S.stale ? "Todavía no se puede conectar. Revisa tu internet; se carga sola en cuanto responda." : "Cargando su lista de regalos…"}</p></div>`; return; }
  if (!S.list) return renderCreate();
  if (r.v === "wizard") return renderWizard();
  if (r.v === "fiesta") return renderFiesta(r.f);
  if (r.v === "detail") return renderDetail(r.f, r.i);
  if (r.v === "mine") return renderMine();
  if (r.v === "fiestas") return renderFiestas();
  if (r.v === "settings") return renderSettings();
  return renderProfile();
}

function renderSignIn() {
  app.innerHTML = `
    <div class="wrap no-nav screen"><div class="signin">
      <div class="logo">${LOGO}</div>
      <h1>Regalos</h1>
      <p>Cada quien arma su wishlist. Cuando hay algo que celebrar, eliges la ocasión y tu presupuesto, y solo te salen los regalos que te alcanzan.</p>
      ${joinId ? `<p style="color:var(--green);font-weight:600">Te invitaron a una lista. Entra para unirte.</p>` : ""}
      <button class="btn btn-primary btn-block" id="signIn" style="max-width:340px">Entrar con Google</button>
    </div></div>`;
  $("#signIn").addEventListener("click", async () => {
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) signInWithRedirect(auth, provider);
      else if (e && e.code === "auth/unauthorized-domain") toast("Falta autorizar este sitio en Firebase → Authentication → Authorized domains: " + location.hostname);
      else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("No se pudo iniciar sesión.");
    }
  });
}

function renderCreate() {

      <div class="logo">${LOGO}</div>
      <h1>Hola, ${esc(firstName(S.user))}</h1>
      <p>Crea su lista y mándale el link a tu pareja. Si tu pareja ya la creó, pídele su link de invitación.</p>
      <button class="btn btn-primary btn-block" id="create" style="max-width:340px">Crear nuestra lista</button>
    </div></div>`;
  $("#create").addEventListener("click", async ev => {
    const b = ev.currentTarget; b.disabled = true;
    try {
      const ref = doc(collection(fdb, "regalos"));
      await setDoc(ref, { members: [me()], names: { [me()]: firstName(S.user) }, createdAt: Date.now() });
      openList(ref.id);
    } catch (e) { b.disabled = false; writeErr(e); }
  });
}

      ${fs.map(f => { const n = Object.keys(f.bought || {}).length; return `<button class="ftile" data-occ="${esc(f.occasion)}" data-go="#f/${esc(f.id)}"><span class="fi">${I(occ(f.occasion).i)}</span><b>${esc(fiestaName(f))}</b><span class="s">${f.date ? esc(daysText(daysUntil(f.date))) + " · " : ""}te quedan ${mxn(f.budget - spent(f))}${n ? ` · ${n} comprado${n > 1 ? "s" : ""}` : ""}</span><span class="go">${I("arrow")}</span></button>`; }).join("")}

    if (!fs.length) html += `<p class="hint center" style="margin-top:18px">Aún no hay festividades. Toca <b>Nueva festividad</b> cuando se acerque un cumple, Navidad o su aniversario.</p>`;
    html += `<div class="secret-note">${I("shield")}<span>Todo esto es secreto. ${esc(nameOf(p))} no ve tus festividades, tu presupuesto ni lo que ya compraste.</span></div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
  wireGo(); wireInvite();
}

function fiestaRow(f) {
  const left = f.budget - spent(f), n = Object.keys(f.bought || {}).length;
  return `<button class="row" data-go="#f/${esc(f.id)}">
    <span class="ic">${I(occ(f.occasion).i)}</span>
    <span class="tx"><b>${esc(fiestaName(f))}</b><span>${f.date ? esc(fDate(f.date)) + " · " : ""}${n ? `${n} comprado${n > 1 ? "s" : ""} · ` : ""}te quedan ${mxn(left)}</span></span>
    <span class="ch">${I("chev")}</span></button>`;
}

/* ---------- Asistente: una pregunta a la vez ---------- */
function renderWizard() {
  if (!partner()) { location.replace("#"); return; }
  if (!S.wz) S.wz = { step: 0, occ: null, other: "", date: "", budget: "" };
  const w = S.wz, total = 4;
  const dots = Array.from({ length: total }, (_, i) => `<i class="${i === w.step ? "on" : i < w.step ? "done" : ""}"></i>`).join("");
  let body = "", foot = "";
  if (w.step === 0) {
    body = `<span class="wz-step">Pregunta 1 de 3</span>
      <h1 class="wz-q">¿Qué estás celebrando?</h1>
      <div class="occ-grid">${OCCASIONS.map(o => `<button type="button" class="occ-opt ${o.k === "otro" ? "wide" : ""}" data-occ="${o.k}" aria-pressed="${w.occ === o.k}">${I(o.i)}${o.l}</button>`).join("")}</div>
      <label class="field" ${w.occ === "otro" ? "" : "hidden"} id="otherWrap">¿Qué celebran?<input class="input" id="wOther" maxlength="40" placeholder="Ej. su graduación" value="${esc(w.other)}"></label>`;
    foot = `<button class="btn btn-primary btn-block" id="wNext" ${w.occ && (w.occ !== "otro" || w.other.trim()) ? "" : "disabled"}>Siguiente</button>`;
  } else if (w.step === 1) {
    body = `<span class="wz-step">Pregunta 2 de 3</span>
      <h1 class="wz-q">¿Cuándo es?</h1>
      <p class="hint">Así la reconoces fácil en tu lista.</p>
      <input class="input" type="date" id="wDate" value="${esc(w.date)}" aria-label="Fecha">`;
    foot = `<button class="btn btn-primary btn-block" id="wNext">${w.date ? "Siguiente" : "Saltar"}</button>`;
  } else if (w.step === 2) {
    body = `<span class="wz-step">Pregunta 3 de 3</span>
      <h1 class="wz-q">¿Cuál es tu presupuesto?</h1>
      <div class="money"><span>$</span><input class="input" id="wBudget" inputmode="numeric" placeholder="3,000" value="${esc(w.budget)}" aria-label="Presupuesto en pesos" autocomplete="off"><small>MXN</small></div>
      <div class="chips">${QUICK.map(q => `<button type="button" class="chip" data-q="${q}">${mxn(q)}</button>`).join("")}</div>
      <div class="warn">${I("lock")}<span>Piénsalo bien: una vez creada la festividad, el presupuesto ya no se puede cambiar.</span></div>`;
    foot = `<button class="btn btn-primary btn-block" id="wNext" ${numBudget() > 0 ? "" : "disabled"}>Siguiente</button>`;
  } else {
    const o = occ(w.occ);
    body = `<span class="wz-step">Listo</span>
      <h1 class="wz-q">¿Todo bien?</h1>
      <div class="summary solid">
        <div><div class="k">Celebras</div><div class="v">${esc(w.occ === "otro" ? w.other : o.l)}</div></div>
        ${w.date ? `<div><div class="k">Fecha</div><div class="v">${esc(fDate(w.date))}</div></div>` : ""}
        <div><div class="k">Presupuesto</div><div class="v">${mxn(numBudget())}</div></div>
        <div><div class="k">Para</div><div class="v">${esc(nameOf(partner()))}</div></div>
      </div>
      <div class="warn">${I("lock")}<span>El presupuesto queda fijo. Si te equivocaste, regresa ahora.</span></div>`;
    foot = `<button class="btn btn-primary btn-block" id="wNext">Crear y ver regalos</button>`;
  }
  app.innerHTML = `<div class="wrap no-nav screen"><div class="wz">
      <div class="wz-top"><button class="icon-btn" id="wBack" aria-label="${w.step ? "Atrás" : "Cancelar"}">${I("back")}</button><div class="dots">${dots}</div><span style="width:44px"></span></div>
      <div class="wz-body">${body}</div>
      <div class="wz-foot">${foot}</div>
    </div></div>`;

  $("#wBack").addEventListener("click", () => { if (w.step) { w.step--; render(); } else { S.wz = null; history.length > 1 ? history.back() : location.replace("#fiestas"); } });
  app.querySelectorAll("[data-occ]").forEach(b => b.addEventListener("click", () => { w.occ = b.dataset.occ; render(); if (w.occ === "otro") $("#wOther").focus(); }));
  const other = $("#wOther");
  if (other) other.addEventListener("input", () => { w.other = other.value; $("#wNext").disabled = !w.other.trim(); });
  const date = $("#wDate");
  if (date) date.addEventListener("input", () => { w.date = date.value; $("#wNext").textContent = w.date ? "Siguiente" : "Saltar"; });
  const bud = $("#wBudget");
  if (bud) {
    bud.addEventListener("input", () => {
      const d = bud.value.replace(/[^\d]/g, ""); w.budget = d ? Number(d).toLocaleString("es-MX") : ""; bud.value = w.budget;
      $("#wNext").disabled = !(numBudget() > 0);
    });
    setTimeout(() => bud.focus(), 60);
  }
  app.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { w.budget = Number(b.dataset.q).toLocaleString("es-MX"); render(); }));
  $("#wNext").addEventListener("click", async ev => {
    if (w.step < 3) { w.step++; render(); return; }
    const btn = ev.currentTarget; btn.disabled = true;
    const year = w.date ? w.date.slice(0, 4) : String(new Date().getFullYear());
    const name = w.occ === "otro" ? w.other.trim() : `${occ(w.occ).l} ${year}`;
    try {
      const ref = await addDoc(collection(fdb, "regalos", S.listId, "privado", me(), "fiestas"), {
        occasion: w.occ, other: w.occ === "otro" ? w.other.trim() : "", name, date: w.date || "",
        budget: numBudget(), bought: {}, createdAt: Date.now(),
      });
      S.wz = null; S.tab = "ideas";
      location.replace("#f/" + ref.id);
    } catch (e) { btn.disabled = false; writeErr(e); }
  });
}
const numBudget = () => Number(String((S.wz && S.wz.budget) || "").replace(/[^\d]/g, "")) || 0;

/* ---------- Festividad: su wishlist ---------- */
function matchesOcc(item, f) {
  const o = Array.isArray(item.occasions) ? item.occasions : [];
  return !o.length || o.includes(f.occasion);
}
function givenElsewhere(itemId, fid) {
  const f = S.fiestas.find(x => x.id !== fid && x.bought && x.bought[itemId]);
  return f ? fiestaName(f) : "";
}

function renderFiesta(fid) {
  const f = S.fiestas.find(x => x.id === fid);
  if (!f) { app.innerHTML = `<div class="wrap screen">${topBar(`<button class="icon-btn" data-go="#fiestas" aria-label="Atrás">${I("back")}</button>`)}<div class="empty"><h3>No encontré esa festividad</h3><p>Puede que la hayas borrado.</p></div></div>`; wireGo(); return; }
  const p = partner(), bought = f.bought || {};
  const used = spent(f), left = f.budget - used;
  const pct = Math.min(100, Math.round((used / f.budget) * 100));
  const ideas = theirItems().filter(i => !bought[i.id] && matchesOcc(i, f) && priceOf(i) > 0 && priceOf(i) <= left).sort((a, b) => priceOf(b) - priceOf(a));
  const boughtList = Object.entries(bought).map(([id, b]) => ({ ...(S.items.find(i => i.id === id) || { id, title: b.title, price: b.price, gone: true }), id, paid: b.price }));
  const nb = boughtList.length;

  let html = `<div class="wrap screen">
    ${topBar(`<button class="icon-btn" data-go="#fiestas" aria-label="Atrás">${I("back")}</button>`,
      `${refreshBtn()}<button class="icon-btn bagbtn" id="toBought" aria-label="Comprados: ${nb}">${I("bag")}${nb ? `<b>${nb}</b>` : ""}</button>`)}
    <div class="band" data-occ="${esc(f.occasion)}">
      <div class="band-row"><span class="name">${esc(fiestaName(f))}</span>
        <label class="datechip">${I("cal")}<span>${f.date ? esc(fDate(f.date)) : "Poner fecha"}</span><input type="date" id="fDate" value="${esc(f.date || "")}" aria-label="Fecha de la festividad"></label></div>
      ${f.date ? `<div class="band-row"><span class="days">${esc(daysText(daysUntil(f.date)))}</span></div>` : ""}
      <div class="band-row"><span class="lbl">${I("lock")} Presupuesto fijo: ${mxn(f.budget)}</span></div>
      <div class="band-row"><span class="big">Te quedan ${mxn(left)}</span></div>
      <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
    </div>
    <h2 class="for">${avatarOf(p) ? `<img class="for-av" src="${esc(avatarOf(p))}" alt="" referrerpolicy="no-referrer">` : ""}Ideas para ${esc(nameOf(p))}</h2>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="ideas" aria-selected="${S.tab === "ideas"}">Te alcanza (${ideas.length})</button>
      <button role="tab" data-tab="comprados" aria-selected="${S.tab === "comprados"}">Comprados (${nb})</button>
    </div>`;
  const list = S.tab === "comprados" ? boughtList : ideas;
  if (!list.length) {
    html += S.tab === "comprados"
      ? `<div class="empty"><h3>Aún no compras nada</h3><p>Abre un regalo y toca <b>Ya lo compré</b>. ${esc(nameOf(p))} nunca lo va a ver.</p></div>`
      : left <= 0
        ? `<div class="empty"><h3>Ya usaste todo tu presupuesto</h3><p>Revisa lo que compraste en la pestaña <b>Comprados</b>.</p></div>`
        : `<div class="empty"><h3>Nada entra en ${mxn(left)}</h3><p>${theirItems().length ? `Lo de su wishlist para ${esc(occ(f.occasion).l)} cuesta más.` : `${esc(nameOf(p))} todavía no agrega regalos a su wishlist.`}</p></div>`;
  } else {
    html += `<div class="grid">${list.map(i => {
      const isB = S.tab === "comprados";
      const was = !isB ? givenElsewhere(i.id, f.id) : "";
      return `<a class="gcard" href="#f/${esc(f.id)}/i/${esc(i.id)}">
        <div class="tile ${isB ? "bought" : ""}">${photoHtml(i)}
          <div class="top">${isB ? `<span>Comprado</span>` : `<i></i>`}<span class="p">${mxn(isB ? Number(i.paid) : priceOf(i))}</span></div>
          ${isB ? `<span class="stamp">Listo</span>` : isLate(i, f) ? `<span class="late-badge">No llega a tiempo</span>` : ""}
        </div>
        <h3>${esc(itemName(i))}</h3>
        ${was ? `<span class="was">Ya se lo diste en ${esc(was)}</span>` : ""}
        <div class="desc"><p>${esc(i.gone ? "Ya no está en su wishlist" : (i.note || (i.url ? hostOf(safeUrl(i.url)) : "")))}</p>${I("arrow")}</div>
      </a>`;
    }).join("")}</div>`;
  }
  html += `<div class="del-fiesta"><button class="link-danger" id="delF"><span class="lb">Borrar esta festividad</span></button></div></div>`;
  app.innerHTML = html;
  wireGo();
  app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));
  $("#toBought").addEventListener("click", () => { S.tab = "comprados"; render(); });
  $("#fDate").addEventListener("change", async ev => {
    const v = ev.target.value;
    try { await updateDoc(doc(fdb, "regalos", S.listId, "privado", me(), "fiestas", f.id), { date: v || "" }); toast(v ? "Fecha guardada. Te aviso antes del día." : "Fecha quitada"); }
    catch (e) { writeErr(e); }
  });
  $("#delF").addEventListener("click", async ev => {
    if (!arm("delF", ev.currentTarget, "¿Seguro? Toca otra vez para borrar")) return;
    try { await deleteDoc(doc(fdb, "regalos", S.listId, "privado", me(), "fiestas", f.id)); location.replace("#fiestas"); toast("Festividad borrada"); }
    catch (e) { writeErr(e); }
  });
}

/* ---------- Detalle del regalo ---------- */
function renderDetail(fid, iid) {
  const f = S.fiestas.find(x => x.id === fid);
  const b = f && f.bought && f.bought[iid];
  const it = S.items.find(x => x.id === iid) || (b ? { id: iid, title: b.title, price: b.price, gone: true } : null);
  if (!f || !it) { location.replace(f ? "#f/" + fid : "#fiestas"); return; }
  const left = f.budget - spent(f);
  const price = b ? Number(b.price) : priceOf(it);
  const url = safeUrl(it.url);
  const occs = (it.occasions || []).length ? it.occasions.map(k => k === "otro" && it.otherOccasion ? it.otherOccasion : occ(k).l).join(" · ") : "Cualquier ocasión";
  const short = !b && price > left;
  const arr = !b && !it.gone ? arrivalOf(it) : null;
  const late = arr && f.date && arr > f.date;
  const deliveryHtml = !arr ? "" : late
    ? `<div class="late-box">${I("cal")}<span>Cuidado: si lo pides hoy, este artículo llegaría el ${esc(fShort(arr))} y tu festejo es el ${esc(fShort(f.date))}.</span></div>`
    : `<span class="ontime">${I("check")}Si lo pides hoy, llegaría el ${esc(fShort(arr))}${f.date ? ". Llega a tiempo." : "."}</span>`;
  app.innerHTML = `<div class="wrap no-nav screen" style="padding-bottom:0">
    ${topBar(`<button class="icon-btn" id="dBack" aria-label="Atrás">${I("back")}</button>`, b ? `<span class="icon-btn" aria-label="Comprado">${I("check")}</span>` : "")}
    <div class="hero-img" id="hero">${photoHtml(it)}</div>
    ${(() => { const g = galleryOf(it); return g.length > 1 ? `<div class="thumbs gal">${g.map((src, k) => `<button type="button" class="th ${isOwnImg(it, src) ? "" : "fit"}" data-src="${esc(src)}" aria-current="${k === 0}" aria-label="Foto ${k + 1}"><img src="${esc(src)}" alt="" referrerpolicy="no-referrer"></button>`).join("")}</div>` : ""; })()}
    <div class="dt-title"><h1>${esc(itemName(it))}</h1>${I("heart")}</div>
    <div class="full panel solid"><div class="in">
      <div class="meta"><span>${esc(occs)}</span><span>${esc(fiestaName(f))}</span></div>
      <div class="body">
        <p>${esc(it.gone ? "Este regalo ya no está en su wishlist, pero sigue en tus compras." : (it.note || "Sin descripción."))}</p>
        ${b ? `<span class="host">Lo que pagaste</span>` : it.gone ? "" : `<span class="host">${esc(priceNote(it, nameOf(partner())))}</span>`}
        ${deliveryHtml}
        <div class="price"><small>$</small>${esc(new Intl.NumberFormat("es-MX", { maximumFractionDigits: 2 }).format(price))}</div>
        <div class="acts">
          ${url ? `<a class="btn btn-ghost-light" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Ver tienda ${I("ext")}</a>` : `<span></span>`}
          <button class="btn btn-light" id="buy" ${short ? "disabled" : ""}>${b ? `${I("check")} Comprado` : "Ya lo compré"}</button>
        </div>
        ${short ? `<p class="short">Te faltan ${mxn(price - left)} para este regalo.</p>` : b ? `<p class="short">Toca <b>Comprado</b> otra vez si quieres desmarcarlo.</p>` : `<p class="short">Solo tú lo ves. ${esc(nameOf(partner()))} no se entera.</p>`}
      </div>
    </div></div>
  </div>`;
  app.querySelectorAll(".gal .th").forEach(b => b.addEventListener("click", () => {
    app.querySelectorAll(".gal .th").forEach(x => x.setAttribute("aria-current", String(x === b)));
    $("#hero").innerHTML = `<img src="${esc(b.dataset.src)}" alt="" referrerpolicy="no-referrer"${b.classList.contains("fit") ? ' class="fit"' : ""}>`;
  }));
  $("#dBack").addEventListener("click", () => history.length > 1 ? history.back() : location.replace("#f/" + fid));
  $("#buy").addEventListener("click", async ev => {
    const btn = ev.currentTarget; btn.disabled = true;
    try {
      await updateDoc(doc(fdb, "regalos", S.listId, "privado", me(), "fiestas", fid), {
        ["bought." + iid]: b ? deleteField() : { price: priceOf(it), title: String(itemName(it)).slice(0, 120), at: Date.now() },
      });
      toast(b ? "Desmarcado" : "Tachado. Es secreto.");
    } catch (e) { btn.disabled = false; writeErr(e); }
  });
}

/* ---------- Buscar precio, foto y entrega al momento (desde el cel, con Jina Reader) ---------- */

  function cleanTitle(t) {
    t = decode(String(t || "")).replace(/\s+/g, " ").trim();

    t = t.replace(new RegExp("\\s*[|\\-–—:]\\s*" + STORE.source + "[^|]*$", "i"), "");                   // " | Mercado Libre"

    if (t.length > 70) { const cut = t.slice(20).search(/,| - | – | \| | \(|\. /); if (cut > -1) t = t.slice(0, 20 + cut); }

  function titleOf(html, prods) {

      if (i > -1) { const m = html.slice(i, i + 8000).match(/class=["']a-offscreen["'][^>]*>\s*([^<]+)</); if (m) { const n = num(decode(m[1])); if (ok(n)) { r.price = n; r.currency = r.currency || "MXN"; } } }

// Al abrir "Mi wishlist", busca al momento lo que todavía no tiene precio ni foto de la tienda.
const lookingUp = new Set();
async function autoLookup() {
  // Regalos sin ninguna foto: buscar una en internet con su nombre.
  for (const i of myItems().filter(i => !imgOf(i) && !i.titleAuto && i.title && (!i.url || linkFresh(i)) && !lookingUp.has("w" + i.id)).slice(0, 3)) {
    lookingUp.add("w" + i.id);
    const img = await LK.searchWeb(i.title);
    if (img) { try { await updateDoc(doc(fdb, "regalos", S.listId, "items", i.id), { webImage: img }); } catch (e) {} }
  }
  const pending = myItems().filter(i => i.url && !linkFresh(i) && !lookingUp.has(i.id)).slice(0, 3);
  for (const i of pending) {
    lookingUp.add(i.id);
    const r = await LK.lookup(i.url);
    if (!r.title && (i.titleAuto || !i.title)) r.title = await LK.searchTitle(i.url);
    if (!LK.useful(r)) continue;                     // no salió nada: lo intenta GitHub en unos minutos
    const f = LK.fields(i.url, r, i);
    if ((i.titleAuto || !i.title) && r.title) { f.title = r.title.slice(0, 120); f.titleAuto = false; }
    try { await updateDoc(doc(fdb, "regalos", S.listId, "items", i.id), f); } catch (e) {}
  }
}

const VAPID_KEY = "BBAeJ9V9CTbcTl3AYxrgkdhqwP3SM7l55cJ-TdnDuH2WG11sF5ROXub4S5ZGS7Ys59P5e-ZbdM8_HqGssgGNYBQ";
const hashStr = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
function pushStateText() {
  if (!("Notification" in window) || !("serviceWorker" in navigator)) return /iPhone|iPad/.test(navigator.userAgent) ? "En iPhone: primero agrega la app a tu pantalla de inicio y ábrela desde ahí" : "Este navegador no permite avisos";
  let on = false; try { on = !!localStorage.getItem("regalos.push"); } catch (e) {}
  if (Notification.permission === "granted" && on) return "Activados en este cel · toca para probar";
  if (Notification.permission === "denied") return "Bloqueados. Actívalos en los ajustes del cel para esta app";
  return "Toca para activarlos en este cel";
}
async function enablePush() {
  const sub = $("#pushS");
  if (!("Notification" in window) || !("serviceWorker" in navigator)) { toast(pushStateText()); return; }
  try {
    if (!(await messagingSupported())) { toast("Este navegador no permite avisos con la app cerrada"); return; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("No se activaron los avisos"); if (sub) sub.textContent = pushStateText(); return; }
    const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
    let had = ""; try { had = localStorage.getItem("regalos.push") || ""; } catch (e) {}
    const token = await getToken(getMessaging(fbApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) { toast("No se pudo registrar este cel"); return; }
    await setDoc(doc(fdb, "regalos", S.listId, "privado", me(), "avisos", "t-" + hashStr(token)), { token, device: (navigator.userAgent || "").slice(0, 140), createdAt: Date.now() });
    try { localStorage.setItem("regalos.push", token); } catch (e) {}
    if (had === token) { await reg.showNotification("Regalos", { body: "Así se verán tus avisos de festividades.", icon: "icon-192.png" }); toast("Te mandé un aviso de prueba"); }
    else toast("¡Listo! Te avisaré antes de cada festividad");
    if (sub) sub.textContent = pushStateText();
  } catch (e) { console.error(e); toast(e && e.code === "permission-denied" ? "Firebase no dio permiso. Faltan las reglas nuevas." : "No se pudieron activar: " + ((e && (e.code || e.message)) || "error")); }
}

/* ---------- Agregar / editar regalo ---------- */
function compress(file, max = 900, cap = 170000) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.78, out = c.toDataURL("image/jpeg", q);
      while (out.length > cap && q > 0.35) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

        <label class="field">Precio (MXN) <span class="opt">Si pones el link, el precio se toma de la tienda y se mantiene al día. Este se usa si la tienda no deja leerlo.</span><input class="input" id="fPrice" inputmode="decimal" placeholder="${it && linkFresh(it) && Number(it.linkPrice) > 0 ? "En la tienda: " + esc(mxn(Number(it.linkPrice))) : "Ej. 450"}" value="${it && Number(it.price) > 0 ? esc(it.price) : ""}"></label>
        <div class="field">¿Para qué ocasión me lo darías? <span class="opt">Si no eliges, sirve para cualquiera</span>

        <button class="btn btn-primary btn-block" type="submit" id="fSave">${it ? "Guardar cambios" : "Agregar a mi wishlist"}</button>
        ${it ? `<button type="button" class="link-danger" id="fDel"><span class="lb">Borrar de mi wishlist</span></button>` : ""}
      </form>
    </div>`;
  const close = () => (root.innerHTML = "");
  const paintPick = () => {
    const photo = photos[0] || "";
    const showOwn = photo && (ownPhoto || !shopImg);
    $("#pickInner").innerHTML = showOwn ? `<img src="${photo}" alt=""><span class="chg">Tu foto · cambiar</span>`
      : shopImg ? `<img class="fit" src="${esc(shopImg)}" alt="" referrerpolicy="no-referrer"><span class="chg">Foto de la tienda · poner la mía</span>`
      : webImage ? `<img class="fit" src="${esc(webImage)}" alt="" referrerpolicy="no-referrer"><span class="chg">Foto de internet · poner la mía</span>`
      : `<span class="lbl">${I("camera")}Agregar foto<span class="opt" style="font-weight:400;font-size:.8rem;text-align:center">o déjala vacía: se pone la de la tienda del link</span></span>`;
    $("#useShop").hidden = !(shopImg && showOwn);
    // Fila de fotos propias: tocar una la vuelve principal, la × la quita, y "+" agrega más (hasta 4).
    $("#thumbs").innerHTML = photos.map((src, k) => `<span class="th" data-k="${k}" aria-current="${showOwn && k === 0}"><img src="${src}" alt=""><button type="button" class="rm" data-rm="${k}" aria-label="Quitar foto ${k + 1}">×</button></span>`).join("")

    const more = $("#fPhotos");
    if (more) more.addEventListener("change", async e => {
      const files = [...(e.target.files || [])].slice(0, 4 - photos.length);
      for (const f of files) { try { photos.push(await compress(f)); } catch (err) { toast("No se pudo leer una de las fotos."); } }
      if (!shopImg && photos.length) ownPhoto = true;
      paintPick();
    });
  };
  paintPick();
  let lookSeq = 0;
  const showLookup = (html, cls = "") => { const el = $("#lookup"); if (el) { el.className = "lookup " + cls; el.innerHTML = html; } };
  async function runLookup() {
    const raw = $("#fUrl").value.trim(), url = raw ? safeUrl(raw) : "";
    if (!url || (found && found.url === url) || (it && it.url === url && linkFresh(it))) return;

    const r = await LK.lookup(url);
    if (seq !== lookSeq || !$("#lookup")) return;
    found = { url, r };
    if (r.failed && !r.blocked) { showLookup("No pude abrir la tienda ahora. Guárdalo y lo busco de nuevo en unos minutos.", "warn-t"); return; }
    const ft = $("#fTitle");
    if (!r.title && ft && !ft.value.trim()) { showLookup(`<span class="spin">${I("refresh")}</span> Buscando el nombre del producto…`, "busy"); r.title = await LK.searchTitle(url); if (seq !== lookSeq || !$("#lookup")) return; }
    if (r.title && ft && (!ft.value.trim() || ft.dataset.auto === "1")) { ft.value = r.title; ft.dataset.auto = "1"; }

    else if (!photos.length) {
      const q = r.title || $("#fTitle").value.trim();
      if (q) { showLookup(`<span class="spin">${I("refresh")}</span> La tienda no dio foto. Buscándola en internet…`, "busy"); const w = await LK.searchWeb(q); if (seq !== lookSeq || !$("#lookup")) return; if (w) { webImage = w; r.webFound = true; paintPick(); } }
    }
    const bits = [];
    if (r.ok) bits.push(`Precio: <b>${esc(mxn(r.price))}</b>`);
    if (r.deliveryDays != null) bits.push(`llega en ${r.deliveryDays === 0 ? "el mismo día" : r.deliveryDays === 1 ? "1 día" : r.deliveryDays + " días"}`);
    if (r.title || r.image) bits.push(r.title && r.image ? "nombre y foto listos" : r.title ? "nombre listo" : "foto lista");
    if (r.webFound) bits.push("foto de internet (puede no ser exacta)");
    if (bits.length) { showLookup(`${I("check")} ${bits.join(" · ")}`, "done"); if (r.ok && !$("#fPrice").value) $("#fPrice").placeholder = "En la tienda: " + mxn(r.price); }
    else showLookup(r.blocked ? "La tienda no dejó leer la página. Pon un precio aproximado y una foto." : "No encontré el precio en esa página. Pon uno aproximado.", "warn-t");
  }
  $("#fTitle").addEventListener("input", e => { e.target.dataset.auto = ""; });
  const fUrl = $("#fUrl");
  fUrl.addEventListener("paste", () => setTimeout(runLookup, 50));
  fUrl.addEventListener("change", runLookup);
  fUrl.addEventListener("blur", runLookup);
  $("#useShop").addEventListener("click", () => { ownPhoto = false; paintPick(); });
  $("#sheetX").addEventListener("click", close);
  $("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") close(); });
  $("#fPhoto").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try { photos.unshift(await compress(file)); photos = photos.slice(0, 4); ownPhoto = true; paintPick(); }
    catch (err) { toast("No se pudo leer esa foto. Prueba con otra."); }
  });
  root.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => {

  const del = $("#fDel");

  $("#itemForm").addEventListener("submit", async ev => {

    const rawUrl0 = $("#fUrl").value.trim();

    const body = {
      title, titleAuto, price: price > 0 ? price : 0, url: rawUrl ? safeUrl(rawUrl) : "", photo: photos[0] || "", photos, ownPhoto: !!(ownPhoto && photos.length), webImage: webImage || "",
      occasions: OCCASIONS.map(o => o.k).filter(k => sel.has(k)),

    } catch (e) { $("#fSave").disabled = false; writeErr(e); }
  });
}

/* ---------- Datos ---------- */
let unsubs = [];
function stopAll() { unsubs.forEach(u => u()); unsubs = []; }
function dataRender() { if (route().v !== "wizard") render(); }

function openList(id) {
  stopAll();
  S.listId = id; S.loaded = false; S.stale = false;
  if (joinId) history.replaceState(null, "", location.pathname + location.hash);
  let got = { list: false, items: false, fiestas: false };
  const timer = setTimeout(() => { if (!S.loaded) { S.stale = true; render(); } }, 10000);
  const done = k => {
    got[k] = true;
    if (got.list && got.items && got.fiestas) { S.loaded = true; clearTimeout(timer); if (justRefreshed) { justRefreshed = false; setTimeout(() => toast("Listo, todo actualizado"), 300); } }
    dataRender();
  };
  const denied = part => err => {
    clearTimeout(timer);
    S.error = err && err.code === "permission-denied"
      ? (part === "fiestas"
        ? "Firebase no deja leer tus festividades secretas. Las reglas publicadas en Firebase son las viejas: en Firestore Database → Rules pega las reglas nuevas (deben incluir la palabra “privado”) y dale Publicar."
        : `Firebase no dio permiso para leer ${part === "items" ? "los regalos" : "la lista"}. Revisa que en Firestore Database → Rules estén las reglas nuevas y dale Publicar.`)
      : "No se pudo cargar la lista. Revisa tu internet y recarga.";
    render();
  };
  unsubs.push(onSnapshot(doc(fdb, "regalos", id), snap => { S.list = snap.exists() ? snap.data() : null; done("list"); }, denied("list")));
  unsubs.push(onSnapshot(collection(fdb, "regalos", id, "items"), snap => { S.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); done("items"); }, denied("items")));
  unsubs.push(onSnapshot(collection(fdb, "regalos", id, "privado", me(), "fiestas"), snap => { S.fiestas = snap.docs.map(d => ({ id: d.id, ...d.data() })); done("fiestas"); }, denied("fiestas")));
}

async function findList() {
  S.error = "";
  try {
    if (joinId) {
      const ref = doc(fdb, "regalos", joinId);
      const snap = await getDoc(ref);
      if (!snap.exists()) { S.error = "Ese link de invitación no existe. Pide que te lo manden otra vez."; return render(); }
      const d = snap.data();
      if (!(d.members || []).includes(me())) {
        if ((d.members || []).length >= 2) { S.error = "Esa lista ya tiene a dos personas."; return render(); }
        await updateDoc(ref, { members: arrayUnion(me()), ["names." + me()]: firstName(S.user) });
      }
      return openList(joinId);
    }
    const res = await getDocs(query(collection(fdb, "regalos"), where("members", "array-contains", me()), limit(1)));
    if (!res.empty) return openList(res.docs[0].id);
    S.list = null; S.loaded = true; render();
  } catch (e) {
    S.error = e && e.code === "permission-denied" ? "Firebase no dio permiso para buscar tu lista. Revisa que en Firestore Database → Rules estén las reglas nuevas y dale Publicar." : "No se pudo conectar. Revisa tu internet y recarga.";
    render();
  }
}
