    const anchor=pd($("#lNext").value||todayS()), fq=$("#lFreq").value, day=anchor.getDate(); let rows="";
    for(let j=Math.min(pb,n)+1;j<=n&&j<=Math.min(pb,n)+120;j++){ rows+=`<tr><td>${j}</td><td class="small">${fDate(ds(stepDate(anchor,fq,j-pb-1,day)))}</td><td class="r"><input type="number" step="0.01" inputmode="decimal" data-j="${j}" value="${sch[j]||""}" placeholder="${$("#lCuota").value||"0.00"}" style="max-width:140px;padding:7px 9px;font-size:14px"></td></tr>`; }
    $("#lSch").innerHTML=rows||`<tr><td colspan="3" class="muted small">Ya no te faltan pagos.</td></tr>`;

  drawSch(); info();
  $("#lSave").onclick=async()=>{
    const name=$("#lName").value.trim(), o=vals();
    if(!name){ $("#lErr").textContent="Ponle un nombre al crédito."; return; }
    if(!(o.n>=1)){ $("#lErr").textContent="Escribe el número total de pagos."; return; }
    if(!(o.c>0) && !(o.v && Array.from({length:o.n-o.pb},(_,i)=>sch[o.pb+i+1]).every(x=>x>0))){ $("#lErr").textContent=o.v?"Escribe el pago base o el monto de cada pago que falta.":"Escribe cuánto pagas cada vez."; return; }
    if(o.pb>o.n){ $("#lErr").textContent=`Los pagos que ya hiciste deben ser de 0 a ${o.n}.`; return; }
    const schedule=o.v?Array.from({length:o.n},(_,i)=>r2(sch[i+1]||0)):[];
    const base=o.c>0?o.c:(schedule.find(x=>x>0)||0);
    await put({...(l.id?l:{}),kind:"loan",name,ltype:$("#lType").value,payCardId:$("#lCard").value,cuota:r2(base),variable:o.v,schedule,freq:$("#lFreq").value,total:o.n,paidBefore:o.pb,nextDate:$("#lNext").value||todayS(),principal:o.pr,rate:+$("#lRate").value||0,color:$("#lsw .on")?.dataset.col||CARD_COLORS[0],createdAt:l.createdAt||Date.now()});
    closeDialog(); toast(isNew?"Crédito agregado":"Crédito guardado");
  };
}

/* ---------- Compras futuras ---------- */
function futMethod(pk){
  if(!pk) return "";
  return pk.type==="card"?`con ${pk.card.name}${pk.months?` a ${pk.months} MSI`:""}`:`con ${pk.cashName||"efectivo o débito"}`;
}
function futPlanStatus(fid){
  const plan=buildPlan(); const lines=plan.periods.flatMap(p=>p.lines);
  const cash=lines.find(l=>l.o.kind==="futuro"&&!l.o.carried&&l.o.fut&&l.o.fut.id===fid&&l.o.k===0);
  if(cash){ const paid=r2(cash.pay+cash.completions.reduce((s,c)=>s+c.amt,0)); return {type:"cash",line:cash,paidNow:cash.pay,completions:cash.completions,rest:Math.max(0,r2(cash.o.amount-paid)),fromSav:cash.o.fromSav}; }
  const card=lines.find(l=>l.o.kind==="tarjeta"&&!l.o.carried&&(l.o.futs||[]).some(f=>f.fid===fid&&f.k===0));
  if(card){ const paid=r2(card.pay+card.completions.reduce((s,c)=>s+c.amt,0)); return {type:"card",line:card,fu:card.o.futs.find(f=>f.fid===fid&&f.k===0),complete:card.short<=0.009,completions:card.completions,rest:Math.max(0,r2(card.o.amount-paid))}; }
  return null;
}
function planStatusHtml(r){
  const st=futPlanStatus(r.f.id); const p=r.pick; if(!p) return "";
  const cmpl=c=>c.map(x=>`${money(x.amt)} el ${fDateS(ds(x.date))}`).join(", ");
  if(!st) return `<div class="small muted" style="margin-top:6px">Se paga después del periodo que cubre tu plan.</div>`;
  if(st.type==="cash"){
    if(st.line.short<=0.009) return `<div style="margin-top:6px">En tu plan: ese día pagas <b class="num">${money(st.paidNow)}</b>${st.fromSav.length?` y tomas ${st.fromSav.map(x=>`${money(x.amt)} de ${esc(x.acc.name)}`).join(" y ")}`:""}. Completo.</div>`;
    return `<div style="margin-top:6px">En tu plan: ese día alcanzas a pagar <b class="num">${money(st.paidNow)}</b>${st.completions.length?` y lo completas con ${cmpl(st.completions)}`:""}.${st.rest>0.009?` Al final del plan aún faltarían <b class="num">${money(st.rest)}</b>.`:""}</div>`;
  }
  const co=st.line.o;
  return `<div style="margin-top:6px">En tu plan: se paga junto con ${esc(co.card.name)} el <b>${fDate(ds(co.date))}</b> (fecha límite ${fDateS(ds(co.due))})${st.fu.months?`, primera de ${st.fu.months} mensualidades de ${money(st.fu.amt)}`:""}.${st.complete?"":` Ese pago de la tarjeta queda incompleto: alcanzas ${money(st.line.pay)}${st.completions.length?` y completas ${cmpl(st.completions)}`:""}${st.rest>0.009?`; faltarían ${money(st.rest)}`:""}.`}</div>`;
}
function recoText(r){
  const p=r.pick, f=r.f;
  if(p&&p.forced){
    const why=r.options.filter(o=>o.why).map(o=>`<li>${o.type==="card"?esc(o.card.name):esc(o.cashName||"Efectivo o débito")}: ${esc(o.why)}</li>`).join("");
    const how=p.type==="card"?`${esc(futMethod(p))} el ${fDate(ds(p.date))} y se paga hasta el ${fDate(ds(p.due))}`:`${esc(futMethod(p))} el ${fDate(ds(p.date))}`;
    return `<div class="note warn"><b>No te alcanza completo el ${fDate(ds(r.by))}, pero ya está en tu plan de pagos.</b>
      <div style="margin-top:4px">Lo puse ${how}.${p.savTotal>0.009?` Usa <b class="num">${money(p.savTotal)}</b> de tus apartados.`:""}</div>
      ${planStatusHtml(r)}
      <div class="small" style="margin-top:6px">Para que alcance: cambia la fecha, págala a meses sin intereses${f.allowSavings?"":", permite usar tus apartados"} o elige otra tarjeta.</div></div>`;
  }
  if(!p){
    const why=r.options.filter(o=>o.why).map(o=>`<li>${o.type==="card"?esc(o.card.name):esc(o.cashName||"Efectivo o débito")}: ${esc(o.why)}</li>`).join("");
    return `<div class="note bad"><b>No te alcanza el ${fDate(ds(r.by))}.</b>${why?`<ul style="margin:6px 0 0;padding-left:18px">${why}</ul>`:""}
      <div class="small" style="margin-top:6px">Prueba con una fecha límite más lejana, a meses sin intereses${f.allowSavings?"":", o permitiendo usar tus apartados"}.</div></div>`;
  }
  const sav=p.payments.flatMap(x=>x.fromSav); const savTxt=sav.length?`<div style="margin-top:6px">Para cubrirlo toma <b>${[...new Map(sav.map(x=>[x.acc.id,{acc:x.acc,amt:0}])).values()].map(v=>{ v.amt=sav.filter(x=>x.acc.id===v.acc.id).reduce((s,x)=>s+x.amt,0); return `${money(v.amt)} de ${esc(v.acc.name)}`; }).join(" y ")}</b>.</div>`:"";
  if(p.type==="card"){ const prevCut=lastCutOnOrBefore(p.card,addDays(p.date,-1)); const right=daysBetween(prevCut,p.date)<=1;
  return `<div class="note good"><b>Compra el ${fDate(ds(p.date))} ${esc(futMethod(p))}.</b>
    <div style="margin-top:4px">${right?`Es justo después del corte del ${fDateS(ds(prevCut))}: `:""}entra en el corte del ${fDateS(ds(p.cut))} y la pagas hasta el <b>${fDate(ds(p.due))}</b>, ${p.float} días después de comprarla.${p.months?` Pagarás <b class="num">${money(p.cuota)}</b> al mes.`:` Págala completa ese día para no generar intereses.`} La tarjeta quedaría al ${Math.round(p.utilAfter*100)}% de uso.</div>${savTxt}${planStatusHtml(r)}</div>`; }
  return `<div class="note good"><b>Compra el ${fDate(ds(p.date))} ${esc(futMethod(p))}.</b><div style="margin-top:4px">${p.savNeed>0?"Con tus ingresos no alcanza sin descuadrar tus otros pagos.":"Ese día ya tienes el dinero sin descuadrar tus otros pagos."}</div>${savTxt}${planStatusHtml(r)}</div>`;
}

const dlg=$("#dlg");
function openDialog(title,body,foot){
  $("#dlgInner").innerHTML=`<div class="dlg-h"><h2 style="font-size:18px">${title}</h2><button class="btn sm ghost" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="dlg-b">${body}</div>${foot?`<div class="dlg-f">${foot}</div>`:""}`;
  if(!dlg.open) dlg.showModal();
  $("#dlgInner .dlg-b").scrollTop=0;

}
function addCustomSwatch(box){
  const sel=box.dataset.sel||""; const known=[...box.querySelectorAll("button")].some(b=>b.dataset.col===sel);
  const wrap=document.createElement("span"); wrap.style.cssText="position:relative;display:inline-block;width:30px;height:30px";
  const b=document.createElement("button"); b.type="button"; b.tabIndex=-1; b.className="custom"+(sel&&!known?" on":""); b.setAttribute("aria-hidden","true");
  b.dataset.col=sel&&!known?sel:"#ff7a59";
  const paint=c=>{ b.style.boxShadow=`0 0 0 2.5px var(--fg), inset 0 0 0 9px ${c}`; };
  if(sel&&!known) paint(sel);
  const inp=document.createElement("input"); inp.type="color"; inp.setAttribute("aria-label","Elegir otro color");
  inp.value=/^#[0-9a-f]{6}$/i.test(b.dataset.col)?b.dataset.col:"#ff7a59";
  inp.style.cssText="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none";
  const pick=()=>{ box.querySelectorAll("button").forEach(x=>{ x.classList.remove("on"); if(x!==b) x.style.boxShadow=""; }); b.dataset.col=inp.value; b.classList.add("on"); paint(inp.value); };
  inp.addEventListener("input",pick); inp.addEventListener("change",pick);
  box.querySelectorAll("button").forEach(x=>{ if(x!==b) x.addEventListener("click",()=>{ b.classList.remove("on"); b.style.boxShadow=""; }); });
  wrap.appendChild(b); wrap.appendChild(inp); box.appendChild(wrap);
}
function closeDialog(){ if(dlg.open) dlg.close(); }

function cutPayDefaults(c){
  if(!c||c.type!=="credito"&&c.type) return {cut:"",pay:""};
  if(c.cycleCut&&c.cyclePay&&pd(c.cyclePay)>=today()) return {cut:c.cycleCut,pay:c.cyclePay};
  if(!c.cutDay||!c.payDay) return {cut:"",pay:""};
  const st=cardState(c); return {cut:ds(st.stmtCut>=today()?st.stmtCut:st.nextCut),pay:ds(st.stmtCut>=today()?st.nextPay:nextPayOnOrAfter(c,addDays(st.nextCut,1)))};

function payForm(cardId,planId){
  const cr=all("card").filter(c=>c.type!=="efectivo");
  const lo=all("loan").filter(l=>loanState(l).next);
  if(!cr.length){ if(lo.length) return loanPayForm(); toast("Primero agrega una tarjeta o un crédito"); return; }
  cardId=cardId||(cr.find(c=>c.type==="credito")||cr[0]).id;
  openDialog("Registrar pago",`
    <div class="fgrid">
      <label class="f">Tarjeta o crédito<select id="pCard"><optgroup label="Tarjetas">${cr.map(c=>`<option value="${c.id}" ${c.id===cardId?"selected":""}>${esc(c.name)}${c.type==="debito"?" (depósito)":""}</option>`).join("")}</optgroup>${lo.length?`<optgroup label="Créditos y préstamos">${lo.map(l=>`<option value="loan:${l.id}">${esc(l.name)}</option>`).join("")}</optgroup>`:""}</select></label>
      <label class="f">Fecha<input type="date" id="pDate" value="${todayS()}"></label>
    </div>
    <div id="pQuick" class="row"></div>
    <label class="f">Monto<input type="number" id="pAmt" step="0.01" inputmode="decimal" placeholder="0.00"></label>
    <label class="f" id="pFromL">Pagado desde<select id="pFrom"></select></label>
    <div id="pLoans" class="view" style="gap:6px"></div>
    <label class="f" id="pTgtL">Aplicar a<select id="pTgt"></select></label>
    <label class="f">Nota (opcional)<input type="text" id="pNote" placeholder="Ej. pago quincena"></label>
    <div id="pPrev"></div><div class="small" id="pErr" style="color:var(--bad)"></div>`,
    `<span></span><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="pSave">Guardar pago</button></div>`);
  const fill=()=>{
    const c=get($("#pCard").value); const st=cardState(c);
    $("#pTgtL").hidden=!st.isCredit; $("#pQuick").hidden=!st.isCredit; $("#pLoans").innerHTML=""; $("#pFromL").hidden=!st.isCredit;
    $("#pFrom").innerHTML=fromOptions();
    if(st.isCredit){
      const act=st.plans.filter(p=>p.paid<p.total-0.009);
      $("#pTgt").innerHTML=`<option value="auto">Automático: mensualidades vencidas y luego saldo</option>`+act.map(p=>`<option value="${p.id}" ${p.id===planId?"selected":""}>Adelantar: ${esc(p.exp.desc||p.exp.category)} (falta ${money(p.total-p.paid)})</option>`).join("");
      $("#pLoans").innerHTML=st.loanItems.map(x=>`<label class="row small" style="font-weight:600"><input type="checkbox" class="pLoan" value="${x.loan.id}" data-amt="${x.amt}"> Incluye el pago de ${esc(x.loan.name)} (${money(x.amt)})</label>`).join("");
      $$(".pLoan").forEach(cb=>cb.onchange=()=>{ const v=+$("#pAmt").value||0, a=+cb.dataset.amt; $("#pAmt").value=r2(Math.max(0,cb.checked?v+a:v-a))||""; prev(); });
      $("#pQuick").innerHTML=[...(st.loanDue>0?[["Total + préstamos",r2(st.payTotal+st.loanDue),"all"]]:[]),["Pago total",st.payTotal],["Sólo mensualidades MSI",st.msiDue],["Liquidar todo (incluye MSI que faltan)",st.debt]].filter(x=>x[1]>0).map(([l,v])=>`<button type="button" class="btn sm" data-amt="${v}">${l}: ${money(v)}</button>`).join("");
      $$("#pQuick [data-amt]").forEach((b,i)=>b.onclick=()=>{ $$(".pLoan").forEach(cb=>cb.checked=(st.loanDue>0&&i===0)); $("#pAmt").value=b.dataset.amt; prev(); });
      if(st.payTotal>0 && !planId){ $("#pAmt").value=st.payTotal; }
    }
    prev();
  };
  const prev=()=>{
    const c=get($("#pCard").value); const total=+$("#pAmt").value||0; const box=$("#pPrev");
    const loanAmt=r2($$(".pLoan:checked").reduce((s,cb)=>s+(+cb.dataset.amt),0)); const amt=r2(total-loanAmt);
    if(!total||c.type!=="credito"){ box.innerHTML=""; return; }
    if(amt<0){ box.innerHTML=`<div class="note bad">El monto no alcanza para el pago del préstamo (${money(loanAmt)}).</div>`; return; }
    if(amt<0.01){ box.innerHTML=`<div class="note good">Todo el pago (${money(loanAmt)}) se registra como pago de tu préstamo.</div>`; return; }
    const tmp={id:"__preview",kind:"pay",cardId:c.id,amount:amt,date:$("#pDate").value||todayS(),target:$("#pTgt").value,createdAt:Date.now()};
    S.items.set(tmp.id,tmp); cacheState.clear(); const st=cardState(c); S.items.delete(tmp.id); const parts=st.allocs[tmp.id]||[]; cacheState.clear();
    const lbl={mensualidad:"Mensualidad de",adelanto:"Adelanto a",saldo:"Saldo normal",favor:"Saldo a favor"};
    box.innerHTML=`<div class="note good">${loanAmt?`De tu pago, <b class="num">${money(loanAmt)}</b> van al préstamo y <b class="num">${money(amt)}</b> a la tarjeta.<br>`:""}<b>Este pago libera ${money(amt)} de crédito.</b> Disponible después: <b class="num">${money(st.avail)}</b><div class="alloc" style="color:inherit">${parts.map(a=>{ const pl=st.plans.find(x=>x.id===a.to); return `<span>· ${lbl[a.kind]} ${pl?`<b>${esc(pl.exp.desc||"compra a meses")}</b>`:""}: <span class="num">${money(a.amt)}</span>${pl?` → falta <span class="num">${money(pl.total-pl.paid)}</span> de esa compra (${Math.max(0,pl.months-Math.floor((pl.paid+0.01)/pl.cuota))} mensualidades)`:""}</span>`; }).join("")}</div></div>`;
  };
  $("#pCard").onchange=()=>{ const v=$("#pCard").value; if(v.startsWith("loan:")) return loanPayForm(v.slice(5)); planId=null; fill(); }; $("#pAmt").oninput=prev; $("#pTgt").onchange=prev; $("#pDate").onchange=prev; fill();
  $("#pSave").onclick=async()=>{
    const total=+$("#pAmt").value; if(!(total>0)){ $("#pErr").textContent="Escribe el monto que pagaste."; return; }
    const c=get($("#pCard").value); const date=$("#pDate").value||todayS();
    const loans=c.type==="credito"?$$(".pLoan:checked").map(cb=>({id:cb.value,amt:+cb.dataset.amt})):[];
    const loanAmt=r2(loans.reduce((s,x)=>s+x.amt,0)); const amt=r2(total-loanAmt);
    if(amt<0){ $("#pErr").textContent="El monto no alcanza para el pago del préstamo."; return; }
    const fromId=c.type==="credito"?$("#pFrom").value:""; try{ if(c.type==="credito") localStorage.setItem("mc-from",fromId); }catch(e){}
    for(const x of loans) await put({kind:"loanpay",loanId:x.id,amount:r2(x.amt),date,fromId,note:"Pagado con "+c.name,createdAt:Date.now()});
    if(amt>0.009) await put({kind:"pay",cardId:c.id,amount:amt,date,fromId,target:c.type==="credito"?$("#pTgt").value:"auto",note:$("#pNote").value.trim(),createdAt:Date.now()});
    closeDialog(); toast(loans.length?`Pago registrado: ${money(amt)} a la tarjeta y ${money(loanAmt)} al préstamo`:`Pago registrado: liberaste ${money(amt)}`);
  };
}

    ${f.type==="ingreso"?`<div class="small muted">Con la fecha de un pago y cada cuánto te pagan, la app calcula sola tus siguientes pagos. Solo cuenta los que vienen; no da por hecho que ya tienes ese dinero.</div>`:""}
    <label class="row small"><input type="checkbox" id="fAct" ${f.active!==false?"checked":""}> Activo</label>
    <div class="small" id="fErr" style="color:var(--bad)"></div>`,
    `<div class="confirm" id="delZone">${isNew?"":`<button class="btn danger" data-act="askDelete" data-id="${f.id}">Borrar</button>`}</div><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="fSave">Guardar</button></div>`);
  const upd=()=>{ const q=$("#fFreq").value; $("#fDayL").hidden=q!=="mensual"; $("#fDateL").hidden=q==="mensual"||q==="quincenal"; $("#fDateT").textContent=q==="unico"?"Fecha":(f.type==="ingreso"?"Fecha de tu último pago (o del siguiente)":"Primera fecha"); };
  $("#fFreq").onchange=upd; upd();
  $("#fSave").onclick=async()=>{
    const amt=+$("#fAmt").value, name=$("#fName").value.trim();
    if(!name||!(amt>0)){ $("#fErr").textContent="Escribe nombre y monto."; return; }
    await put({...(f.id?f:{}),kind:"flow",type:f.type,name,amount:r2(amt),freq:$("#fFreq").value,day:+$("#fDay").value||1,date:$("#fDate").value||todayS(),active:$("#fAct").checked});
    closeDialog(); toast("Guardado");
  };
}

/* ----- metas ----- */
function goalForm(g){
  const isNew=!g; g=g||{color:CAT_COLORS[all("goal").length%CAT_COLORS.length],saved:0,history:[]};
  openDialog(isNew?"Nueva meta de ahorro":"Editar meta",`
    <label class="f">Nombre<input type="text" id="gName" value="${esc(g.name||"")}" placeholder="Ej. Fondo de emergencia"></label>
    <div class="fgrid">
      <label class="f">Meta<input type="number" id="gTgt" step="0.01" value="${g.target||""}"></label>
      ${isNew?`<label class="f">Ya llevo<input type="number" id="gSaved" step="0.01" value=""></label>`:""}
      <label class="f">Fecha objetivo (opcional)<input type="date" id="gDl" value="${g.deadline||""}"></label>
    </div>
    <div class="small" id="gErr" style="color:var(--bad)"></div>`,
    `<span></span><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="gSave">Guardar</button></div>`);
  $("#gSave").onclick=async()=>{
    const name=$("#gName").value.trim(), tgt=+$("#gTgt").value; if(!name||!(tgt>0)){ $("#gErr").textContent="Escribe nombre y monto de la meta."; return; }
    const o={...g,kind:"goal",name,target:r2(tgt),deadline:$("#gDl").value||""};
    if(isNew){ const s0=+$("#gSaved").value||0; o.saved=r2(s0); o.history=s0?[{date:todayS(),amount:r2(s0)}]:[]; }
    await put(o); closeDialog(); toast("Meta guardada");
  };
}
function goalDetail(id){
  const g=get(id); if(!g) return;
  openDialog(esc(g.name),`
    <div class="spread"><span class="num" style="font-size:24px">${money(g.saved)}</span><span class="muted">de ${money(g.target)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,(g.saved/g.target)*100)}%;background:${g.color}"></i></div>
    <div class="fgrid"><label class="f">Monto<input type="number" id="gAmt" step="0.01" inputmode="decimal"></label><label class="f">Fecha<input type="date" id="gDate" value="${todayS()}"></label></div>
    <div class="row"><button class="btn pri" id="gAdd">＋ Aportar</button><button class="btn" id="gSub">− Retirar</button></div>
    <h3>Movimientos</h3>
    ${(g.history||[]).length?`<div class="list">${g.history.slice().reverse().map(h=>`<div class="item" style="cursor:default"><div class="main">${fDate(h.date)}</div><span class="num" style="color:${h.amount<0?"var(--bad)":"var(--good)"}">${h.amount<0?"":"+"}${money(h.amount)}</span></div>`).join("")}</div>`:`<p class="muted small">Sin movimientos.</p>`}`,
    `<div class="confirm" id="delZone"><button class="btn danger" data-act="askDelete" data-id="${g.id}">Borrar meta</button></div><button class="btn" data-act="editGoal" data-id="${g.id}">Editar</button>`);
  const mv=async sign=>{ const a=+$("#gAmt").value; if(!(a>0)) return; const h=(g.history||[]).concat([{date:$("#gDate").value||todayS(),amount:r2(sign*a)}]); await put({...g,history:h,saved:r2((+g.saved||0)+sign*a)}); goalDetail(id); toast(sign>0?"Aporte guardado":"Retiro guardado"); };
  $("#gAdd").onclick=()=>mv(1); $("#gSub").onclick=()=>mv(-1);
}

/* ================= acciones globales ================= */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(t.tagName==="A" && t.getAttribute("href")!=="#") return;
  ev.preventDefault();
  switch(a){
    case "close": closeDialog(); break;
    case "signIn": signIn(); break;
    case "newCard": cardForm(); break;
    case "editCard": cardForm(get(id)); break;
    case "openCard": cardDetail(id); break;
    case "newExp": if(!all("card").length&&!S.items.size){ /* permite efectivo */ } expForm(); break;
    case "editExp": expForm(get(id)); break;
    case "openExp": expDetail(id); break;
    case "newPay": payForm(t.dataset.card,t.dataset.plan); break;
    case "delPay": { if(t.dataset.sure){ await del(id); toast("Pago borrado"); closeDialog(); } else { t.dataset.sure="1"; t.textContent="¿Borrar?"; t.classList.add("danger"); } break; }
    case "newFlow": flowForm(null,t.dataset.type); break;
    case "newSalary": flowForm({type:"ingreso",name:"Sueldo",freq:"catorcenal",date:todayS(),active:true},"ingreso"); break;
    case "editFlow": flowForm(get(id)); break;
    case "newGoal": goalForm(); break;
    case "newLoan": loanForm(); break;
    case "newFuture": futureForm(); break;
    case "planAdd": planAddMenu(); break;
    case "stmtPaid": stmtPaidForm(id); break;
    case "planSettings": planSettingsForm(); break;
    case "editFuture": futureForm(get(id)); break;
    case "buyFuture": buyFuture(id); break;
    case "newAccount": accountForm(); break;
    case "editAccount": accountForm(get(id)); break;
    case "openAccount": accountDetail(id); break;
    case "editLoan": loanForm(get(id)); break;
    case "openLoan": loanDetail(id); break;
    case "payLoan": loanPayForm(id); break;
    case "editGoal": goalForm(get(id)); break;
    case "openGoal": goalDetail(id); break;
    case "zoom": openLightbox(t.src); break;
    case "loadSample": loadSample(); break;
    case "askDelete": {
      const o=get(id); const z=$("#delZone");
      const extra=o&&o.kind==="loan"?` Se borrarán también sus ${all("loanpay").filter(p=>p.loanId===id).length} pagos registrados.`:o&&o.kind==="card"?` Se borrarán también sus ${all("exp").filter(e=>e.cardId===id).length} gastos y ${all("pay").filter(p=>p.cardId===id).length} pagos.`:"";
      z.innerHTML=`<span class="small">¿Seguro?${extra}</span><button class="btn danger" data-act="doDelete" data-id="${id}">Sí, borrar</button><button class="btn" data-act="cancelDelete" data-id="${id}">No</button>`; break; }
    case "cancelDelete": $("#delZone").innerHTML=`<button class="btn danger" data-act="askDelete" data-id="${id}">Borrar</button>`; break;
    case "doDelete": {
      const o=get(id);
      if(o&&o.kind==="loan"){ for(const x of all("loanpay").filter(p=>p.loanId===id)) await del(x.id); }
      if(o&&o.kind==="card"){ for(const x of [...all("exp").filter(e=>e.cardId===id),...all("pay").filter(p=>p.cardId===id)]) await del(x.id); }
      if(o&&o.kind==="exp"){ for(const p of all("pay").filter(p=>p.target===id)) await put({...p,target:"auto"}); }
      await del(id); closeDialog(); toast("Borrado"); break; }
  }
});

$("#fabPay").onclick=()=>{ if(S.mode==="signin") return signIn(); payForm(); };
const openOptions=()=>{ document.body.classList.remove("nav-open");
  openDialog("Opciones",`
    <div class="note">${S.mode==="fb"?`Sesión: <b>${esc(S.user&&S.user.email||"")}</b>. Tus datos se guardan en Firebase y solo tú puedes verlos.`:S.mode==="signin"?"No has iniciado sesión.":"Modo local: los datos viven sólo en este navegador."}</div>

    <div class="small muted" id="oMsg"></div>`);

    if(S.mode==="fb"||S.mode==="local"){ const st=settings(); await put({...st,id:"settings",kind:"settings",tema:t}); } });
  $("#oOut") && ($("#oOut").onclick=async()=>{ await FB.signOut(FB.auth); closeDialog(); toast("Sesión cerrada"); });
  $("#oMig") && ($("#oMig").onclick=async()=>{ let arr=[]; try{ arr=JSON.parse(localStorage.getItem(LKEY)||"[]"); }catch(e){} let n=0; for(const o of arr){ if(o&&o.id&&o.kind){ await put(o); n++; } } try{ localStorage.removeItem(LKEY); }catch(e){} $("#oMsg").textContent=`Subidos ${n} registros a tu cuenta.`; });
  const save=async(name,data)=>{
    if(!S.downloads){ try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }catch(e){ $("#oMsg").textContent="La descarga no está disponible en esta vista."; } return; }
    try{ await S.downloads.save({filename:name,data}); }catch(e){ $("#oMsg").textContent="No se descargó: "+(e.code||e.message||"cancelado"); }
  };
  $("#oExp").onclick=()=>save("mi-cartera-respaldo-"+todayS()+".json",JSON.stringify([...S.items.values()],null,1));
  $("#oCsv").onclick=()=>{ const rows=[["fecha","descripcion","categoria","tarjeta","monto","meses"]].concat(all("exp").sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.desc,e.category,get(e.cardId)?.name||"Efectivo",e.amount,e.msi||0]));
    save("gastos-"+todayS()+".csv","﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n")); };
  $("#oImp").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const arr=JSON.parse(await f.text()); if(!Array.isArray(arr)) throw 0; let n=0; for(const o of arr){ if(o&&o.id&&o.kind){ await put(o); n++; } } $("#oMsg").textContent=`Importados ${n} registros.`; }catch(er){ $("#oMsg").textContent="El archivo no es un respaldo válido de Mi Cartera."; } };
  $("#oWipe").onclick=()=>{ $("#wipeZone").innerHTML=`<span class="small">Se borrarán tarjetas, gastos, pagos, ingresos y metas.</span><button class="btn danger" id="oWipe2">Sí, borrar todo</button>`;
    $("#oWipe2").onclick=async()=>{ for(const id of [...S.items.keys()]) await del(id); closeDialog(); toast("Datos borrados"); }; };
};

$$(".btnMenu:not(.btnRefresh)").forEach(b=>b.onclick=openOptions);
function hardRefresh(b){ if(b) b.classList.add("spin"); toast("Actualizando…"); try{ sessionStorage.setItem("mc-refreshed","1"); }catch(e){}
  setTimeout(()=>{ const u=new URL(location.href); u.searchParams.set("v",Date.now()); location.replace(u.pathname+u.search+location.hash); },250); }

try{ if(sessionStorage.getItem("mc-refreshed")){ sessionStorage.removeItem("mc-refreshed"); setTimeout(()=>toast("Listo, ya está actualizado"),600); } }catch(e){}

let toastT;
function toast(msg){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }
