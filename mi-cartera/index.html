/* ---------- desglose y historial de gastos por mes ---------- */
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function monthlySpend(){
  const exps=all("exp"); if(!exps.length) return null;
  const by={}; exps.forEach(e=>{ const k=monthKey(e.date); const m=by[k]||(by[k]={total:0,count:0,cats:{},msi:0}); const a=+e.amount||0; m.total+=a; m.count++; const c=e.category||"Otros"; m.cats[c]=(m.cats[c]||0)+a; if(+e.msi>1) m.msi+=a; });
  const t=today(); const nowK=ds(t).slice(0,7);
  const first=Object.keys(by).sort()[0];
  // meses desde el primero con datos hasta hoy (máximo 12), incluidos los que no tuvieron gastos
  const months=[]; for(let i=0;i<12;i++){ const d=new Date(t.getFullYear(),t.getMonth()-i,1); const k=ds(d).slice(0,7); if(k<first) break; months.push(k); }
  const full=months.filter(k=>k<nowK).slice(0,6);
  const base=full.length?full:[nowK];
  const tot=k=>by[k]?by[k].total:0;
  const avg=r2(base.reduce((x,k)=>x+tot(k),0)/base.length);
  const catAvg={}; base.forEach(k=>Object.entries((by[k]||{cats:{}}).cats).forEach(([c,v])=>catAvg[c]=(catAvg[c]||0)+v/base.length));
  const cur=by[nowK]||{total:0,count:0,cats:{}}; const day=t.getDate(), dm=dim(t.getFullYear(),t.getMonth());
  const proj=r2(cur.total/day*dm);
  return {by,months,full,avg,catAvg,cur,proj,nowK,day,dm,baseN:base.length};
}
function spendHistoryHtml(){
  const m=monthlySpend(); if(!m) return "";
  const label=k=>{ const [y,mo]=k.split("-").map(Number); return MESES[mo-1]+(y!==today().getFullYear()?" "+y:""); };
  const cats=Object.entries(m.catAvg).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats.length?cats[0][1]:1;
  const maxMonth=Math.max(1,...m.months.map(k=>m.by[k]?m.by[k].total:0));
  const diff=m.avg?((m.proj-m.avg)/m.avg):0;
  const note=m.full.length>=3?`promedio de tus últimos ${m.full.length} meses completos`:m.full.length?`con ${m.full.length} mes${m.full.length>1?"es":""} completo${m.full.length>1?"s":""}; se afina conforme registres más`:"con lo de este mes; se afina conforme registres más";
  return `<div class="panel"><div class="panel-h"><h3>Tus gastos por mes</h3><span class="small muted">${note}</span></div>
    <div class="mini3">
      <div><span>Gastas aprox. al mes</span><b class="num">${money(m.avg)}</b></div>
      <div><span>En ${MESES[+m.nowK.slice(5)-1]} llevas</span><b class="num">${money(m.cur.total)}</b><small>${m.cur.count} gasto(s) · día ${m.day} de ${m.dm}</small></div>
      <div><span>Al ritmo de este mes cerrarías en</span><b class="num">${money(m.proj)}</b>${m.full.length&&m.avg?`<small><span class="chip ${diff>0.1?"warn":diff<-0.1?"good":""}">${diff>=0?"+":""}${Math.round(diff*100)}%</span> vs lo normal</small>`:""}</div>
    </div>
    <h3 style="margin:18px 0 8px;font-size:14px">Aproximado por categoría al mes</h3>
    <div class="catrows">${cats.slice(0,8).map(([c,v])=>`<div class="catrow"><span class="dot" style="background:${catColor(c)}"></span><span class="cn">${esc(c)}</span><span class="cb"><i style="width:${v/maxCat*100}%;background:${catColor(c)}"></i></span><b class="num">${money(v)}</b></div>`).join("")}
      ${cats.length>8?`<div class="small muted">y ${cats.length-8} categorías más: ${money(cats.slice(8).reduce((x,c)=>x+c[1],0))}</div>`:""}</div>
    <h3 style="margin:18px 0 8px;font-size:14px">Historial</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Mes</th><th>Gastado</th><th class="r">vs normal</th><th class="r hide-sm">Gastos</th></tr></thead><tbody>
      ${m.months.map(k=>{ const d=m.by[k]; const tt=d?d.total:0; const top=d?Object.entries(d.cats).sort((a,b)=>b[1]-a[1])[0]:null; const cur=k===m.nowK; const vs=m.avg&&!cur?(tt-m.avg)/m.avg:null;
        return `<tr><td><b>${esc(label(k))}</b>${cur?` <span class="chip acc">en curso</span>`:""}${top?`<div class="small muted">más en ${esc(top[0])} · ${money(top[1])}</div>`:""}</td>
          <td style="min-width:110px"><div class="num" style="font-weight:700">${money(tt)}</div><div class="hbar"><i style="width:${tt/maxMonth*100}%"></i></div></td>
          <td class="r">${vs==null?"—":`<span class="chip ${vs>0.1?"warn":vs<-0.1?"good":""}">${vs>=0?"+":""}${Math.round(vs*100)}%</span>`}</td>
          <td class="r num hide-sm">${d?d.count:0}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="small muted" style="margin-top:8px">Las compras a meses cuentan completas en el mes en que las hiciste.</div>
  </div>`;
}

}

function fundLine(p,purpose,sv){
  const amt=purpose==="ahorro"?p.save:p.inv, doneAmt=purpose==="ahorro"?p.saveDone:p.invDone;
  if(!(amt>0)&&!(doneAmt>0)) return "";
  const acc=purpose==="ahorro"?sv.saveAcc:sv.invAcc;
  const title=purpose==="ahorro"?"Aparta para tu fondo de ahorro":"Aparta para tu fondo de inversión";
  const canNow=p.start<=today();
  const right=doneAmt>0?`${money(doneAmt)}<div class="chip good">apartado</div>`:`${money(amt)}${canNow?`<div><button type="button" class="btn sm" data-act="didSave" data-purpose="${purpose}" data-amt="${amt}" data-per="${ds(p.start)}" style="margin-top:4px">Ya lo aparté</button></div>`:`<div class="chip">${fDateS(ds(p.start))}</div>`}`;
  return `<div class="pline"><div class="what"><b>${title}</b><div class="small muted">${acc?`a ${esc(acc.name)}`:(purpose==="ahorro"?"crea tu fondo en Ahorros":"por ejemplo en GBM+ o Cetes")}${purpose==="ahorro"&&p.saveWhy?` · ${esc(p.saveWhy)}`:""}</div></div><div class="num" style="text-align:right;white-space:nowrap;color:${purpose==="ahorro"?"var(--good)":"var(--accent)"}">${right}</div></div>`;
}
function goalLine(p,g,amt,doneAmt,acc){
  const canNow=p.start<=today();
  const right=doneAmt>0?`${money(doneAmt)}<div class="chip good">apartado</div>`:`${money(amt)}${canNow?`<div><button type="button" class="btn sm" data-act="didSave" data-purpose="meta" data-goal="${g.id}" data-amt="${amt}" data-per="${ds(p.start)}" style="margin-top:4px">Ya lo aparté</button></div>`:`<div class="chip">${fDateS(ds(p.start))}</div>`}`;
  return `<div class="pline"><div class="what"><b>Aparta para tu meta ${esc(g.name)}</b><div class="small muted">${acc?`a ${esc(acc.name)} · `:""}llevas ${money(goalSaved(g))} de ${money(g.target)}</div></div><div class="num" style="text-align:right;white-space:nowrap;color:${esc(g.color||"var(--accent)")}">${right}</div></div>`;

function fundAccount(purpose){
  const sv=saveConfig(); return purpose==="ahorro"?sv.saveAcc:sv.invAcc;
}
async function ensureFundAccount(purpose){
  let acc=fundAccount(purpose); if(acc) return acc;
  acc=await put({kind:"account",inst:"Otro",name:purpose==="ahorro"?"Fondo de ahorro":"Fondo de inversión",purpose,balance:0,rate:0,liquid:true,color:purpose==="ahorro"?"#D6D0C2":"#97C2EC",history:[],createdAt:Date.now()});
  return acc;
}
function fundDepositForm(purpose,amt,periodStart,goalId){
  const goal=purpose==="meta"?get(goalId):null;

    const v=+$("#fdAmt").value; if(!(v>0)){ $("#fdErr").textContent="Escribe cuánto apartaste."; return; }

      else a=get(to);

      a=to==="__new"?(accs.length?await put({kind:"account",inst:"Otro",name:purpose==="ahorro"?"Fondo de ahorro":"Fondo de inversión",purpose,balance:0,rate:0,liquid:true,color:purpose==="ahorro"?"#D6D0C2":"#97C2EC",history:[],createdAt:Date.now()}):await ensureFundAccount(purpose)):get(to);
    }

    await put({kind:"transfer",fromId:$("#fdFrom").value,accountId:a?a.id:"",amount:r2(v),date,purpose:purpose==="meta"?"meta:"+goalId:purpose,periodStart:periodStart||"",createdAt:Date.now()});
    closeDialog(); toast(`Apartaste ${money(v)}${purpose==="meta"&&goal?" para "+goal.name:a?" a "+a.name:""}`);
  };
}

/* ---------- Créditos y préstamos ---------- */
function loanChip(st){
  if(!st.next) return `<span class="chip good">liquidado</span>`;
  if(st.overdue) return `<span class="chip bad">${st.overdue} vencido(s)</span>`;
  if(st.daysToNext<=5) return `<span class="chip warn">${st.daysToNext===0?"hoy":st.daysToNext===1?"mañana":"en "+st.daysToNext+" días"}</span>`;
  return `<span class="chip">${fDateS(ds(st.next.date))}</span>`;
}
function vCreditos(){
  const loans=all("loan");
  if(!loans.length) return `<h2>Créditos y préstamos</h2><div class="panel empty"><b>Registra tus créditos y préstamos</b><span>Préstamo personal, de nómina, auto, hipoteca, tienda departamental o con familia. Pon cuánto pagas, cada cuándo y cuántos pagos llevas: te digo cuánto falta y lo meto en tu plan de pagos.</span><button class="btn pri" data-act="newLoan">＋ Crédito o préstamo</button></div>`;
  const sts=loans.map(loanState);
  const rem=sts.reduce((s,x)=>s+x.remaining,0), mo=sts.filter(x=>x.next).reduce((s,x)=>s+x.monthly,0);
  const nx=sts.filter(x=>x.next).sort((a,b)=>a.next.date-b.next.date)[0];
  return `<div class="spread"><h2>Créditos y préstamos</h2><button class="btn pri" data-act="newLoan">＋ Crédito o préstamo</button></div>
  <div class="grid g-kpi">
    <div class="panel kpi"><span class="lbl">Te falta pagar</span><span class="val num">${money(rem)}</span><span class="sub">${sts.filter(x=>x.next).length} crédito(s) activo(s)</span></div>
    <div class="panel kpi"><span class="lbl">Pagas al mes</span><span class="val num">${money(mo)}</span><span class="sub">cuentan como pagos fijos en tu plan</span></div>
    ${nx?`<div class="panel kpi"><span class="lbl">Próximo pago</span><span class="val num">${money(nx.next.amt)}</span><span class="sub">${esc(nx.loan.name)} · ${fDate(ds(nx.next.date))}</span></div>`:""}
  </div>
  <div class="grid g-2">
    <div class="panel"><div class="list">${sts.map(x=>`<div class="item" data-act="openLoan" data-id="${x.loan.id}" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="spread"><b><span class="dot" style="background:${x.loan.color};margin-right:6px"></span>${esc(x.loan.name)} <span class="chip">${esc(x.loan.ltype||"")}</span>${get(x.loan.payCardId)?` <span class="chip acc">${esc(get(x.loan.payCardId).name)}</span>`:""}</b>${loanChip(x)}</div>
      <div class="bar"><i style="width:${x.paidAmt/(x.totalToPay||1)*100}%;background:${x.loan.color}"></i></div>
      <div class="spread small muted"><span>${x.done} de ${x.n} pagos · ${x.variable?`pago variable${x.next?`, el siguiente ${money(x.amtOf(x.next.j))}`:""}`:`${money(x.cuota)} ${(LOAN_FREQ[x.loan.freq]||"").toLowerCase()}`}</span><span>falta <b class="num" style="color:var(--fg)">${money(x.remaining)}</b></span></div>
      ${x.next?(()=>{ const w=+x.loan.want||0; const sg=loanSuggest(x.loan); const f=w?loanFinish(x.loan,w):null;
        const why=!sg?"fuera de tu plan":sg.short>0.009?"no alcanza completo":!w?"lo que debes":sg.extra>=sg.wantExtra-0.009?"te alcanza":sg.extra>0.009?`+${money(sg.extra)} de adelanto`:"solo lo que debes";
        return `<div class="loancols">
        <div><span>Debes pagar</span><b class="num">${money(x.next.amt)}</b><small>${fDateS(ds(x.next.date))}</small></div>
        <button type="button" data-act="loanWant" data-id="${x.loan.id}"><span>Te gustaría pagar</span><b class="num">${w?money(w):"Poner"}</b><small>${f&&f.saved?`${f.saved} pago${f.saved===1?"":"s"} menos`:"para terminar antes"}</small></button>
        <div class="${sg&&sg.extra>0.009?"good":""}"><span>El plan sugiere</span><b class="num">${sg?money(sg.pay):"—"}</b><small>${why}</small></div></div>`; })():""}</div>`).join("")}</div></div>
    <div class="panel"><div class="panel-h"><h3>Todo lo que debes</h3><span class="small muted">tarjetas y créditos</span></div><div class="chart-box"><canvas id="chDebt"></canvas></div></div>
  </div>`;
}
afterRender.creditos=()=>{
  const el=$("#chDebt"); if(!el) return;
  const rows=[...all("card").filter(c=>c.type==="credito").map(c=>{ const st=cardState(c); return [c.name,st.debt,c.color]; }),...all("loan").map(l=>{ const st=loanState(l); return [l.name,st.remaining,l.color]; })].filter(r=>r[1]>0.009).sort((a,b)=>b[1]-a[1]);
  if(!rows.length){ el.parentElement.innerHTML=`<div class="empty">No debes nada. 🎉</div>`; return; }
  const tot=rows.reduce((s,r)=>s+r[1],0);
  charts.debt=new Chart(el,{type:"doughnut",data:{labels:rows.map(r=>r[0]),datasets:[{data:rows.map(r=>r2(r[1])),backgroundColor:rows.map(r=>r[2]),borderColor:cssv("--surface"),borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right",labels:{color:cssv("--muted"),boxWidth:10,usePointStyle:true,font:{size:11}}},tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.parsed)} (${Math.round(c.parsed/tot*100)}%)`}}}}});
};
function loanForm(l){
  const isNew=!l; l=l||{ltype:"Personal",freq:"mensual",color:CARD_COLORS[(all("loan").length+3)%CARD_COLORS.length],paidBefore:0,nextDate:todayS()};
  openDialog(isNew?"Nuevo crédito o préstamo":"Editar crédito",`
    <div class="fgrid">
      <label class="f">Nombre<input type="text" id="lName" value="${esc(l.name||"")}" placeholder="Ej. Préstamo Banorte"></label>
      <label class="f">Tipo<select id="lType">${LOAN_TYPES.map(t=>`<option ${t===l.ltype?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f">Se paga con<select id="lCard"><option value="">Efectivo u otra cuenta</option>${all("card").filter(c=>c.type!=="efectivo"&&!isVales(c)).map(c=>`<option value="${c.id}" ${c.id===l.payCardId?"selected":""}>${esc(c.name)} (${c.type==="credito"?"crédito":"débito"})</option>`).join("")}</select></label>
    </div>
    <div class="fgrid">
      <label class="f"><span id="lCuotaT">Pago de cada vez</span><input type="number" id="lCuota" step="0.01" inputmode="decimal" value="${l.cuota||""}" placeholder="0.00"></label>
      <label class="f">Cada cuándo<select id="lFreq">${Object.entries(LOAN_FREQ).map(([k,v])=>`<option value="${k}" ${k===l.freq?"selected":""}>${v}</option>`).join("")}</select></label>
    </div>
    <label class="f">Me gustaría pagar cada vez (opcional)<input type="number" id="lWant" step="50" inputmode="decimal" value="${+l.want||""}" placeholder="Para terminar antes"></label>
    <div class="fgrid">
      <label class="f">Número total de pagos<input type="number" id="lTotal" min="1" step="1" inputmode="numeric" value="${l.total||""}" placeholder="Ej. 24"></label>
      <label class="f">Pagos que ya hiciste<input type="number" id="lPb" min="0" step="1" inputmode="numeric" value="${l.paidBefore||0}"></label>
      <label class="f">Fecha de tu siguiente pago<input type="date" id="lNext" value="${l.nextDate||todayS()}"></label>
    </div>
    <label class="row small" style="font-weight:600"><input type="checkbox" id="lVar" ${l.variable?"checked":""}> El pago cambia (no pago lo mismo cada vez)</label>
    <div id="lVarBox" class="view" style="gap:8px">
      <div class="small muted">Escribe cuánto vas a pagar en cada pago que falta. Los que dejes vacíos usan el pago base.</div>
      <div class="tbl-wrap" style="max-height:300px;overflow-y:auto"><table><thead><tr><th>#</th><th>Fecha</th><th class="r">Monto</th></tr></thead><tbody id="lSch"></tbody></table></div>
      <div class="row"><button type="button" class="btn sm" id="lFill">Llenar vacíos con el pago base</button><button type="button" class="btn sm" id="lClear">Borrar montos</button></div>
    </div>
    <div class="fgrid">
      <label class="f">Monto que te prestaron (opcional)<input type="number" id="lPrin" step="0.01" inputmode="decimal" value="${l.principal||""}"></label>
      <label class="f">Tasa anual % (opcional)<input type="number" id="lRate" step="0.1" value="${l.rate||""}"></label>
    </div>
    <div><div class="small muted" style="font-weight:600;margin-bottom:6px">Color</div><div class="swatches" id="lsw" data-sel="${l.color}">${CARD_COLORS.map(col=>`<button type="button" style="background:${col}" data-col="${col}" class="${col===l.color?"on":""}" aria-label="Color ${col}"></button>`).join("")}</div></div>
    <div class="note" id="lInfo"></div>
    <div class="small" id="lErr" style="color:var(--bad)"></div>`,
    `<div class="confirm" id="delZone">${isNew?"":`<button class="btn danger" data-act="askDelete" data-id="${l.id}">Borrar</button>`}</div><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="lSave">Guardar</button></div>`);
  $$("#lsw button").forEach(b=>b.onclick=()=>{ $$("#lsw button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); });
  const sch={}; (Array.isArray(l.schedule)?l.schedule:[]).forEach((v,i)=>{ if(+v>0) sch[i+1]=+v; });
  const vals=()=>({c:+$("#lCuota").value||0, n:Math.floor(+$("#lTotal").value||0), pb:Math.max(0,Math.floor(+$("#lPb").value||0)), pr:+$("#lPrin").value||0, v:$("#lVar").checked});
  const amounts=({c,n,v})=>Array.from({length:n},(_,i)=> v&&sch[i+1]>0?sch[i+1]:c);
  const drawSch=()=>{ const {n,pb,v}=vals(); $("#lVarBox").hidden=!v; $("#lCuotaT").textContent=v?"Pago base (el más común)":"Pago de cada vez"; if(!v) return;
    if(!n){ $("#lSch").innerHTML=`<tr><td colspan="3" class="muted small">Primero pon el número total de pagos.</td></tr>`; return; }
    const anchor=pd($("#lNext").value||todayS()), fq=$("#lFreq").value, day=anchor.getDate(); let rows="";
    for(let j=Math.min(pb,n)+1;j<=n&&j<=Math.min(pb,n)+120;j++){ rows+=`<tr><td>${j}</td><td class="small">${fDate(ds(stepDate(anchor,fq,j-pb-1,day)))}</td><td class="r"><input type="number" step="0.01" inputmode="decimal" data-j="${j}" value="${sch[j]||""}" placeholder="${$("#lCuota").value||"0.00"}" style="max-width:140px;padding:7px 9px;font-size:14px"></td></tr>`; }
    $("#lSch").innerHTML=rows||`<tr><td colspan="3" class="muted small">Ya no te faltan pagos.</td></tr>`;
    $$("#lSch input").forEach(i=>i.oninput=()=>{ const x=+i.value; if(x>0) sch[+i.dataset.j]=x; else delete sch[+i.dataset.j]; info(); }); };
  const info=()=>{ const o=vals();
    if(!o.n||(!o.c&&!o.v)){ $("#lInfo").textContent="Pon el pago y el número de pagos para ver cuánto te falta."; return; }
    const am=amounts(o); const tot=am.reduce((s,x)=>s+x,0); const pend=am.slice(Math.min(o.pb,o.n)).reduce((s,x)=>s+x,0);
    $("#lInfo").innerHTML=`En total pagarás <b class="num">${money(tot)}</b>${o.pr?` (<b class="num">${money(Math.max(0,tot-o.pr))}</b> de intereses y comisiones)`:""}. Llevas <b>${Math.min(o.pb,o.n)} de ${o.n}</b> pagos; te faltan <b>${Math.max(0,o.n-o.pb)}</b> pagos = <b class="num">${money(pend)}</b>.`; };
  ["#lCuota","#lTotal","#lPb","#lPrin"].forEach(id=>$(id).oninput=()=>{ if(id!=="#lPrin") drawSch(); info(); });
  ["#lNext","#lFreq","#lVar"].forEach(id=>$(id).onchange=()=>{ drawSch(); info(); });
  $("#lFill").onclick=()=>{ const {c,n,pb}=vals(); if(!c) return; for(let j=pb+1;j<=n;j++) if(!(sch[j]>0)) sch[j]=c; drawSch(); info(); };
  $("#lClear").onclick=()=>{ Object.keys(sch).forEach(k=>delete sch[k]); drawSch(); info(); };
  drawSch(); info();
  $("#lSave").onclick=async()=>{
    const name=$("#lName").value.trim(), o=vals();
    if(!name){ $("#lErr").textContent="Ponle un nombre al crédito."; return; }
    if(!(o.n>=1)){ $("#lErr").textContent="Escribe el número total de pagos."; return; }
    if(!(o.c>0) && !(o.v && Array.from({length:o.n-o.pb},(_,i)=>sch[o.pb+i+1]).every(x=>x>0))){ $("#lErr").textContent=o.v?"Escribe el pago base o el monto de cada pago que falta.":"Escribe cuánto pagas cada vez."; return; }
    if(o.pb>o.n){ $("#lErr").textContent=`Los pagos que ya hiciste deben ser de 0 a ${o.n}.`; return; }
    const schedule=o.v?Array.from({length:o.n},(_,i)=>r2(sch[i+1]||0)):[];
    const base=o.c>0?o.c:(schedule.find(x=>x>0)||0);
    await put({...(l.id?l:{}),kind:"loan",name,ltype:$("#lType").value,payCardId:$("#lCard").value,cuota:r2(base),variable:o.v,schedule,freq:$("#lFreq").value,total:o.n,paidBefore:o.pb,nextDate:$("#lNext").value||todayS(),principal:o.pr,rate:+$("#lRate").value||0,want:r2(+$("#lWant").value||0),color:$("#lsw .on")?.dataset.col||CARD_COLORS[0],createdAt:l.createdAt||Date.now()});
    closeDialog(); toast(isNew?"Crédito agregado":"Crédito guardado");
  };
}

    ${st.principal?`<div class="note">Te prestaron <b class="num">${money(st.principal)}</b> y pagarás en total <b class="num">${money(st.totalToPay)}</b>: <b class="num">${money(st.interest)}</b> son intereses y comisiones${l.rate?` (tasa anual ${l.rate}%)`:""}.</div>`:""}

    <h3>Pagos que faltan</h3>
    ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Fecha</th><th class="r">Monto</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.j}</td><td>${fDate(ds(r.date))}</td><td class="r num">${money(r.amt)}</td><td>${r.date<today()?`<span class="chip bad">vencido</span>`:`<span class="chip">pendiente</span>`}</td></tr>`).join("")}</tbody></table></div>${st.n-st.done>rows.length?`<p class="small muted">y ${st.n-st.done-rows.length} pagos más.</p>`:""}`:`<div class="note good">¡Crédito liquidado!</div>`}
    <h3>Pagos registrados</h3>
    ${st.pb?`<p class="small muted">${st.pb} pago(s) hechos antes de registrarlo.</p>`:""}

    `<div class="confirm" id="delZone"><button class="btn danger" data-act="askDelete" data-id="${l.id}">Borrar</button></div><div class="row"><button class="btn" data-act="editLoan" data-id="${l.id}">${st.variable?"Editar o cambiar montos":"Editar"}</button>${st.next?`<button class="btn pri" data-act="payLoan" data-id="${l.id}">Registrar pago</button>`:""}</div>`);

function loanPayForm(id){
  const loans=all("loan").filter(l=>loanState(l).next); if(!loans.length){ toast("No tienes créditos con pagos pendientes"); return; }
  id=id&&get(id)?id:loans[0].id;
  openDialog("Pago de crédito",`
    <div class="fgrid">
      <label class="f">Crédito<select id="lpLoan">${loans.map(l=>`<option value="${l.id}" ${l.id===id?"selected":""}>${esc(l.name)}</option>`).join("")}</select></label>
      <label class="f">Fecha<input type="date" id="lpDate" value="${todayS()}"></label>
    </div>
    <div id="lpQuick" class="row"></div>
    <label class="f">Monto<input type="number" id="lpAmt" step="0.01" inputmode="decimal" placeholder="0.00"></label>
    <label class="f" id="lpFromL">Pagado desde<select id="lpFrom"></select></label>
    <label class="f">Nota (opcional)<input type="text" id="lpNote"></label>
    <div id="lpPrev"></div><div class="small" id="lpErr" style="color:var(--bad)"></div>`,
    `<span></span><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="lpSave">Guardar pago</button></div>`);
  const prev=()=>{ const st=loanState(get($("#lpLoan").value)); const a=+$("#lpAmt").value||0; if(!a){ $("#lpPrev").innerHTML=""; return; }
    const after=Math.min(st.totalToPay,st.paidAmt+a), done=st.doneFor(after);
    $("#lpPrev").innerHTML=`<div class="note good">Con este pago llevas <b>${done} de ${st.n}</b> pagos. Te faltaría <b class="num">${money(Math.max(0,st.totalToPay-after))}</b>.</div>`; };
  const fill=()=>{ const st=loanState(get($("#lpLoan").value));
    const ln=get($("#lpLoan").value); $("#lpFromL").hidden=!!(ln&&ln.payCardId); $("#lpFrom").innerHTML=fromOptions();
    $("#lpQuick").innerHTML=[["Siguiente pago",st.next.amt],["Liquidar todo",st.remaining]].filter((x,i,a)=>x[1]>0&&(i===0||x[1]!==a[0][1])).map(([t,v])=>`<button type="button" class="btn sm" data-amt="${v}">${t}: ${money(v)}</button>`).join("");
    $$("#lpQuick [data-amt]").forEach(b=>b.onclick=()=>{ $("#lpAmt").value=b.dataset.amt; prev(); });
    if(!$("#lpAmt").value) $("#lpAmt").value=st.next.amt; prev(); };
  $("#lpLoan").onchange=()=>{ $("#lpAmt").value=""; fill(); }; $("#lpAmt").oninput=prev; fill();
  $("#lpSave").onclick=async()=>{ const a=+$("#lpAmt").value; if(!(a>0)){ $("#lpErr").textContent="Escribe el monto que pagaste."; return; }
    const ln=get($("#lpLoan").value); const fromId=ln&&ln.payCardId?"":$("#lpFrom").value;
    await put({kind:"loanpay",loanId:$("#lpLoan").value,amount:r2(a),date:$("#lpDate").value||todayS(),fromId,note:$("#lpNote").value.trim(),createdAt:Date.now()});
    closeDialog(); toast("Pago de crédito registrado"); };
}

/* ---------- Compras futuras ---------- */
function futMethod(pk){
  if(!pk) return "";
  return pk.type==="card"?`con ${pk.card.name}${pk.months?` a ${pk.months} MSI`:""}`:`con ${pk.cashName||"efectivo o débito"}`;
}
function futPlanStatus(fid){
  const plan=buildPlan(); const lines=plan.periods.flatMap(p=>p.lines);
  const cash=lines.find(l=>l.o.kind==="futuro"&&!l.o.carried&&l.o.fut&&l.o.fut.id===fid&&l.o.k===0);
  if(cash){ const paid=r2(cash.pay+cash.completions.reduce((s,c)=>s+c.amt,0)); return {type:"cash",line:cash,paidNow:cash.pay,completions:cash.completions,rest:Math.max(0,r2(cash.o.amount-paid)),fromSav:cash.o.fromSav}; }
  const card=lines.find(l=>l.o.kind==="tarjeta"&&!l.o.carried&&(l.o.futs||[]).some(f=>f.fid===fid&&f.k===0));
  if(card){ const paid=r2(card.pay+card.completions.reduce((s,c)=>s+c.amt,0)); return {type:"card",line:card,fu:card.o.futs.find(f=>f.fid===fid&&f.k===0),complete:card.short<=0.009,completions:card.completions,rest:Math.max(0,r2(card.o.amount-paid))}; }
  return null;
}
function planStatusHtml(r){
  const st=futPlanStatus(r.f.id); const p=r.pick; if(!p) return "";
  const cmpl=c=>c.map(x=>`${money(x.amt)} el ${fDateS(ds(x.date))}`).join(", ");
  if(!st) return `<div class="small muted" style="margin-top:6px">Se paga después del periodo que cubre tu plan.</div>`;
  if(st.type==="cash"){
    if(st.line.short<=0.009) return `<div style="margin-top:6px">En tu plan: ese día pagas <b class="num">${money(st.paidNow)}</b>${st.fromSav.length?` y tomas ${st.fromSav.map(x=>`${money(x.amt)} de ${esc(x.acc.name)}`).join(" y ")}`:""}. Completo.</div>`;
    return `<div style="margin-top:6px">En tu plan: ese día alcanzas a pagar <b class="num">${money(st.paidNow)}</b>${st.completions.length?` y lo completas con ${cmpl(st.completions)}`:""}.${st.rest>0.009?` Al final del plan aún faltarían <b class="num">${money(st.rest)}</b>.`:""}</div>`;
  }
  const co=st.line.o;

function recoText(r){
  const p=r.pick, f=r.f;
  if(p&&p.forced){
    const why=r.options.filter(o=>o.why).map(o=>`<li>${o.type==="card"?esc(o.card.name):esc(o.cashName||"Efectivo o débito")}: ${esc(o.why)}</li>`).join("");
    const how=p.type==="card"?`${esc(futMethod(p))} el ${fDate(ds(p.date))} y se paga hasta el ${fDate(ds(p.due))}`:`${esc(futMethod(p))} el ${fDate(ds(p.date))}`;

      <div style="margin-top:4px">Lo puse ${how}.${p.savTotal>0.009?` Usa <b class="num">${money(p.savTotal)}</b> de tus apartados.`:""}</div>

  }
  if(!p){
    const why=r.options.filter(o=>o.why).map(o=>`<li>${o.type==="card"?esc(o.card.name):esc(o.cashName||"Efectivo o débito")}: ${esc(o.why)}</li>`).join("");

      <div class="small" style="margin-top:6px">Prueba con una fecha límite más lejana, a meses sin intereses${f.allowSavings?"":", o permitiendo usar tus apartados"}.</div></div>`;
  }
  const sav=p.payments.flatMap(x=>x.fromSav); const savTxt=sav.length?`<div style="margin-top:6px">Para cubrirlo toma <b>${[...new Map(sav.map(x=>[x.acc.id,{acc:x.acc,amt:0}])).values()].map(v=>{ v.amt=sav.filter(x=>x.acc.id===v.acc.id).reduce((s,x)=>s+x.amt,0); return `${money(v.amt)} de ${esc(v.acc.name)}`; }).join(" y ")}</b>.</div>`:"";
  if(p.type==="card"){ const prevCut=lastCutOnOrBefore(p.card,addDays(p.date,-1)); const right=daysBetween(prevCut,p.date)<=1;

  return `<div class="note good"><b>Compra el ${fDate(ds(p.date))} ${esc(futMethod(p))}.</b><div style="margin-top:4px">${p.savNeed>0?"Con tus ingresos no alcanza sin descuadrar tus otros pagos.":"Ese día ya tienes el dinero sin descuadrar tus otros pagos."}</div>${savTxt}${planStatusHtml(r)}</div>`;

      if(g.deadline&&g.target>sv_){ const mo=Math.max(1,(pd(g.deadline).getFullYear()-today().getFullYear())*12+pd(g.deadline).getMonth()-today().getMonth()); per=`Ahorra ${money((g.target-sv_)/mo)} al mes para llegar el ${fDate(g.deadline)}`; }
      if(pf.first) per=(per?per+" · ":"")+`el plan le aparta ${money(pf.first.amt)} el ${fDateS(ds(pf.first.date))}`;
      if(ac.length) per=(per?per+" · ":"")+`en ${ac.map(a=>esc(a.name)).join(", ")}`;

        <div class="bar"><i style="width:${pct*100}%;background:${g.color}"></i></div>
        <div class="spread small muted"><span>${per||(pct>=1?"¡Meta cumplida!":"")}</span><span>${Math.round(pct*100)}%</span></div>

    <div class="panel"><div class="panel-h"><h3>Aportes por mes</h3></div><div class="chart-box"><canvas id="chSave"></canvas></div></div>
  </div>`:`<div class="panel empty"><b>Crea tu primera meta</b><span>Fondo de emergencia, viaje, enganche… registra cuánto llevas y cuánto quieres juntar.</span><button class="btn pri" data-act="newGoal">＋ Meta de ahorro</button></div>`}`;

const dlg=$("#dlg");
function openDialog(title,body,foot){
  $("#dlgInner").innerHTML=`<div class="dlg-h"><h2 style="font-size:18px">${title}</h2><button class="btn sm ghost" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="dlg-b">${body}</div>${foot?`<div class="dlg-f">${foot}</div>`:""}`;
  if(!dlg.open) dlg.showModal();
  $("#dlgInner .dlg-b").scrollTop=0;
  $$("#dlgInner .swatches").forEach(addCustomSwatch);
}
function addCustomSwatch(box){
  const sel=box.dataset.sel||""; const known=[...box.querySelectorAll("button")].some(b=>b.dataset.col===sel);
  const wrap=document.createElement("span"); wrap.style.cssText="position:relative;display:inline-block;width:30px;height:30px";
  const b=document.createElement("button"); b.type="button"; b.tabIndex=-1; b.className="custom"+(sel&&!known?" on":""); b.setAttribute("aria-hidden","true");
  b.dataset.col=sel&&!known?sel:"#ff7a59";
  const paint=c=>{ b.style.boxShadow=`0 0 0 2.5px var(--fg), inset 0 0 0 9px ${c}`; };
  if(sel&&!known) paint(sel);
  const inp=document.createElement("input"); inp.type="color"; inp.setAttribute("aria-label","Elegir otro color");
  inp.value=/^#[0-9a-f]{6}$/i.test(b.dataset.col)?b.dataset.col:"#ff7a59";
  inp.style.cssText="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none";
  const pick=()=>{ box.querySelectorAll("button").forEach(x=>{ x.classList.remove("on"); if(x!==b) x.style.boxShadow=""; }); b.dataset.col=inp.value; b.classList.add("on"); paint(inp.value); };
  inp.addEventListener("input",pick); inp.addEventListener("change",pick);
  box.querySelectorAll("button").forEach(x=>{ if(x!==b) x.addEventListener("click",()=>{ b.classList.remove("on"); b.style.boxShadow=""; }); });
  wrap.appendChild(b); wrap.appendChild(inp); box.appendChild(wrap);
}

function cutPayDefaults(c){
  if(!c||c.type!=="credito"&&c.type) return {cut:"",pay:""};
  if(c.cycleCut&&c.cyclePay&&pd(c.cyclePay)>=today()) return {cut:c.cycleCut,pay:c.cyclePay};
  if(!c.cutDay||!c.payDay) return {cut:"",pay:""};
  const st=cardState(c); return {cut:ds(st.stmtCut>=today()?st.stmtCut:st.nextCut),pay:ds(st.stmtCut>=today()?st.nextPay:nextPayOnOrAfter(c,addDays(st.nextCut,1)))};
}

    if(accId){ const a=get(accId); if(a&&(a.goalId!==saved.id||accPurpose(a)!=="meta")) await put({...a,goalId:saved.id,purpose:"meta"}); }
    closeDialog(); toast("Meta guardada");
  };
}
function goalDetail(id){
  const g=get(id); if(!g) return;
  openDialog(esc(g.name),`
    <div class="spread"><span class="num" style="font-size:24px">${money(goalSaved(g))}</span><span class="muted">de ${money(g.target)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,(goalSaved(g)/g.target)*100)}%;background:${g.color}"></i></div>
    ${goalAccounts(g).length?`<div class="small muted">El dinero está en ${goalAccounts(g).map(a=>esc(a.name)).join(", ")}; al aportar se suma a ese apartado.</div>`:""}
    <div class="fgrid"><label class="f">Monto<input type="number" id="gAmt" step="0.01" inputmode="decimal"></label><label class="f">Fecha<input type="date" id="gDate" value="${todayS()}"></label></div>
    <div class="row"><button class="btn pri" id="gAdd">＋ Aportar</button><button class="btn" id="gSub">− Retirar</button></div>
    <h3>Movimientos</h3>
    ${(g.history||[]).length?`<div class="list">${g.history.slice().reverse().map(h=>`<div class="item" style="cursor:default"><div class="main">${fDate(h.date)}</div><span class="num" style="color:${h.amount<0?"var(--bad)":"var(--good)"}">${h.amount<0?"":"+"}${money(h.amount)}</span></div>`).join("")}</div>`:`<p class="muted small">Sin movimientos.</p>`}`,
    `<div class="confirm" id="delZone"><button class="btn danger" data-act="askDelete" data-id="${g.id}">Borrar meta</button></div><button class="btn" data-act="editGoal" data-id="${g.id}">Editar</button>`);
  const mv=async sign=>{ const a=+$("#gAmt").value; if(!(a>0)) return; const date=$("#gDate").value||todayS(); const h=(g.history||[]).concat([{date,amount:r2(sign*a)}]);
    const ac=goalAccounts(g)[0];
    if(ac){ await put({...ac,balance:r2((+ac.balance||0)+sign*a),history:(ac.history||[]).concat([{date,amount:r2(sign*a),type:sign>0?"deposito":"retiro"}])}); await put({...g,history:h}); }
    else await put({...g,history:h,saved:r2((+g.saved||0)+sign*a)}); goalDetail(id); toast(sign>0?"Aporte guardado":"Retiro guardado"); };
  $("#gAdd").onclick=()=>mv(1); $("#gSub").onclick=()=>mv(-1);
}

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(t.tagName==="A" && t.getAttribute("href")!=="#") return;
  ev.preventDefault();
  switch(a){
    case "close": closeDialog(); break;
    case "signIn": signIn(); break;
    case "newCard": cardForm(); break;
    case "editCard": cardForm(get(id)); break;
    case "openCard": cardDetail(id); break;
    case "newExp": if(!all("card").length&&!S.items.size){ /* permite efectivo */ } expForm(); break;
    case "editExp": expForm(get(id)); break;
    case "openExp": expDetail(id); break;
    case "newPay": payForm(t.dataset.card,t.dataset.plan); break;
    case "delPay": { if(t.dataset.sure){ await unlinkIncome(get(id)); await del(id); toast("Pago borrado"); closeDialog(); } else { t.dataset.sure="1"; t.textContent="¿Borrar?"; t.classList.add("danger"); } break; }
    case "newFlow": flowForm(null,t.dataset.type); break;
    case "newSalary": flowForm({type:"ingreso",name:"Sueldo",freq:"catorcenal",date:todayS(),active:true},"ingreso"); break;
    case "editFlow": flowForm(get(id)); break;
    case "newGoal": goalForm(); break;
    case "newLoan": loanForm(); break;
    case "newFuture": futureForm(); break;
    case "newSub": subForm(null,t.dataset.card||""); break;
    case "payLink": { const k=t.dataset.key; if(k&&k.startsWith("fut:")) buyFuture(k.slice(4)); else expForm({link:k}); break; }
    case "editSub": subForm(get(id)); break;
    case "planAdd": planAddMenu(); break;
    case "cashEdit": cashForm(); break;
    case "valesIn": { const c=get(id); if(!c||!c.recarga) break; const n=valesNext(c); const amt=n?n.amount:+c.recarga.amount||0;
      await put({kind:"pay",cardId:c.id,amount:r2(amt),date:todayS(),target:"auto",note:"Recarga de vales",createdAt:Date.now()});
      const after=valesAfter(c,n&&n.date>today()?n.date:today()); await put({...get(c.id),recarga:{...c.recarga,next:after?ds(after):c.recarga.next}});
      toast(`Recarga de ${money(amt)} registrada en ${c.name}`); break; }
    case "toggleNoMore": {
      const o=get(id); if(!o) break; await put({...o,noMore:!o.noMore});
      toast(!o.noMore?`Listo: ya no se aparta dinero a ${o.name}`:`${o.name} vuelve a recibir dinero`); break; }
    case "stopTarget": {
      const k=t.dataset.kind; let name="";
      if(k==="acc"){ const a=get(id); if(a){ await put({...a,noMore:true}); name=a.name; } }
      else if(k==="goal"){ const g=get(id); if(g){ await put({...g,noMore:true}); name=g.name; } }
      else { const st=settings(); await put({...st,id:"settings",kind:"settings",[t.dataset.k]:true}); name=t.dataset.k==="fundStop"?"tu fondo de ahorro":"tu fondo de inversión"; }
      toast(`Listo: ya no se aparta dinero a ${name}`); break; }
    case "unstop": {
      const k=t.dataset.kind;
      if(k==="acc"){ const a=get(id); if(a) await put({...a,noMore:false}); }
      else if(k==="goal"){ const g=get(id); if(g) await put({...g,noMore:false}); }
      else { const st=settings(); await put({...st,id:"settings",kind:"settings",[t.dataset.k]:false}); }
      toast("Vuelve a recibir dinero"); break; }
    case "toggleStop": { const k=t.dataset.k; const st=settings(); await put({...st,id:"settings",kind:"settings",[k]:!st[k]}); toast(!st[k]?"Listo: ya no se aparta más dinero a ese fondo":"Ese fondo vuelve a recibir dinero"); break; }
    case "openAlerts": openAlerts(); break;
    case "goAlert": closeDialog(); if(t.dataset.to==="newExp") expForm(); else if((t.dataset.to||"").startsWith("inc:")) incForm(null,{link:t.dataset.to.slice(4)}); else location.hash=t.dataset.to; break;
    case "didSave": fundDepositForm(t.dataset.purpose,+t.dataset.amt,t.dataset.per,t.dataset.goal); break;
    case "fundDeposit": fundDepositForm(t.dataset.purpose,0,""); break;
    case "stmtPaid": stmtPaidForm(id); break;
    case "planSettings": planSettingsForm(); break;
    case "editFuture": futureForm(get(id)); break;
    case "buyFuture": buyFuture(id); break;
    case "newAccount": accountForm(); break;
    case "editAccount": accountForm(get(id)); break;
    case "openAccount": accountDetail(id); break;
    case "editLoan": loanForm(get(id)); break;
    case "openLoan": loanDetail(id); break;
    case "loanWant": loanWantForm(id); break;
    case "moneyMenu": moneyMenu(); break;
    case "newInc": incForm(null,{type:"ingreso",to:t.dataset.to}); break;
    case "newTransfer": incForm(null,{type:"transfer",from:t.dataset.from,to:t.dataset.to}); break;
    case "editInc": incForm(get(id)); break;
    case "incLink": incForm(null,{link:t.dataset.key}); break;
    case "gTab": gtab=t.dataset.v; try{ localStorage.setItem("mc-gtab",gtab); }catch(e){} render(); break;
    case "cashMoves": openDialog("Efectivo en mano",`<div class="note acc"><b>Tienes ${money(cashState().balance)}</b> en efectivo.</div>${accMovesHtml("cash")}`); break;
    case "payLoan": loanPayForm(id); break;
    case "editGoal": goalForm(get(id)); break;
    case "openGoal": goalDetail(id); break;
    case "zoom": openLightbox(t.src); break;
    case "loadSample": loadSample(); break;
    case "askDelete": {
      const o=get(id); const z=$("#delZone");
      const extra=o&&o.kind==="loan"?` Se borrarán también sus ${all("loanpay").filter(p=>p.loanId===id).length} pagos registrados.`:o&&o.kind==="card"?` Se borrarán también sus ${all("exp").filter(e=>e.cardId===id).length} gastos y ${all("pay").filter(p=>p.cardId===id).length} pagos.`:"";
      z.innerHTML=`<span class="small">¿Seguro?${extra}</span><button class="btn danger" data-act="doDelete" data-id="${id}">Sí, borrar</button><button class="btn" data-act="cancelDelete" data-id="${id}">No</button>`; break; }
    case "cancelDelete": $("#delZone").innerHTML=`<button class="btn danger" data-act="askDelete" data-id="${id}">Borrar</button>`; break;
    case "doDelete": {
      const o=get(id);
      if(o&&o.kind==="goal"){ for(const a of all("account").filter(a=>a.goalId===id)) await put({...a,goalId:"",purpose:"ahorro"}); }
      if(o&&o.kind==="loan"){ for(const x of all("loanpay").filter(p=>p.loanId===id)) await del(x.id); }
      if(o&&o.kind==="card"){ for(const x of [...all("exp").filter(e=>e.cardId===id),...all("pay").filter(p=>p.cardId===id)]) await del(x.id); for(const x of all("sub").filter(x=>x.cardId===id)) await put({...x,cardId:""}); }
      if(o&&o.kind==="pay"&&o.flowId) await unlinkIncome(o);
      if(o&&o.kind==="exp"){ for(const p of all("pay").filter(p=>p.target===id)) await put({...p,target:"auto"});
        for(const fu of all("future").filter(f=>f.expId===id)) await put({...fu,done:false,doneDate:"",expId:""});
        if(o.flowId&&o.flowDate){ const f=get(o.flowId); if(f) await put({...f,paid:(f.paid||[]).filter(d=>d!==o.flowDate)}); }
        if(o.subId&&o.subDate&&!o.id.startsWith("sub-")){ const sb=get(o.subId); if(sb&&sb.lastGenerated===o.subDate) await put({...sb,lastGenerated:o.linkPrev||""}); } }
      await del(id); closeDialog(); toast("Borrado"); break; }
  }
});
