<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi Cartera</title>
<meta name="theme-color" content="#1F1F1F">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.json?v=2">
<meta name="apple-mobile-web-app-title" content="Mi Cartera">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="shortcut icon" href="icon-192.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral en escritorio y menú lateral en el celular; bloques planos muy redondeados.
   Color: paleta Suave — azul #97C2EC, beige #D6D0C2, negro #1F1F1F, blanco #FFFFFF. Otros temas en Opciones. */
:root{
  --blue:#97C2EC; --beige:#D6D0C2; --black:#1F1F1F; --white:#FFFFFF;
  --bg:#F1F1F1; --surface:#FFFFFF; --surface-2:#F4F2EE; --line:#E7E3DB;
  --fg:#1F1F1F; --muted:#77736C;
  --accent-l:#1F1F1F; --accent-d:#97C2EC; --ink:#1F1F1F; --ink-2:#2E2E2E; --mint:#97C2EC;
  --accent:var(--accent-l); --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--blue) 38%,var(--surface));
  --ink-fg:#F5F5F5; --ink-muted:#B9B6AF;
  --t1:#97C2EC; --t1-fg:#1F1F1F; --t1-star:#1F1F1F;
  --t2:#D6D0C2; --t2-fg:#1F1F1F; --t2-star:#FFFFFF;
  --t3:#1F1F1F; --t3-fg:#FFFFFF; --t3-star:#97C2EC;
  --t4:#FFFFFF; --t4-fg:#1F1F1F; --t4-star:#D6D0C2;
  --good:#1d8a52; --warn:#a8650a; --bad:#c9372d; --warn-soft:#f8eedc; --bad-soft:#fbe3e0; --good-soft:#dff1e6;
  --shadow:none;
  --shadow-lg:0 24px 60px -12px rgba(20,20,20,.35);
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:24px; --side:248px;
}
:root[data-tema="indigo"]{--accent-l:#4f5ff0;--accent-d:#8d99ff;--ink:#171a33;--ink-2:#2b3270;--mint:#9aa8ff;--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));--t1:#c9cffc;--t3:#171a33;--t3-star:#9aa8ff}
:root[data-tema="violeta"]{--accent-l:#7c3aed;--accent-d:#b794ff;--ink:#1f1336;--ink-2:#4b2a8a;--mint:#c4a8ff;--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));--t1:#dccbff;--t3:#1f1336;--t3-star:#c4a8ff}
:root[data-tema="rosa"]{--accent-l:#db2777;--accent-d:#ff7eb6;--ink:#2a1124;--ink-2:#7a1f55;--mint:#ffa3cf;--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));--t1:#ffd0e4;--t3:#2a1124;--t3-star:#ffa3cf}
:root[data-tema="coral"]{--accent-l:#e5533d;--accent-d:#ff8a73;--ink:#2a1714;--ink-2:#7a3226;--mint:#ffb3a3;--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));--t1:#ffd6cc;--t3:#2a1714;--t3-star:#ffb3a3}
:root[data-tema="oceano"]{--accent-l:#0284c7;--accent-d:#4fc3f7;--ink:#0c1d2e;--ink-2:#14507a;--mint:#8ad8ff;--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));--t1:#bfe6fb;--t3:#0c1d2e;--t3-star:#8ad8ff}
:root[data-tema="ambar"]{--accent-l:#c2780a;--accent-d:#f5b544;--ink:#1d1a16;--ink-2:#4a3a1c;--mint:#ffd27a;--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));--t1:#fde3b0;--t3:#1d1a16;--t3-star:#ffd27a}
:root[data-tema="grafito"]{--accent-l:#334155;--accent-d:#cbd5e1;--ink:#111318;--ink-2:#2d3340;--mint:#e2e8f0;--accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));--t1:#dfe5ec;--t3:#111318;--t3-star:#e2e8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1F1F1F; --surface-2:#292929; --line:#333232;
  --fg:#F3F2EF; --muted:#A9A59D; --accent:var(--accent-d); --accent-ink:#1F1F1F; --ink:#0B0B0B; --ink-2:#202020;
  --t3:#2B2B2B; --t4:#1F1F1F; --t4-fg:#F3F2EF;
  --good:#47c784; --warn:#e8a640; --bad:#f06a60; --warn-soft:#372b16; --bad-soft:#3a1e1b; --good-soft:#173527;
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1F1F1F; --surface-2:#292929; --line:#333232;
  --fg:#F3F2EF; --muted:#A9A59D; --accent:var(--accent-d); --accent-ink:#1F1F1F; --ink:#0B0B0B; --ink-2:#202020;
  --t3:#2B2B2B; --t4:#1F1F1F; --t4-fg:#F3F2EF;
  --good:#47c784; --warn:#e8a640; --bad:#f06a60; --warn-soft:#372b16; --bad-soft:#3a1e1b; --good-soft:#173527;
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h2{font-size:24px;font-weight:800}
h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
a{color:var(--accent);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- estructura ---------- */
.shell{display:flex;min-height:100%}
.side{display:none}
.content{flex:1;min-width:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--ink-2),var(--ink));display:grid;place-items:center;color:var(--mint);flex:none;box-shadow:0 4px 12px -4px rgba(13,39,35,.5)}
.logo svg{width:19px;height:19px}
.brand h1{font-size:19px;font-weight:800}
.navlinks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap;background:var(--surface);box-shadow:var(--shadow)}
.navlinks a svg.i{width:16px;height:16px}
.navlinks a.on{background:var(--ink);color:var(--ink-fg)}
.navlinks a.on svg.i{color:var(--mint)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
@media (min-width:980px){
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;width:var(--side);flex:none;padding:22px 14px;background:var(--ink);color:var(--ink-fg)}
  .side .brand{padding:4px 10px 18px}
  .side .brand h1{color:#fff}
  .side .logo{background:rgba(255,255,255,.08);box-shadow:none}
  .side .navlinks{flex-direction:column;overflow:visible;padding:0;gap:2px}
  .side .navlinks a{background:transparent;box-shadow:none;color:var(--ink-muted);border-radius:12px;padding:11px 12px;font-size:14px}
  .side .navlinks a:hover{background:rgba(255,255,255,.06);color:#fff}
  .side .navlinks a.on{background:color-mix(in srgb,var(--mint) 18%,transparent);color:#fff}
  .side .navlinks a.on svg.i{color:var(--mint)}
  .side .grow{flex:1}
  .side .btnMenu{display:flex;align-items:center;gap:10px;border:0;background:rgba(255,255,255,.06);color:var(--ink-fg);padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:600}
  .side .btnMenu:hover{background:rgba(255,255,255,.1)}
  header.top{display:none}
  main{padding-top:28px}
}
.banner{font-size:12.5px;padding:8px 12px;margin-top:8px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600}
main{padding-block:12px 120px}
.view{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr))}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* ---------- héroe del resumen ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;color:var(--ink-fg);background:radial-gradient(120% 140% at 100% 0%,var(--ink-2) 0%,var(--ink) 55%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:38px solid color-mix(in srgb,var(--mint) 10%,transparent);pointer-events:none}
.hero .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);font-weight:700}
.hero .big{font-size:clamp(32px,6vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px;color:#fff}
.hero .row-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px;position:relative;z-index:1}
.hero .stat{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
.hero .stat span{display:block;font-size:12px;color:var(--ink-muted);font-weight:600}
.hero .stat b{display:block;font-size:17px;margin-top:2px;color:#fff;font-variant-numeric:tabular-nums}
.hero .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px;max-width:420px}
.hero .meter i{display:block;height:100%;background:var(--mint);border-radius:99px}

/* ---------- KPIs ---------- */
.kpi{display:flex;flex-direction:column;gap:3px}
.kpi .lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .lbl .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .lbl .ico svg.i{width:16px;height:16px}
.kpi .val{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.dlg .kpi .lbl,.panel .grid .kpi .lbl{font-size:12px}

/* ---------- botones y chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface-2);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--fg);transition:transform .08s ease,background .15s}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
label.btn{position:relative}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:300px}
.empty{padding:30px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:18px;font-weight:800}
.empty span{max-width:520px}

/* ---------- tarjetas ---------- */
.cc{position:relative;border-radius:20px;padding:18px;color:#fff;min-height:180px;aspect-ratio:1.62;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;box-shadow:0 14px 30px -14px rgba(0,0,0,.55);border:0;text-align:left;width:100%;transition:transform .15s ease}
.cc:hover{transform:translateY(-2px)}
.cc::before{content:"";position:absolute;width:240px;height:240px;right:-80px;bottom:-110px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.cc::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.28));pointer-events:none}
.cc .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.cc>*{position:relative;z-index:1}
.cc .bank{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.cc .type{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.85;font-weight:700}
.cc .digits{letter-spacing:.14em;opacity:.9;font-variant-numeric:tabular-nums}
.cc .big{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cc .ccbar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.cc .ccbar i{display:block;height:100%;background:#fff}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px;padding:0 4px}
.card-meta div{display:flex;flex-direction:column;gap:1px;min-width:0}
.card-meta span:first-child{font-size:11.5px;color:var(--muted);font-weight:600}
.card-meta span:last-child{font-weight:600}

/* ---------- tablas y listas ---------- */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;min-width:0}
.item:hover{background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:44px;height:44px;border-radius:13px;object-fit:cover;background:var(--surface-2);flex:none;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters>*{flex:1 1 150px;min-width:0}
details summary{list-style-position:inside}

/* ---------- formularios ---------- */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;font-weight:500;color:var(--fg);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:13px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2.5px var(--fg)}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos .ph{position:relative;width:86px;height:86px}
.photos .ph img{width:100%;height:100%;object-fit:cover;border-radius:13px;cursor:zoom-in}
.photos .ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--bad);color:#fff;cursor:pointer;font-weight:800;line-height:1}
.drop{border:2px dashed var(--line);border-radius:13px;width:86px;height:86px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:700;text-align:center;padding:4px}
.drop:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px;cursor:zoom-in;max-width:100%}
.gallery figcaption{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- diálogos: hoja inferior en el celular ---------- */
dialog{border:0;border-radius:24px;padding:0;background:var(--surface);color:var(--fg);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(6,16,14,.55);backdrop-filter:blur(3px)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.dlg-h h2{font-size:19px!important}
.dlg-b{padding:8px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.dlg-b>*{flex-shrink:0}
.dlg-f{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtM = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"});

const moneyK = n => Math.abs(n)>=10000 ? "$"+(n/1000).toFixed(n>=100000?0:1)+"k" : money(n);

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,"0");
const ds = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };

const dim = (y,m) => new Date(y,m+1,0).getDate();

const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const monthKey = s => String(s).slice(0,7);
const fMonth = k => { const [y,m]=k.split("-").map(Number); return MES[m-1]+" "+String(y).slice(2); };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const CATS = ["Súper","Comida","Transporte","Gasolina","Hogar","Servicios","Salud","Entretenimiento","Ropa","Educación","Suscripciones","Viajes","Tecnología","Otros"];
const CARD_COLORS = ["#97C2EC","#D6D0C2","#1F1F1F","#2b59ff","#4338ca","#7c3aed","#a21caf","#db2777","#e11d48","#dc2626","#ea580c","#f59e0b","#ca8a04","#65a30d","#16a34a","#0d9488","#0891b2","#0284c7","#1e3a8a","#475569","#111827","#78350f","#be185d","#9333ea","#f472b6","#14b8a6","#c0a062"];

const isLight = col => { const m=/^#?([0-9a-f]{6})$/i.exec(col||""); if(!m) return false; const n=parseInt(m[1],16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)>165; };
const cardBg = col => isLight(col) ? `${col} linear-gradient(135deg, color-mix(in srgb, ${col} 70%, #fff) 0%, ${col} 70%)` : `${col} linear-gradient(135deg, ${col} 0%, color-mix(in srgb, ${col} 55%, #000) 100%)`;

const catColor = c => CAT_COLORS[Math.max(0,CATS.indexOf(c))%CAT_COLORS.length];

/* ================= storage (db per usuario, con respaldo local) ================= */
const S = { items:new Map(), mode:"init", col:null, assets:null, downloads:null, loaded:false };
const LKEY = "mi-cartera-v1";
function localLoad(){ try{ const raw=localStorage.getItem(LKEY); if(raw){ JSON.parse(raw).forEach(o=>S.items.set(o.id,o)); } }catch(e){} }
function localSave(){ try{ localStorage.setItem(LKEY, JSON.stringify([...S.items.values()])); }catch(e){} }
async function put(obj){
  obj = JSON.parse(JSON.stringify(obj));
  if(!obj.id) obj.id = uid();
  obj.updatedAt = Date.now();
  S.items.set(obj.id,obj);
  scheduleRender();
  if(S.mode==="fb"){
    const {id,...body} = obj;
    try{ await FB.setDoc(FB.doc(FB.db,"users",S.uid,"items",id), body); }
    catch(e){
      if(e && e.code==="invalid-argument") toast("El registro es demasiado grande (muchas fotos). Quita alguna foto e intenta de nuevo.");
      else if(e && e.code==="permission-denied") toast("Sin permiso para guardar. Revisa las reglas de Firestore o vuelve a iniciar sesión.");
      else toast("No se pudo guardar: "+(e&&e.message||"error"));
    }
  } else localSave();
  return obj;
}
async function del(id){
  const prev=S.items.get(id);
  S.items.delete(id); scheduleRender();
  if(S.mode==="fb" && prev){ for(const ph of [...(prev.photos||[]), prev.photo].filter(x=>x&&x.path)){ FB.deleteObject(FB.ref(FB.storage,ph.path)).catch(()=>{}); } }
  if(S.mode==="fb"){ try{ await FB.deleteDoc(FB.doc(FB.db,"users",S.uid,"items",id)); }catch(e){ toast("No se pudo borrar."); } }
  else localSave();
}
function hasLocal(){ try{ const a=JSON.parse(localStorage.getItem(LKEY)||"[]"); return Array.isArray(a)&&a.length>0; }catch(e){ return false; } }
const all = kind => [...S.items.values()].filter(o=>o.kind===kind);
const get = id => S.items.get(id);
const settings = () => S.items.get("settings") || {id:"settings",kind:"settings",cash:0,savingsPct:10,horizon:60,saveMode:"auto"};

function waitFB(){ return new Promise(res=>{ if(window.FB) return res(true); const t=setTimeout(()=>res(false),12000); window.addEventListener("fb-ready",()=>{ clearTimeout(t); res(true); },{once:true}); }); }
let unsubData=null;
async function initStore(){
  const banner = $("#banner");
  const ok = await waitFB();
  if(!ok){
    S.mode="local"; localLoad(); S.loaded=true;
    banner.hidden=false; banner.textContent="No se pudo conectar con Firebase. Modo local: tus datos se guardan solo en este navegador.";
    scheduleRender(); return;
  }
  FB.getRedirectResult(FB.auth).catch(authError);
  FB.onAuthStateChanged(FB.auth, user=>{
    if(unsubData){ unsubData(); unsubData=null; }
    S.items=new Map(); S.loaded=false;
    if(!user){ S.mode="signin"; S.uid=null; S.user=null; banner.hidden=true; scheduleRender(); return; }
    S.mode="fb"; S.uid=user.uid; S.user=user; scheduleRender();
    const timer=setTimeout(()=>{ if(!S.loaded){ banner.hidden=false; banner.textContent="Todavía no se pueden cargar tus datos. Revisa tu conexión; se mostrarán en cuanto respondan."; } },10000);
    unsubData = FB.onSnapshot(FB.collection(FB.db,"users",user.uid,"items"), snap=>{
      clearTimeout(timer);
      if(navigator.onLine) banner.hidden=true;
      else { banner.hidden=false; banner.textContent="Sin conexión: los cambios se guardan y se suben al volver el internet."; }
      const next=new Map();
      snap.docs.forEach(d=>next.set(d.id,{...d.data(),id:d.id}));
      S.items=next; S.loaded=true; scheduleRender();
    }, err=>{
      clearTimeout(timer); S.loaded=true;
      banner.hidden=false; banner.textContent= err&&err.code==="permission-denied" ? "Firestore rechazó la lectura. Revisa que pegaste las reglas de seguridad." : "No se pudieron cargar tus datos ("+(err&&err.code||"error")+"). Recarga la página más tarde.";
      scheduleRender();
    });
  });
}
const AUTH_ERR={
  "auth/unauthorized-domain":"Firebase no tiene autorizado este sitio. En Firebase → Authentication → Settings → Authorized domains agrega: "+location.hostname,
  "auth/operation-not-allowed":"El inicio de sesión con Google no está activado. En Firebase → Authentication → Sign-in method activa Google y guarda.",
  "auth/configuration-not-found":"Authentication no está configurado. En Firebase → Authentication dale \"Comenzar\" y activa Google.",
  "auth/popup-blocked":"Tu navegador bloqueó la ventana de Google. Permite ventanas emergentes para este sitio e intenta de nuevo.",
  "auth/network-request-failed":"No hay conexión con Google. Revisa tu internet o desactiva el bloqueador de anuncios para este sitio.",
  "auth/internal-error":"Google respondió con un error interno. Revisa que Google esté activado en Firebase y que tu navegador permita cookies de terceros.",
  "auth/web-storage-unsupported":"Tu navegador bloquea el almacenamiento que necesita el inicio de sesión. Desactiva el modo privado o permite cookies."

function inAppBrowser(){ return /FBAN|FBAV|Instagram|Line\/|WhatsApp|TikTok|Snapchat|; wv\)/i.test(navigator.userAgent); }
function authError(e){
  const code=(e&&e.code)||"error";
  if(code==="auth/popup-closed-by-user"||code==="auth/cancelled-popup-request") return;
  S.authErr=(AUTH_ERR[code]||"No se pudo iniciar sesión.")+" (código: "+code+")";
  scheduleRender();
}
const APP_HOME="https://personal-75acf.firebaseapp.com/";
const isStandalone=()=>!!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
const onGithub=()=>location.hostname.endsWith("github.io");
async function signIn(){
  S.authErr=""; scheduleRender();
  if(isStandalone()&&onGithub()){ S.authErr="Esta versión instalada no puede iniciar sesión. Borra este ícono y agrega la app desde "+APP_HOME+" (Compartir → Agregar a inicio)."; scheduleRender(); return; }
  if(isStandalone()){ const p=new FB.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); try{ await FB.signInWithRedirect(FB.auth,p); }catch(e){ authError(e); } return; }
  if(inAppBrowser()){ S.authErr="Estás dentro de otra app (WhatsApp, Instagram, Facebook…). Google no permite entrar desde ahí: abre este enlace en Chrome o Safari."; scheduleRender(); return; }
  const p=new FB.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try{ await FB.signInWithPopup(FB.auth,p); }
  catch(e){
    if(e && e.code==="auth/popup-blocked"){ try{ await FB.signInWithRedirect(FB.auth,p); }catch(e2){ authError(e2); } }
    else authError(e);
  }
}

/* ================= fotos ================= */
function readImage(file, maxSide, q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("No se pudo leer la imagen"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("Formato de imagen no compatible"));
      img.onload=()=>{
        const s=Math.min(1,maxSide/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
let storageOff=false;
async function storePhoto(file){
  if(S.mode==="fb" && !storageOff){
    try{
      const c = await readImage(file,1600,.82);
      const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
      const path = "users/"+S.uid+"/fotos/"+uid()+".jpg";
      const r = FB.ref(FB.storage,path);
      await FB.uploadBytes(r,blob,{contentType:"image/jpeg"});
      return {path, url: await FB.getDownloadURL(r)};
    }catch(e){ storageOff=true; /* sin Storage (plan gratis): se guarda comprimida dentro de Firestore */ }
  }
  const c = await readImage(file,900,.7);
  return {data:c.toDataURL("image/jpeg",.7)};
}

function cutDate(card,y,m){ const b=new Date(y,m,1); y=b.getFullYear(); m=b.getMonth(); return new Date(y,m,Math.min(card.cutDay||1,dim(y,m))); }
function payDateOf(card,y,m){ const b=new Date(y,m,1); y=b.getFullYear(); m=b.getMonth(); return new Date(y,m,Math.min(card.payDay||1,dim(y,m))); }
function lastCutOnOrBefore(card,d){
  const c=cutDate(card,d.getFullYear(),d.getMonth());
  if(c<=d) return c;
  const p=new Date(d.getFullYear(),d.getMonth()-1,1); return cutDate(card,p.getFullYear(),p.getMonth());
}
function lastCutBefore(card,d){ return lastCutOnOrBefore(card,addDays(d,-1)); }
function nextCutAfter(card,d){
  const c=cutDate(card,d.getFullYear(),d.getMonth());
  if(c>d) return c;
  const n=new Date(d.getFullYear(),d.getMonth()+1,1); return cutDate(card,n.getFullYear(),n.getMonth());
}
function nextPayOnOrAfter(card,d){
  const p=payDateOf(card,d.getFullYear(),d.getMonth());
  if(p>=d) return p;
  const n=new Date(d.getFullYear(),d.getMonth()+1,1); return payDateOf(card,n.getFullYear(),n.getMonth());
}
// número de cortes c con a < c <= b
function cutsBetween(card,a,b){
  if(b<=a) return 0;
  let n=0, y=a.getFullYear(), m=a.getMonth();
  for(let i=0;i<400;i++){
    const c=cutDate(card,y,m);
    if(c>b) break;
    if(c>a) n++;
    m++; if(m>11){m=0;y++;}
  }
  return n;
}
function planOf(e){
  const months=+e.msi||0, total=+e.amount||0;
  const cuota=r2(total/months);
  const pb=Math.min(Math.max(0,Math.floor(+e.msiPaidBefore||0)),months);
  return {id:e.id, exp:e, months, total, cuota, pb, paid:pb>=months?total:r2(pb*cuota)};
}
function billedAmt(plan,card,L){
  const k = plan.pb>0
    ? Math.min(plan.months, plan.pb+cutsBetween(card,pd(plan.exp.msiAsOf||plan.exp.date),L))
    : Math.min(plan.months,cutsBetween(card,pd(plan.exp.date),L));
  return k>=plan.months ? plan.total : r2(k*plan.cuota);
}

const cacheState = new Map();
function cardState(card){
  if(cacheState.has(card.id)) return cacheState.get(card.id);
  const t=today();
  const exps=all("exp").filter(e=>e.cardId===card.id).sort((a,b)=>a.date.localeCompare(b.date));
  const pays=all("pay").filter(p=>p.cardId===card.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  const isCredit=card.type==="credito";
  const init = +card.initialBalance||0;
  const initDate = card.initialDate || "1970-01-01";
  // (crédito) lo que registraste en o antes de la fecha de tu "deuda actual", y antes de capturarla, ya va incluido en esa deuda
  const setAt=+card.balanceSetAt||0;
  const preCapture=x=>isCredit&&setAt>0&&(x.date||"")<=initDate&&(x.createdAt||0)<=setAt;
  const regular=exps.filter(e=>!(+e.msi>1)&&!preCapture(e));
  const plans=exps.filter(e=>+e.msi>1).map(planOf);
  let revPaid=0;
  const allocs={};
  for(const p of pays){
    let rem=+p.amount||0; const parts=[];
    const pDate=pd(p.date);
    if(isCredit){
      if(p.target && p.target!=="auto"){
        const pl=plans.find(x=>x.id===p.target);
        if(pl){ const take=Math.min(rem, r2(pl.total-pl.paid)); if(take>0){ pl.paid=r2(pl.paid+take); rem=r2(rem-take); parts.push({to:pl.id,amt:take,kind:"adelanto"}); } }
      }
      const Lp=lastCutOnOrBefore(card,pDate);
      for(const pl of plans){
        if(rem<=0) break;
        if(pd(pl.exp.date)>pDate) continue;
        const due=r2(billedAmt(pl,card,Lp)-pl.paid);
        if(due>0){ const take=Math.min(rem,due); pl.paid=r2(pl.paid+take); rem=r2(rem-take); parts.push({to:pl.id,amt:take,kind:"mensualidad"}); }
      }
      if(rem>0&&preCapture(p)){ parts.push({to:"rev",amt:rem,kind:"previo"}); rem=0; }
      if(rem>0){
        const owed = r2((initDate<=p.date?init:0) + regular.filter(e=>e.date<=p.date).reduce((s,e)=>s+(+e.amount||0),0) - revPaid);
        const take=Math.max(0,Math.min(rem,owed));
        if(take>0){ revPaid=r2(revPaid+take); rem=r2(rem-take); parts.push({to:"rev",amt:take,kind:"saldo"}); }
      }
      // lo que pagaste de más cubrió deuda que no estaba registrada; no se queda como "saldo a favor" que esconda tus gastos nuevos
      if(rem>0){ parts.push({to:"rev",amt:rem,kind:"noreg"}); rem=0; }
    } else {
      parts.push({to:"rev",amt:rem,kind:"deposito"});
    }
    allocs[p.id]=parts;
  }
  const regTotal=r2(regular.reduce((s,e)=>s+(+e.amount||0),0)+init);
  let st={card,isCredit,exps,pays,plans,allocs};
  if(isCredit){
    const rev=r2(regTotal-revPaid);
    const msiOut=r2(plans.reduce((s,p)=>s+(p.total-p.paid),0));
    const debt=r2(rev+msiOut);
    const limit=+card.limit||0;
    let P=nextPayOnOrAfter(card,t);
    if(card.cyclePay){ const fp=pd(card.cyclePay); if(P<fp) P=fp; }
    const L=lastCutBefore(card,P);
    const revDue=Math.max(0,r2(init*(initDate<=ds(L)?1:0)+regular.filter(e=>pd(e.date)<=L).reduce((s,e)=>s+(+e.amount||0),0)-revPaid));
    const msiDue=r2(plans.reduce((s,p)=>s+Math.max(0,billedAmt(p,card,L)-p.paid),0));
    const nextCut=nextCutAfter(card,addDays(t,-1));
    const linked=all("loan").filter(l=>l.payCardId===card.id).map(loanState).filter(x=>x.next);
    const loanItems=[]; linked.forEach(x=>{ let amt=0; for(let j=x.done+1;j<=x.n;j++){ if(x.dueOf(j)>P) break; amt=r2(amt+(j===x.done+1?x.next.amt:x.amtOf(j))); } if(amt>0) loanItems.push({loan:x.loan,amt,st:x}); });
    const loanDue=r2(loanItems.reduce((s,x)=>s+x.amt,0));
    Object.assign(st,{rev,msiOut,debt,limit,avail:r2(limit-debt),util:limit?debt/limit:0,
      nextPay:P,stmtCut:L,revDue,msiDue,noInt:r2(revDue+msiDue),payTotal:r2(Math.max(0,rev)+msiDue),nextCut,loanItems,loanDue,
      daysToPay:daysBetween(t,P)});
  } else {
    // solo cuenta lo que pasó después del saldo que capturaste
    const inRange=x=>{ const d=x.date||""; if(d>initDate) return true; if(d<initDate) return false; return !card.balanceSetAt||(x.createdAt||0)>card.balanceSetAt; };
    const sum=a=>r2(a.reduce((s,x)=>s+(+x.amount||0),0));
    const spent=sum(exps.filter(inRange));
    const dep=sum(pays.filter(inRange));
    const lids=new Set(all("loan").filter(l=>l.payCardId===card.id).map(l=>l.id));
    const loanOut=sum(all("loanpay").filter(p=>lids.has(p.loanId)&&inRange(p)));
    const paidOutList=[...all("transfer").filter(p=>p.fromId===card.id&&inRange(p)),...all("pay").filter(p=>p.fromId===card.id&&inRange(p)),...all("loanpay").filter(p=>p.fromId===card.id&&!lids.has(p.loanId)&&inRange(p))];
    const paidOut=sum(paidOutList);
    Object.assign(st,{spent,dep,loanOut,paidOut,paidOutList,balance:r2(init+dep-spent-loanOut-paidOut)});
  }
  cacheState.set(card.id,st);
  return st;
}
// estimación de los siguientes estados de cuenta (para el plan)
function projectStatements(card,horizonEnd){
  const st=cardState(card); if(!st.isCredit) return [];
  const out=[];
  let P=st.nextPay, L=st.stmtCut, prevL=null;
  const paidSim=new Map(st.plans.map(p=>[p.id,p.paid]));
  for(let i=0;i<6 && P<=horizonEnd;i++){
    let rev, msi=0;
    const msiItems=[];
    if(i===0){ rev=Math.max(0,st.rev); }
    else rev=r2(st.exps.filter(e=>!(+e.msi>1)&&pd(e.date)>prevL&&pd(e.date)>today()&&pd(e.date)<=L).reduce((s,e)=>s+(+e.amount||0),0));
    for(const p of st.plans){
      const due=Math.max(0,r2(billedAmt(p,card,L)-paidSim.get(p.id)));
      if(due>0){ msi=r2(msi+due); msiItems.push({plan:p,amt:due}); paidSim.set(p.id,r2(paidSim.get(p.id)+due)); }
    }
    if(rev+msi>0.009) out.push({card,date:P,cut:L,rev,msi,total:r2(rev+msi),msiItems,first:i===0});
    prevL=L;
    const n=new Date(P.getFullYear(),P.getMonth()+1,1);
    P=payDateOf(card,n.getFullYear(),n.getMonth());
    L=lastCutBefore(card,P);
  }
  return out;
}

/* ================= créditos y préstamos ================= */
const LOAN_TYPES=["Personal","Nómina","Auto","Hipotecario","Departamental","Familiar","Otro"];
const LOAN_FREQ={mensual:"Mensual",quincenal:"Quincenal",catorcenal:"Cada 14 días",semanal:"Semanal"};
const perMonth={mensual:1,quincenal:2,catorcenal:26/12,semanal:52/12};
function stepDate(anchor,freq,k,day){
  if(k<=0) return new Date(anchor);
  if(freq==="semanal") return addDays(anchor,7*k);
  if(freq==="catorcenal") return addDays(anchor,14*k);
  if(freq==="quincenal"){ let d=new Date(anchor); for(let i=0;i<k;i++){ const last=dim(d.getFullYear(),d.getMonth()); d = d.getDate()<15 ? new Date(d.getFullYear(),d.getMonth(),15) : d.getDate()<last ? new Date(d.getFullYear(),d.getMonth(),last) : new Date(d.getFullYear(),d.getMonth()+1,15); } return d; }
  const y=anchor.getFullYear(), m=anchor.getMonth()+k; const dd=day||anchor.getDate();
  return new Date(y,m,Math.min(dd,dim(new Date(y,m,1).getFullYear(),new Date(y,m,1).getMonth())));
}
function loanAmounts(l,n,cuota){
  // monto de cada pago (1..n). Si el pago cambia, usa el calendario que capturaste; si falta alguno, usa el pago base.
  const sch=Array.isArray(l.schedule)?l.schedule:[];
  return Array.from({length:n},(_,i)=> l.variable && +sch[i]>0 ? +sch[i] : cuota);
}
function loanState(l){
  const n=Math.max(1,Math.floor(+l.total||1)), cuota=+l.cuota||0, pb=Math.min(n,Math.max(0,Math.floor(+l.paidBefore||0)));
  const amts=loanAmounts(l,n,cuota);
  const cum=[0]; amts.forEach((x,i)=>cum.push(r2(cum[i]+x)));
  const amtOf=j=>amts[j-1]||0;
  const doneFor=paid=>{ let k=0; while(k<n && cum[k+1]<=paid+0.01) k++; return k; };
  const pays=all("loanpay").filter(p=>p.loanId===l.id).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  const totalToPay=cum[n];
  const paidAmt=Math.min(totalToPay,r2(cum[pb]+pays.reduce((s,p)=>s+(+p.amount||0),0)));
  const remaining=Math.max(0,r2(totalToPay-paidAmt));
  const done=doneFor(paidAmt);
  const anchor=pd(l.nextDate||todayS()), day=anchor.getDate();
  const dueOf=j=>stepDate(anchor,l.freq||"mensual",j-pb-1,day);
  const next = done<n ? {j:done+1,date:dueOf(done+1),amt:r2(cum[done+1]-paidAmt)} : null;
  let overdue=0; for(let j=done+1;j<=n;j++){ if(dueOf(j)<today()) overdue++; else break; }
  const principal=+l.principal||0;
  const nextFull=next?amtOf(next.j):0;
  return {loan:l,n,cuota,pb,pays,totalToPay,paidAmt,remaining,done,next,overdue,dueOf,principal,amtOf,doneFor,variable:!!l.variable,
    interest:principal?Math.max(0,r2(totalToPay-principal)):0,monthly:r2((next?nextFull:cuota)*(perMonth[l.freq]||1)),
    daysToNext:next?daysBetween(today(),next.date):null};
}

/* ================= apartados e inversiones ================= */
const INSTS=["Mercado Pago","Openbank","GBM+","Nu","Klar","Hey Banco","Stori","Didi","Cetesdirecto","Banco","Efectivo guardado","Otro"];
const accAvailable=(a,d)=> a.liquid!==false || !a.availFrom || pd(a.availFrom)<=d;

/* ================= compras futuras: cuándo y con qué pagar ================= */
function cutOnOrAfter(card,d){ const c=cutDate(card,d.getFullYear(),d.getMonth()); if(c>=d) return c; const n=new Date(d.getFullYear(),d.getMonth()+1,1); return cutDate(card,n.getFullYear(),n.getMonth()); }
function futPayList(f){
  const cards=all("card"); const credit=cards.filter(c=>c.type==="credito").map(c=>c.id); const debit=cards.filter(CASH_TYPES).map(c=>c.id);
  if(Array.isArray(f.payCards)&&f.payCards.length){
    const sel=f.payCards.filter(id=>id==="efectivo"||get(id));
    const cr=sel.filter(id=>credit.includes(id)), db=sel.filter(id=>debit.includes(id));
    return {credit:new Set(cr),cash:sel.includes("efectivo")||db.length>0,debits:db,onlyCash:sel.includes("efectivo")};
  }
  const pw=f.payWith||"auto";
  if(pw==="credito") return {credit:new Set(credit),cash:false,debits:[]};
  if(pw==="efectivo") return {credit:new Set(),cash:true,debits:debit,onlyCash:true};
  if(credit.includes(pw)) return {credit:new Set([pw]),cash:false,debits:[]};
  if(debit.includes(pw)) return {credit:new Set(),cash:true,debits:[pw]};
  return {credit:new Set(credit),cash:true,debits:debit,onlyCash:true};
}
let recoCache=null;
function recommendFutures(){
  if(recoCache) return recoCache;
  const t=today(); const base=buildPlan({noFutures:true,horizon:Math.max(150,+settings().horizon||60)});
  const bal=base.daily.map(x=>x.bal);
  const idxOf=d=>Math.max(0,Math.min(bal.length-1,daysBetween(t,d)));
  const freeAt=d=>{ let m=Infinity; for(let k=idxOf(d);k<bal.length;k++) m=Math.min(m,bal[k]); return m; };
  const commit=(d,amt)=>{ for(let k=idxOf(d);k<bal.length;k++) bal[k]=r2(bal[k]-amt); };
  const accs=all("account"); const accLeft={}; accs.forEach(a=>accLeft[a.id]=+a.balance||0);
  const reserved={};
  const credit=all("card").filter(c=>c.type==="credito");
  const futs=all("future").filter(f=>!f.done).sort((a,b)=>(a.by||"9999").localeCompare(b.by||"9999")||(a.createdAt||0)-(b.createdAt||0));
  const out=[];
  for(const f of futs){
    const amt=+f.amount||0;
    // la fecha de la compra es fija: no se mueve, solo se elige con qué pagarla
    const fixedD=pd(f.by||todayS());
    const from=fixedD<t?new Date(t):fixedD; const by=new Date(from);
    const savIds=f.allowSavings?((f.savingsIds&&f.savingsIds.length)?f.savingsIds:accs.map(a=>a.id)):[];
    const savAccs=d=>savIds.map(id=>accs.find(a=>a.id===id)).filter(a=>a&&!accUsable(a)&&accAvailable(a,d)).sort((a,b)=>(+a.rate||0)-(+b.rate||0));
    const savAvail=d=>r2(savAccs(d).reduce((s,a)=>s+Math.max(0,accLeft[a.id]||0),0));
    const options=[];
    const pl=futPayList(f);
    for(const c of credit){
      if(!pl.credit.has(c.id)) continue;
      const st=cardState(c); const avail=r2(st.avail-(reserved[c.id]||0));
      if(avail<amt){ options.push({type:"card",card:c,ok:false,why:`Solo tiene ${money(Math.max(0,avail))} disponibles`}); continue; }
      let best=null;
      for(let d=new Date(from),i=0;d<=by&&i<200;d=addDays(d,1),i++){ const C=cutOnOrAfter(c,d); const due=nextPayOnOrAfter(c,addDays(C,1)); const fl=daysBetween(d,due); if(!best||fl>best.float) best={date:new Date(d),cut:C,due,float:fl}; }
      const months=+f.msiMax>1?+f.msiMax:0; const cuota=months?r2(amt/months):amt;
      const savNeed=Math.max(0,r2(cuota-Math.max(0,freeAt(best.due))));
      const affordable=savNeed<=0.009||(savIds.length>0&&savAvail(best.due)>=savNeed);
      const utilAfter=st.limit?(st.debt+(reserved[c.id]||0)+amt)/st.limit:1;
      const score=best.float+(months?20:0)-(utilAfter>0.7?40:utilAfter>0.3?8:0)-(affordable?0:200)-(savNeed>0?15:0)-(+c.rate||0)/50;
      options.push({type:"card",card:c,ok:true,...best,months,cuota,utilAfter,affordable,savNeed,score,
        why:!affordable?`Para el ${fDateS(ds(best.due))} no te alcanzaría para pagarla`:""});
    }
    if(pl.cash){
      const debitCard=pl.debits.map(id=>get(id)).filter(Boolean).sort((a,b)=>(cardState(b).balance||0)-(cardState(a).balance||0))[0]||null;
      const cashName=debitCard&&!(pl.onlyCash&&pl.debits.length>1)?(debitCard.type==="efectivo"?debitCard.name:"tu débito "+debitCard.name):"efectivo o débito";
      let d0=null; for(let d=new Date(from),i=0;d<=by&&i<200;d=addDays(d,1),i++){ if(freeAt(d)>=amt){ d0=new Date(d); break; } }
      if(d0) options.push({type:"cash",ok:true,date:d0,savNeed:0,affordable:true,score:10,debit:debitCard,cashName});
      else { const d=new Date(by); const savNeed=r2(amt-Math.max(0,freeAt(d))); const can=savIds.length>0&&savAvail(d)>=savNeed;
        options.push({type:"cash",ok:can,date:d,savNeed,affordable:can,score:can?0:-300,debit:debitCard,cashName,why:can?"":`Te faltarían ${money(savNeed)}${f.allowSavings?" aun usando tus apartados":""}`}); }
    }
    let pick=options.filter(o=>o.ok&&o.affordable).sort((a,b)=>b.score-a.score)[0]||null;
    if(!pick){
      // no alcanza completo: igual entra al plan con la mejor opción posible, para que veas cuánto falta
      pick=options.filter(o=>o.type==="card"&&o.ok).sort((a,b)=>b.score-a.score)[0]||options.find(o=>o.type==="cash")||{type:"cash",ok:false,date:new Date(by),savNeed:amt,cashName:"efectivo o débito"};
      pick.forced=true;
      for(let d=addDays(by,1),i=0;d<=base.end&&i<200;d=addDays(d,1),i++){ if(freeAt(d)>=amt){ pick.canOn=new Date(d); break; } }
    }
    const draw=(d,need)=>{ const res=[]; for(const a of savAccs(d)){ if(need<=0.009) break; const take=Math.min(need,Math.max(0,accLeft[a.id]||0)); if(take>0){ accLeft[a.id]=r2(accLeft[a.id]-take); need=r2(need-take); res.push({acc:a,amt:r2(take)}); } } return res; };
    if(pick){
      pick.payments=[];
      const payOn=(d,a)=>{ if(d>base.end){ pick.payments.push({date:d,amount:r2(a),cash:r2(a),fromSav:[],beyond:true,short:0}); return; }
        const cash=Math.min(a,Math.max(0,freeAt(d))); const fromSav=a-cash>0.009?draw(d,r2(a-cash)):[]; const drawn=r2(fromSav.reduce((x,y)=>x+y.amt,0));
        const short=Math.max(0,r2(a-cash-drawn)); const cashPart=r2(a-drawn);
        commit(d,cashPart); pick.payments.push({date:d,amount:r2(a),cash:cashPart,fromSav,short}); };
      if(pick.type==="card"){
        reserved[pick.card.id]=r2((reserved[pick.card.id]||0)+amt);
        if(pick.months){ for(let k=0;k<pick.months;k++){ const d=payDateOf(pick.card,pick.due.getFullYear(),pick.due.getMonth()+k); const dd=new Date(d.getFullYear(),d.getMonth(),Math.min(+pick.card.payDay||1,dim(d.getFullYear(),d.getMonth()))); payOn(dd,k===pick.months-1?r2(amt-pick.cuota*(pick.months-1)):pick.cuota); } }
        else payOn(pick.due,amt);
      } else payOn(pick.date,amt);
      pick.savTotal=r2(pick.payments.reduce((s,p)=>s+p.fromSav.reduce((x,y)=>x+y.amt,0),0));
      pick.short=r2(pick.payments.reduce((s,p)=>s+(p.short||0),0));
    }
    out.push({f,pick,options,from,by,savIds});
  }
  recoCache=out; return out;
}

/* ================= ingresos / fijos ================= */
function occurrences(f,from,to){
  const out=[]; if(f.active===false) return out;
  const amt=+f.amount||0;
  const start=f.date?pd(f.date):from;
  if(f.freq==="unico"){ const d=pd(f.date); if(d>=from&&d<=to) out.push(d); }
  else if(f.freq==="semanal"||f.freq==="catorcenal"||f.freq==="cada28"){
    const step=f.freq==="semanal"?7:f.freq==="cada28"?28:14; let d=new Date(start);
    while(d<from) d=addDays(d,step);
    for(;d<=to;d=addDays(d,step)) out.push(new Date(d));
  } else if(f.freq==="quincenal"){
    for(let y=from.getFullYear(),m=from.getMonth(),i=0;i<30;i++){
      [new Date(y,m,15),new Date(y,m,dim(y,m))].forEach(d=>{ if(d>=from&&d<=to&&d>=start) out.push(d); });
      m++; if(m>11){m=0;y++;} if(new Date(y,m,1)>to) break;
    }
  } else if(f.freq==="anual"){
    const sd=pd(f.date||ds(from));
    for(let y=from.getFullYear()-1;y<=to.getFullYear();y++){ const d=new Date(y,sd.getMonth(),Math.min(sd.getDate(),dim(y,sd.getMonth()))); if(d>=from&&d<=to&&d>=start) out.push(d); }
  } else { // mensual
    for(let y=from.getFullYear(),m=from.getMonth(),i=0;i<30;i++){
      const d=new Date(y,m,Math.min(+f.day||1,dim(y,m)));
      if(d>=from&&d<=to&&d>=start) out.push(d);
      m++; if(m>11){m=0;y++;} if(new Date(y,m,1)>to) break;
    }
  }
  const paid=new Set(f.paid||[]);
  return out.filter(d=>!paid.has(ds(d))).map(d=>({date:d,amount:amt,flow:f}));
}

/* ================= créditos: pagar más para terminar antes ================= */
function loanLineNote(l){ const o=l.o; const parts=[];
  if(o.covered>0.009) parts.push(o.amount<=0.009?`Ya lo cubriste con lo que adelantaste (${money(o.covered)}).`:`Ya adelantaste ${money(o.covered)} de este pago; debes ${money(o.amount)}.`);
  if(l.want&&l.wantExtra>0.009){
    if(l.extra>=l.wantExtra-0.009) parts.push(`<b>Te alcanza para lo que quieres pagar:</b> ${money(l.pay)} (debes ${money(o.amount)} y adelantas ${money(l.extra)}).`);
    else if(l.extra>0.009) parts.push(`Querías pagar ${money(l.want)}; <b>este periodo te alcanza para ${money(l.pay)}</b>. Los ${money(l.extra)} extra se adelantan a tu siguiente pago.`);
    else if(l.noRoom) parts.push(`Querías pagar ${money(l.want)}, pero <b>este periodo solo alcanza lo que debes</b> (${money(o.amount)}) por tus otros pagos y gastos.`);
  }
  return parts.length?`<div class="small" style="color:var(--good)">${parts.join(" ")}</div>`:""; }
// lo que el plan sugiere para el siguiente pago de un crédito
function loanSuggest(l){ const st=loanState(l); if(!st.next) return null;
  try{ for(const per of buildPlan().periods) for(const ln of per.lines){ if(ln.o.kind==="prestamo"&&!ln.o.carried&&ln.o.loanId===l.id&&ln.o.loanJ===st.next.j) return {pay:r2(Math.max(ln.pay,0)),req:ln.o.amount,extra:ln.extra||0,want:ln.want||0,wantExtra:ln.wantExtra||0,noRoom:!!ln.noRoom,short:ln.short||0,date:ln.o.date}; } }catch(e){ console.error(e); }
  return null; }
// si pagas `want` cada vez, ¿en cuántos pagos terminas?
function loanFinish(l,want){ const st=loanState(l); if(!st.next) return null; const left=st.n-st.done;
  if(!(want>0)) return {k:left,date:st.dueOf(st.n),left,saved:0};
  let rem=st.remaining, k=0; while(rem>0.009&&k<600){ rem=r2(rem-want); k++; }
  k=Math.min(k,left); return {k,date:st.dueOf(st.done+k),left,saved:Math.max(0,left-k),end:st.dueOf(st.n)}; }
function loanWantForm(id){
  const l=get(id); if(!l) return; const st=loanState(l); if(!st.next){ toast("Este crédito ya está pagado"); return; }
  openDialog(`¿Cuánto te gustaría pagar? · ${esc(l.name)}`,`
    <div class="note">Tu siguiente pago es de <b class="num">${money(st.next.amt)}</b> (${fDate(ds(st.next.date))}). Pon cuánto te gustaría pagar cada vez para terminar antes: el plan revisa tus otros pagos y gastos de cada periodo y te dice si te alcanza para eso, solo para lo que debes, o para algo en medio. Lo que pagues de más se adelanta a tus siguientes pagos.</div>
    <label class="f">Me gustaría pagar cada vez<input type="number" id="wAmt" step="50" inputmode="decimal" value="${+l.want||""}" placeholder="Ej. ${money(Math.ceil(st.next.amt*1.5/100)*100).replace(".00","")}"></label>
    <div id="wInfo"></div>
    <div class="small muted">Si tu crédito cobra intereses, pide en tu banco que los pagos extra se apliquen a capital para reducir el plazo; así además pagas menos intereses.</div>
    <div class="small" id="wErr" style="color:var(--bad)"></div>`,
    `<div class="confirm">${+l.want?`<button class="btn" id="wClear">Quitar</button>`:""}</div><div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" id="wSave">Guardar</button></div>`);
  const info=()=>{ const w=+$("#wAmt").value||0; if(!w){ $("#wInfo").innerHTML=""; return; }
    if(w<=st.next.amt+0.009){ $("#wInfo").innerHTML=`<div class="note warn small">Pon más de lo que debes (${money(st.next.amt)}) para terminar antes.</div>`; return; }
    const f=loanFinish(l,w); $("#wInfo").innerHTML=`<div class="note good small">Si pagas <b class="num">${money(w)}</b> cada vez, terminarías en <b>${f.k} pago${f.k===1?"":"s"}</b> (por ahí del <b>${fDate(ds(f.date))}</b>) en vez de ${f.left} (${fDate(ds(f.end))})${f.saved?`: <b>${f.saved} pago${f.saved===1?"":"s"} menos</b>`:""}.</div>`; };
  $("#wAmt").oninput=info; info();
  $("#wSave").onclick=async()=>{ const w=+$("#wAmt").value||0; if(w&&w<=st.next.amt+0.009){ $("#wErr").textContent=`Pon más de ${money(st.next.amt)}, o déjalo vacío.`; return; }
    await put({...get(id),want:r2(w)}); closeDialog(); toast(w?`Listo: el plan buscará pagar ${money(w)} a ${l.name} cuando te alcance`:"Guardado"); };
  if($("#wClear")) $("#wClear").onclick=async()=>{ await put({...get(id),want:0}); closeDialog(); toast("Listo"); };
}

// llave: fut:<id> · fijo:<id>:<fecha> · sub:<id>:<fecha> · loan:<id> · card:<id>
function linkInfo(key){
  if(!key) return null; const [type,id,date]=key.split(":"); const o=get(id); if(!o) return null;
  if(type==="fut"){ if(o.done) return null; const r=recommendFutures().find(x=>x.f.id===id); const pk=r&&r.pick;
    return {key,type,id,group:"Compras planeadas",label:`${o.name} · ${money(+o.amount||0)}${pk?` · ${fDateS(ds(pk.date))}`:""}`,amount:+o.amount||0,desc:o.name,category:o.category||"Otros",cardId:pk?(pk.type==="card"?pk.card.id:(pk.debit?pk.debit.id:"")):undefined,msi:pk&&pk.type==="card"?(pk.months||0):0,pay:false,
      note:"Se marca como comprada y deja de salir en tu plan."}; }
  if(type==="fijo"){ if(!date||(o.paid||[]).includes(date)) return null;
    return {key,type,id,date,group:"Pagos fijos",label:`${o.name} · ${money(+o.amount||0)} · ${fDateS(date)}`,amount:+o.amount||0,desc:o.name,category:o.category||"Servicios",pay:false,
      note:`El pago del ${fDate(date)} queda hecho y deja de salir en tu plan.`}; }
  if(type==="sub"){ if(!date||(o.lastGenerated||"")>=date) return null;
    return {key,type,id,date,group:"Suscripciones",label:`${o.name} · ${money(+o.amount||0)} · ${fDateS(date)}`,amount:+o.amount||0,desc:o.name,category:o.category||"Suscripciones",cardId:get(o.cardId)?o.cardId:"",pay:false,
      note:`El cobro del ${fDate(date)} queda registrado${o.autoExpense!==false?" (ya no se registra solo)":""} y deja de salir en tu plan.`}; }
  if(type==="loan"){ const st=loanState(o); if(!st.next) return null; const sg=loanSuggest(o); const sug=sg&&sg.pay>st.next.amt+0.009?sg.pay:st.next.amt;

function planLinkOptions(){

let subGenBusy=false;
async function genSubs(){
  if(subGenBusy||!S.loaded||S.mode==="signin"||S.mode==="init") return;
  const t=today(), tS=todayS(); const todo=[];
  all("sub").forEach(sb=>{ if(sb.active===false||sb.autoExpense===false||!sb.date||(sb.lastGenerated||"")>=tS) return;
    let from=pd(sb.date); if(sb.since&&pd(sb.since)>from) from=pd(sb.since);
    if(sb.lastGenerated){ const lg=addDays(pd(sb.lastGenerated),1); if(lg>from) from=lg; }
    const occ=subOcc(sb,from,t); if(occ.length) todo.push({sb,occ}); });
  if(!todo.length) return;

  try{
    for(const {sb,occ} of todo){
      let n=0;
      for(const o of occ){ const id=`sub-${sb.id}-${ds(o.date)}`; if(get(id)) continue;
        await put({id,kind:"exp",amount:r2(+sb.amount||0),date:ds(o.date),desc:sb.name,category:sb.category||"Suscripciones",cardId:sb.cardId||"",msi:0,photos:[],subId:sb.id,note:"Cargo automático de suscripción",createdAt:Date.now()}); n++; }
      const cur=get(sb.id); if(cur) await put({...cur,lastGenerated:ds(occ[occ.length-1].date)});
      if(n) toast(`Se registró el cobro de ${sb.name} (${money(+sb.amount||0)}) en ${subWhere(sb)}`);
    }
  }catch(e){ console.error(e); }
  finally{ subGenBusy=false; }
}

const planCache={};
const INV_INSTS=["GBM+","Cetesdirecto"];
const accPurpose=a=>a.purpose||(INV_INSTS.includes(a.inst)?"inversion":"ahorro");
const PURPOSES=[["ahorro","Fondo de ahorro"],["inversion","Inversión"],["meta","Para una meta"],["gastar","Para gastar"]];
const purposeLabel=a=>{ const p=accPurpose(a); if(p==="meta"){ const g=get(a.goalId); return g?"meta: "+g.name:"meta"; } return {ahorro:"fondo de ahorro",inversion:"inversión",gastar:"para gastar"}[p]||"fondo de ahorro"; };
const accUsable=a=>a.usable===true||(a.usable!==false&&accPurpose(a)==="gastar");
const goalAccounts=g=>all("account").filter(a=>a.goalId===g.id&&accPurpose(a)==="meta");
const goalSaved=g=>{ const ac=goalAccounts(g); return ac.length?r2(ac.reduce((x,a)=>x+(+a.balance||0),0)):r2(+g.saved||0); };
function saveConfig(){
  const s=settings(); const t=today();
  const since=ds(addDays(t,-90));
  const regular=all("exp").filter(e=>e.date>=since&&e.date<=ds(t)&&!(+e.msi>1)&&!e.subId&&!e.flowId&&!isVales(get(e.cardId)));
  const firstDate=regular.reduce((m,e)=>e.date<m?e.date:m,ds(t));
  const span=Math.max(30,daysBetween(pd(firstDate),t));
  const spendMonthly=regular.length?r2(regular.reduce((x,e)=>x+(+e.amount||0),0)/span*30):null;
  const fixedMonthly=fixedPayments().monthly;
  const goals=all("goal").map(g=>{ const saved=goalSaved(g), target=+g.target||0, remaining=Math.max(0,r2(target-saved));
    const months=g.deadline?Math.max(1,(pd(g.deadline).getFullYear()-t.getFullYear())*12+pd(g.deadline).getMonth()-t.getMonth()):6;
    return {g,saved,target,remaining,monthly:r2(remaining/months),acc:goalAccounts(g)[0]||null}; }).filter(x=>x.remaining>0.009&&!x.g.noMore&&!goalAccounts(x.g).some(a=>a.noMore));
  const accs=all("account");
  const saveAccs=accs.filter(a=>accPurpose(a)==="ahorro"), invAccs=accs.filter(a=>accPurpose(a)==="inversion");
  const fundNow=r2(saveAccs.reduce((x,a)=>x+(+a.balance||0),0));
  const invNow=r2(invAccs.reduce((x,a)=>x+(+a.balance||0),0));
  const monthlyNeed=r2(fixedMonthly+(spendMonthly||0));
  const fundTarget=+s.fundGoal>0?+s.fundGoal:r2(Math.max(monthlyNeed*3,10000));
  const invTarget=+s.invGoal>0?+s.invGoal:0;
  const invYield=r2(invAccs.reduce((x,a)=>x+(+a.balance||0)*(+a.rate||0)/100/12,0));
  const best=list=>list.filter(a=>!a.noMore).sort((a,b)=>(+b.rate||0)-(+a.rate||0))[0]||null;
  // un fondo deja de recibir dinero si lo marcaste completo, o si todos sus apartados están marcados como completos
  const fundStop=!!s.fundStop||(saveAccs.length>0&&saveAccs.every(a=>a.noMore));
  const invStop=!!s.invStop||(invAccs.length>0&&invAccs.every(a=>a.noMore));
  return {fundStop,invStop,goals,goalPct:(s.goalPct??5)/100,invTarget,invYield,fundAuto:!(+s.fundGoal>0),mode:s.saveMode||"auto",savePct:(s.savePct??s.savingsPct??10)/100,invPct:(s.invPct??5)/100,spendMonthly,fixedMonthly,fundNow,invNow,fundTarget,monthlyNeed,saveAcc:best(saveAccs),invAcc:best(invAccs)};
}
function cashState(){
  const st=settings(); const captured=+st.cash||0; const date=st.cashDate||""; const setAt=+st.cashSetAt||0;
  const after=x=>{ if(!date) return false; const d=x.date||""; if(d>date) return true; if(d<date) return false; return (x.createdAt||0)>setAt; };
  const spentList=[...all("exp").filter(e=>!e.cardId&&after(e)),...["pay","loanpay","transfer"].flatMap(k=>all(k).filter(x=>x.fromId==="cash"&&after(x)))];
  const spent=r2(spentList.reduce((a,e)=>a+(+e.amount||0),0));
  const inList=all("pay").filter(p=>p.cardId==="cash"&&after(p)); const received=r2(inList.reduce((a,x)=>a+(+x.amount||0),0));
  return {captured,date,spent,received,count:spentList.length,balance:r2(captured-spent+received)};
}

  const s=settings();
  const t=today(); let end=addDays(t,opts.horizon||+s.horizon||60);
  if(!opts.noFutures){ recommendFutures().forEach(r=>{ const pk=r.pick; if(!pk) return; const first=pk.payments&&pk.payments[0]?pk.payments[0].date:(pk.due||pk.date); const lim=addDays(t,150); const want=addDays(first,2); if(want>end) end=want>lim?lim:want; }); }
  const avail0=cashAvailable().total;
  const incomes=all("flow").filter(f=>f.type==="ingreso").flatMap(f=>occurrences(f,t,end)).sort((a,b)=>a.date-b.date);
  const fixed=all("flow").filter(f=>f.type==="fijo").flatMap(f=>occurrences(f,t,end));
  const cards=all("card").filter(c=>c.type==="credito");
  const stmts=cards.flatMap(c=>projectStatements(c,end));
  const loanObl=[];
  all("loan").forEach(l=>{ const st=loanState(l); for(let j=st.done+1;j<=st.n;j++){ let d=st.dueOf(j); if(d>end) break; if(d<t) d=new Date(t); const amt=j===st.done+1?st.next.amt:st.amtOf(j); loanObl.push({kind:"prestamo",loanId:l.id,date:d,amount:amt,must:amt,name:l.name+(get(l.payCardId)?` (con ${get(l.payCardId).name})`:""),rate:+l.rate||0,loanJ:j,loanN:st.n}); } });
  const cardObl=stmts.map(x=>({kind:"tarjeta",date:x.date,due:x.date,cut:x.cut,amount:x.total,must:x.msi,name:x.card.name,card:x.card,stmt:x,rate:+x.card.rate||0,futs:[]}));
  const futObl=[];
  if(!opts.noFutures) recommendFutures().forEach(r=>{ if(!r.pick) return; r.pick.payments.forEach((p,k)=>{ if(p.date>end) return;
    const sav=r2(p.fromSav.reduce((x,y)=>x+y.amt,0)); const cashPart=r2(p.amount-sav);
    if(r.pick.type==="card"){
      // la compra planeada con tarjeta se paga junto con esa tarjeta, en su mismo estado de cuenta
      const c=r.pick.card; let co=cardObl.find(o=>o.card.id===c.id&&+o.due===+p.date);
      if(!co){ co={kind:"tarjeta",date:p.date,due:p.date,cut:lastCutBefore(c,p.date),amount:0,must:0,name:c.name,card:c,stmt:{msi:0,first:false,total:0},rate:+c.rate||0,futs:[]}; cardObl.push(co); }
      co.amount=r2(co.amount+cashPart); if(r.pick.months) co.must=r2(co.must+cashPart);
      co.futs.push({fid:r.f.id,name:r.f.name,amt:p.amount,cash:cashPart,fromSav:p.fromSav,k,months:r.pick.months});
    } else futObl.push({kind:"futuro",date:p.date<t?new Date(t):p.date,amount:cashPart,must:cashPart,full:p.amount,fromSav:p.fromSav,name:r.f.name,fut:r.f,pick:r.pick,k,rate:0});
  }); });
  if(!opts.noFutures) recommendFutures().forEach(r=>{ const pk=r.pick; if(!pk||pk.type!=="card") return; const d=pk.date<t?new Date(t):pk.date; if(d>end) return;
    futObl.push({kind:"compra",date:d,amount:0,must:0,full:+r.f.amount||0,name:r.f.name,fut:r.f,pick:pk,rate:0}); });
  // suscripciones: con crédito se suman al pago de esa tarjeta; con débito o efectivo salen el día del cobro
  const subObl=[];
  all("sub").forEach(sb=>{ const c=get(sb.cardId); if(isVales(c)) return; const amt=r2(+sb.amount||0); if(!(amt>0)) return;
    subPending(sb,end).forEach(o=>{ const d=o.date;
      if(c&&c.type==="credito"){
        const x=subStatement(c,d);
        let co=cardObl.find(q=>q.card.id===c.id&&+q.due===+x.due)||cardObl.find(q=>q.card.id===c.id&&+q.cut===+x.cut);
        if(!co){ if(x.due>end) return; co={kind:"tarjeta",date:x.due,due:x.due,cut:x.cut,amount:0,must:0,name:c.name,card:c,stmt:{msi:0,first:false,total:0},rate:+c.rate||0,futs:[]}; cardObl.push(co); }
        co.amount=r2(co.amount+amt); (co.subs=co.subs||[]).push({sid:sb.id,name:sb.name,amt,date:d});
      } else subObl.push({kind:"sub",date:d,amount:amt,must:amt,name:sb.name,sub:sb,subCard:c||null,rate:0});
    }); });
  const obligations=[...loanObl,...futObl,...subObl,...fixed.map(o=>({kind:"fijo",flowId:o.flow.id,date:o.date,amount:o.amount,name:o.flow.name,must:o.amount,rate:0})),...cardObl];
  const simulate=()=>{
    const obl=obligations.slice().sort((a,b)=>a.date-b.date);
    const starts=[{date:t,amount:avail0,label:"Dinero disponible hoy",isCash:true}];
    incomes.forEach(i=>starts.push({date:i.date,amount:i.amount,label:i.flow.name,fl:[i.flow.id]}));
    const merged=[];
    for(const st of starts){ const inc=st.isCash?0:st.amount; const last=merged[merged.length-1]; if(last && +last.date===+st.date){ last.amount+=st.amount; last.inc=(last.inc||0)+inc; last.label+=" + "+st.label; last.fl=[...(last.fl||[]),...(st.fl||[])]; } else merged.push({...st,inc}); }
    const periods=merged.map((p,i)=>({start:p.date,end:i<merged.length-1?addDays(merged[i+1].date,-1):end,income:p.amount,inc:p.inc||0,label:p.label,isCash:p.isCash,fl:p.fl||[],obl:[],lines:[]}));
    const done={}; all("transfer").forEach(x=>{ if(x.periodStart){ const k=x.periodStart+"|"+x.purpose; done[k]=r2((done[k]||0)+(+x.amount||0)); } });
    obl.forEach(o=>{ const per=periods.slice().reverse().find(p=>o.date>=p.start) || periods[0]; per.obl.push(o); });
    let carry=0; let totalShort=0, totalInt=0; let pending=[];
    const sv=saveConfig(); let fundSim=sv.fundNow; const goalSim={};
    // créditos: lo que adelantas en un pago se descuenta de los siguientes
    const loanCredit={}, loanPaidSim={}, loanRem={}; all("loan").forEach(l=>{ loanRem[l.id]=loanState(l).remaining; });
    periods.forEach((per,idx)=>{
      let avail=r2(carry+per.income); per.availStart=avail;
      // lo que quedó pendiente del periodo anterior se completa primero
      const carried=pending.map(x=>({...x.o,carried:true,originLine:x.origin,date:new Date(per.start),amount:x.amt,must:x.amt}));
      pending=[];
      const lines=[];
      for(const o0 of [...carried,...per.obl.slice().sort((a,b)=>a.date-b.date)]){ let o=o0;
        if(o.kind==="prestamo"&&!o.carried&&(loanCredit[o.loanId]||0)>0.009){ const red=Math.min(loanCredit[o.loanId],o.amount); loanCredit[o.loanId]=r2(loanCredit[o.loanId]-red); o={...o,amount:r2(o.amount-red),must:r2(o.must-red),covered:r2(red)}; }
        const take=Math.min(avail,o.must); avail=r2(avail-take); if(o.kind==="prestamo") loanPaidSim[o.loanId]=r2((loanPaidSim[o.loanId]||0)+take);
        lines.push({o,pay:take,shortMust:r2(o.must-take),completions:[]}); }
      for(const l of lines.filter(l=>l.o.kind==="tarjeta").sort((a,b)=>(b.o.rate-a.o.rate)||(a.o.date-b.o.date))){ const need=r2(l.o.amount-l.pay); const take=Math.min(avail,need); l.pay=r2(l.pay+take); avail=r2(avail-take); }
      const next=periods[idx+1];
      lines.forEach(l=>{ l.short=r2(l.o.amount-l.pay);
        if(l.o.carried&&l.pay>0.009) l.o.originLine.completions.push({date:per.start,label:per.label,amt:l.pay});
        if(l.short>0.009){
          if(l.o.kind==="tarjeta"&&!l.o.carried){ const revUnpaid=Math.max(0,r2(l.short-l.shortMust)); l.interest=r2(revUnpaid*(l.o.rate/100)/12*1.16); totalInt=r2(totalInt+l.interest); }
          if(next){ l.carriedTo=next.start; l.carriedLabel=next.label; pending.push({o:l.o.carried?{...l.o,carried:false}:l.o,amt:l.short,origin:l.o.carried?l.o.originLine:l}); }
          else totalShort=r2(totalShort+l.short);
        } });
      const nextNeed = next ? next.obl.reduce((s,o)=>s+o.amount,0) - next.income : 0;
      // ¿te alcanza para pagar lo que te gustaría a tus créditos? después de tus pagos, de lo que necesitas para el siguiente periodo,
      // de tus gastos del día a día y de un mínimo de ahorro; si no alcanza todo, paga lo que se pueda y eso se adelanta al siguiente pago
      const wl=lines.filter(l=>l.o.kind==="prestamo"&&!l.o.carried&&(+(get(l.o.loanId)||{}).want||0)>0);
      wl.forEach(l=>{ l.want=+get(l.o.loanId).want; l.wantExtra=r2(Math.max(0,l.want-l.o.amount)); l.extra=0; l.noRoom=l.wantExtra>0.009&&(loanRem[l.o.loanId]||0)-(loanPaidSim[l.o.loanId]||0)>0.009; });
      if(!opts.noFutures&&wl.length&&lines.every(l=>l.short<=0.009)){
        const days=daysBetween(per.start,per.end)+1, inc0=per.inc||0;
        const diaX=sv.spendMonthly!=null?r2(sv.spendMonthly*days/30):r2(inc0*0.35);
        const minSave=(sv.fundStop&&sv.invStop)?0:r2(inc0*(sv.mode==="fijo"?(sv.savePct+sv.invPct):0.05));
        let room=r2(avail-Math.max(0,nextNeed)-diaX-minSave);
        for(const l of wl.slice().sort((a,b)=>(b.o.rate||0)-(a.o.rate||0))){
          const id=l.o.loanId; const cap=r2(Math.max(0,(loanRem[id]||0)-(loanPaidSim[id]||0)));
          let ex=Math.min(l.wantExtra,cap,Math.max(0,room));
          if(ex<Math.min(l.wantExtra,cap)-0.009) ex=Math.floor(ex/50)*50;
          if(ex>0.009){ l.extra=r2(ex); l.pay=r2(l.pay+ex); avail=r2(avail-ex); room=r2(room-ex); loanCredit[id]=r2((loanCredit[id]||0)+ex); loanPaidSim[id]=r2((loanPaidSim[id]||0)+ex); }
          l.noRoom=l.extra<l.wantExtra-0.009&&cap>l.extra+0.009;
        }
      }
      let save=0, inv=0, why="";
      const base=per.inc||0; const pk=ds(per.start);
      per.saveDone=done[pk+"|ahorro"]||0; per.invDone=done[pk+"|inversion"]||0;
      per.goalsDone=sv.goals.map(x=>({g:x.g,amt:done[pk+"|meta:"+x.g.id]||0})).filter(x=>x.amt>0);
      const goalsDoneTot=r2(per.goalsDone.reduce((a,x)=>a+x.amt,0)); let goalsAlloc=[];
      if(!opts.noFutures && base>0 && lines.every(l=>l.short<=0.009)){
        // lo que sobra después de tus pagos y de reservar lo que falte para el siguiente periodo
        // lo que ya apartaste hoy ya salió de tu cuenta: se suma para calcular igual que antes
        const sobrante=r2(Math.max(0,r2(avail-Math.max(0,nextNeed)))+per.saveDone+per.invDone+goalsDoneTot);
        // reparte un monto entre tus metas, más a la que más necesita por mes
        const distGoals=amt=>{ const pend=sv.goals.filter(x=>(goalSim[x.g.id]||0)<x.remaining-0.01); const res=[]; let left=amt;
          for(let pass=0;pass<2&&left>0.009&&pend.length;pass++){ const live=pend.filter(x=>(goalSim[x.g.id]||0)<x.remaining-0.01); const w=live.reduce((a,x)=>a+(x.monthly||1),0); if(!w) break; let used=0;
            live.forEach(x=>{ const room=r2(x.remaining-(goalSim[x.g.id]||0)); const take=Math.min(room,r2(left*(x.monthly||1)/w)); if(take>0.009){ goalSim[x.g.id]=r2((goalSim[x.g.id]||0)+take); used=r2(used+take); const ex=res.find(r=>r.g.id===x.g.id); if(ex) ex.amt=r2(ex.amt+take); else res.push({g:x.g,acc:x.acc,amt:take}); } });
            left=r2(left-used); }
          return {res,left}; };
        const hasGoals=sv.goals.some(x=>(goalSim[x.g.id]||0)<x.remaining-0.01);
        if(sv.mode==="fijo"){ save=sv.fundStop?0:Math.min(r2(base*sv.savePct),sobrante); inv=sv.invStop?0:Math.min(r2(base*sv.invPct),r2(sobrante-save));
          if(hasGoals){ const d=distGoals(Math.min(r2(base*sv.goalPct),Math.max(0,r2(sobrante-save-inv)))); goalsAlloc=d.res; }
          why=`${Math.round(sv.savePct*100)}% y ${Math.round(sv.invPct*100)}% de este ingreso`; }
        else {
          const days=daysBetween(per.start,per.end)+1;
          const dia=sv.spendMonthly!=null?r2(sv.spendMonthly*days/30):r2(base*0.35);
          const libre=r2(sobrante-dia);
          let total=libre>0?Math.max(r2(base*0.05),r2(libre*0.6)):r2(base*0.03);
          total=Math.max(0,Math.min(total,sobrante));
          const needFund=fundSim<sv.fundTarget;
          let sh=needFund?(hasGoals?[0.45,0.40,0.15]:[0.7,0,0.3]):(hasGoals?[0.1,0.6,0.3]:[0.3,0,0.7]);
          if(sv.fundStop) sh[0]=0; if(sv.invStop) sh[2]=0; if(!hasGoals) sh[1]=0;
          const shs=sh[0]+sh[1]+sh[2];
          if(shs<=0){ total=0; sh=[0,0,0]; } else sh=sh.map(x=>x/shs);
          save=r2(total*sh[0]); let gAmt=r2(total*sh[1]); inv=r2(total*sh[2]);
          if(gAmt>0){ const d=distGoals(gAmt); goalsAlloc=d.res; if(d.left>0.009){ if(!sv.fundStop) save=r2(save+d.left); else if(!sv.invStop) inv=r2(inv+d.left); } }
          why=shs<=0?"todo está marcado como completo; lo que sobra se queda para ti":libre>0?(hasGoals?"primero tus metas y tu fondo":sv.fundStop?"tu fondo está marcado como completo":needFund?"tu fondo de ahorro aún no llega a su meta":"tu fondo de ahorro ya está completo; más a inversión"):"este periodo sobra poco, se aparta un mínimo";
        }
        // lo que ya apartaste este día no se vuelve a pedir
        if(per.saveDone) save=0; if(per.invDone) inv=0;
        goalsAlloc=goalsAlloc.filter(x=>!per.goalsDone.some(d=>d.g.id===x.g.id));
        fundSim=r2(fundSim+save);
      }
      per.saveWhy=why; per.fund=fundSim;
      per.goals=goalsAlloc; per.goalTot=r2(goalsAlloc.reduce((a,x)=>a+x.amt,0));
      avail=r2(avail-save-inv-per.goalTot);
      per.lines=lines.sort((a,b)=>(a.o.carried?0:1)-(b.o.carried?0:1)||a.o.date-b.o.date); per.save=save; per.inv=inv; per.left=avail; carry=avail;
    });
    const ev=[];
    periods.forEach(per=>{ ev.push({d:per.start,v:per.income}); if(per.save||per.inv||per.goalTot) ev.push({d:per.start,v:-(per.save+per.inv+(per.goalTot||0))}); per.lines.forEach(l=>ev.push({d:l.o.date,v:-l.pay})); });
    ev.sort((a,b)=>a.d-b.d);
    const daily=[]; let bal=0, j=0;
    for(let d=new Date(t); d<=end; d=addDays(d,1)){ while(j<ev.length && ev[j].d<=d){ bal=r2(bal+ev[j].v); j++; } daily.push({d:new Date(d),bal}); }
    return {periods,daily,totalShort,totalInt,saveTotal:r2(periods.reduce((s,p)=>s+p.save,0)),invTotal:r2(periods.reduce((s,p)=>s+(p.inv||0),0)),goalTotal:r2(periods.reduce((s,p)=>s+(p.goalTot||0),0)),sv};
  };
  // 1ª pasada: cada tarjeta se paga en su fecha límite
  let res=simulate();
  // fecha conveniente: entre el día después del corte y la fecha límite, el primer día (hoy o día de sueldo)
  // en que puedes pagarla completa sin quedarte corto para tus otros pagos
  const bal=res.daily.map(x=>x.bal); const idx=d=>Math.max(0,Math.min(bal.length-1,daysBetween(t,d)));
  const incDates=[...new Set(incomes.map(i=>+i.date))].map(x=>new Date(x));
  cardObl.slice().sort((a,b)=>a.due-b.due).forEach(o=>{
    const ws0=addDays(o.cut,1); const ws=ws0>t?ws0:new Date(t); const last=addDays(o.due,-1);
    o.window={from:ws,to:o.due};
    if(o.amount<=0.009||last<ws){ o.payOn=o.due; o.why=last<ws?"vence muy pronto":""; return; }
    const cands=[ws,...incDates.filter(d=>d>ws&&d<=last)];
    let pick=null;
    for(const d of cands){ let ok=true; for(let k=idx(d);k<idx(o.due);k++){ if(bal[k]<o.amount-0.009){ ok=false; break; } } if(ok){ pick=d; break; } }
    if(pick){ for(let k=idx(pick);k<idx(o.due);k++) bal[k]=r2(bal[k]-o.amount); o.payOn=pick;
      o.why=+pick===+ws?(ws0>t?"en cuanto sale tu estado de cuenta":"ya tienes el dinero"):"cuando te llegue tu sueldo"; }
    else { o.payOn=o.due; o.why="no te alcanza antes; paga a más tardar ese día"; }
    o.date=o.payOn;
  });
  // 2ª pasada con las fechas recomendadas
  res=simulate();
  const incomeTotal=incomes.reduce((s,i)=>s+i.amount,0);
  const oblTotal=obligations.reduce((s,o)=>s+o.amount,0);
  return (planCache[key]={...res,incomeTotal,oblTotal,end,avail0,cardObl,hasIncome:incomes.length>0});
}

/* ================= avisos ================= */
function spendPace(){
  const t=today(); const day=t.getDate(); if(day<5) return null;
  const sum=a=>r2(a.reduce((x,e)=>x+(+e.amount||0),0));
  const key=ds(t).slice(0,7);
  const cur=sum(all("exp").filter(e=>e.date.slice(0,7)===key&&e.date<=ds(t)&&!(+e.msi>1)));
  const prev=[1,2,3].map(k=>{ const d=new Date(t.getFullYear(),t.getMonth()-k,1); const kk=ds(d).slice(0,7); return sum(all("exp").filter(e=>e.date.slice(0,7)===kk&&!(+e.msi>1))); }).filter(v=>v>0);
  if(!prev.length) return null;
  const avg=prev.reduce((a,b)=>a+b,0)/prev.length; const expected=r2(avg*day/dim(t.getFullYear(),t.getMonth()));
  if(expected<=0) return null; const ratio=cur/expected;
  if(ratio>=1.2) return {lvl:"warn",key:"pace-hi-"+key,title:`Vas gastando ${Math.round((ratio-1)*100)}% más de lo normal`,text:`Llevas ${money(cur)} este mes; a estas alturas sueles llevar ${money(expected)}.`,to:"gastos"};
  if(ratio<=0.75) return {lvl:"good",key:"pace-lo-"+key,title:`Vas gastando ${Math.round((1-ratio)*100)}% menos de lo normal`,text:`Llevas ${money(cur)}; sueles llevar ${money(expected)}. ¡Vas bien!`,to:"gastos"};
  return null;
}
function buildAlerts(){
  if(!S.loaded||S.mode==="signin") return [];
  const t=today(), d3=addDays(t,3); const out=[];
  const when=d=>{ const n=daysBetween(t,d); return n<0?`(venció el ${fDateS(ds(d))})`:n===0?"hoy":n===1?"mañana":`en ${n} días (${fDateS(ds(d))})`; };
  const lv=d=>{ const n=daysBetween(t,d); return n<=1?"high":"mid"; };
  try{
    recommendFutures().forEach(r=>{ const pk=r.pick; if(!pk) return; const n=daysBetween(t,pk.date); if(n<=1) out.push({lvl:n<=0?"high":"mid",key:"fut-"+r.f.id+"-"+ds(pk.date),title:`${n<=0?"Hoy":"Mañana"}: compra ${r.f.name}`,text:`${money(r.f.amount)} ${futMethod(pk)}. Cuando la hagas, toca “Ya lo compré”.`,to:"futuros"}); });
    all("flow").filter(f=>f.type==="fijo"&&f.active!==false).forEach(f=>{ const o=occurrences(f,t,d3)[0]; if(o) out.push({lvl:lv(o.date),key:"fijo-"+f.id+"-"+ds(o.date),title:`Paga ${f.name} ${when(o.date)}`,text:`${money(o.amount)} · pago fijo`,to:"plan"}); });
    all("loan").forEach(l=>{ const st=loanState(l); if(!st.next) return; if(daysBetween(t,st.next.date)<=3) out.push({lvl:lv(st.next.date),key:"loan-"+l.id+"-"+st.next.j,title:`Pago de ${l.name} ${when(st.next.date)}`,text:`${money(st.next.amt)} · pago ${st.next.j} de ${st.n}${get(l.payCardId)?` · con ${get(l.payCardId).name}`:""}${(()=>{ const sg=loanSuggest(l); return sg&&sg.extra>0.009?` · si puedes, paga ${money(sg.pay)}`:""; })()}`,to:"creditos"}); });
    const plan=buildPlan();
    (plan.cardObl||[]).forEach(o=>{ if(o.amount<=0.009||o.carried) return; const nDue=daysBetween(t,o.due), nPay=daysBetween(t,o.payOn||o.due);
      if(nDue>=0&&nDue<=3) out.push({lvl:lv(o.due),key:"card-"+o.card.id+"-"+ds(o.due),title:`${o.name} vence ${when(o.due)}`,text:`Pago total ${money(o.amount)}. Si ya lo pagaste, toca “Ya pagué el corte”.`,to:"tarjetas"});
      else if(nPay===0) out.push({lvl:"mid",key:"cardpay-"+o.card.id+"-"+ds(o.due),title:`Hoy te conviene pagar ${o.name}`,text:`Pago total ${money(o.amount)} · vence el ${fDateS(ds(o.due))}`,to:"tarjetas"}); });
    nextIncomes(1).filter(i=>+i.date===+t).forEach(i=>{ const p0=plan.periods[0]; out.push({lvl:"info",key:"inc-"+i.flow.id+"-"+ds(t),title:`Hoy te llega ${i.flow.name}`,text:`${money(i.amount)} · cuando te llegue, toca aquí para registrarlo${p0&&(p0.save||p0.inv)?` · aparta ${money(p0.save)} a tu fondo de ahorro y ${money(p0.inv)} a inversión`:""}`,to:`inc:${i.flow.id}:${ds(t)}`}); });

    scales:{x:{ticks:{color:fg,font:{size:11}},grid:{display:false},border:{color:grid}},y:{ticks:{color:fg,font:{size:11},callback:v=>moneyK(v)},grid:{color:grid},border:{display:false}}}},extra);
}
function cardColor(id){ const c=get(id); return c?c.color:"#8a9a98"; }

      tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.parsed)} (${Math.round(c.parsed/total*100)}%)`}}}}});
}

  } else $("#chUse").parentElement.innerHTML=`<div class="empty">Agrega una tarjeta de crédito para ver su uso.</div>`;
