name: Mi Oficina - avisos, calendarios y Notion

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # cada 15 minutos
  workflow_dispatch:

concurrency:
  group: oficina-avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node oficina-avisos/pruebas.js
      - run: npm install --prefix oficina-avisos --no-audit --no-fund
      - run: node oficina-avisos/avisos.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTION_TOKEN_OFICINA: ${{ secrets.NOTION_TOKEN_OFICINA }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          OFICINA_CORREOS: ${{ secrets.OFICINA_CORREOS }}
