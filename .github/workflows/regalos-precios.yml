name: Regalos - precios de la tienda

on:
  schedule:
    - cron: "8,38 * * * *"   # cada media hora
  workflow_dispatch:
    inputs:
      forzar:
        description: "Revisar todos los links ahora, aunque se hayan revisado hace poco"
        type: boolean
        default: false
      detalle:
        description: "Mostrar más detalle técnico en el registro"
        type: boolean
        default: false

concurrency:
  group: regalos-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar si Jina se puede usar desde la app (solo en modo detalle, con example.com)
        if: ${{ github.event.inputs.detalle == 'true' }}
        run: |
          curl -s -o /dev/null -D - -X OPTIONS -H "Origin: https://eliaflores.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: x-return-format,x-timeout" https://r.jina.ai/https://example.com | grep -iE "^HTTP|access-control" || true
          curl -s -o /dev/null -D - -H "Origin: https://eliaflores.github.io" -H "X-Return-Format: html" https://r.jina.ai/https://example.com | grep -iE "^HTTP|access-control" || true
      - run: npm install --prefix regalos-precios --no-audit --no-fund
      - run: node regalos-precios/actualizar.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.forzar }}
          DETALLE: ${{ github.event.inputs.detalle }}
