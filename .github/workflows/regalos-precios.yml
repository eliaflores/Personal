name: Regalos - precios de la tienda

on:
  schedule:
    - cron: "8,38 * * * *"   # cada media hora
  workflow_dispatch:
    inputs:
      forzar:
        description: "Revisar todos los links ahora, aunque se hayan revisado hace poco"
        type: boolean
        default: false
      detalle:
        description: "Mostrar más detalle técnico en el registro"
        type: boolean
        default: false

concurrency:
  group: regalos-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix regalos-precios --no-audit --no-fund
      - run: node regalos-precios/actualizar.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.forzar }}
          DETALLE: ${{ github.event.inputs.detalle }}
