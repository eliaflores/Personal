<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestros Planes</title>
<meta name="theme-color" content="#F6F5FA">
<script>
  // Tema guardado en este cel: "auto" (sigue al cel), "claro" u "oscuro".
  (function () { var t = "auto"; try { t = localStorage.getItem("planes.tema") || t; } catch (e) {} document.documentElement.setAttribute("data-theme", t); })();
</script>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
<link rel="manifest" href="manifest.json?v=3">
<meta name="apple-mobile-web-app-title" content="Planes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* Nuestros Planes: app de una columna para el cel. Letra Urbanist. Fondo Ghost White, tarjetas planas y muy redondeadas
   en azul Alice, verde Honeydew, amarillo Vainilla y blanco; tinta casi negra y píldoras negras para lo seleccionado.
   Cada quien tiene su color: la primera persona de la pareja en azul, la segunda en verde. */
:root {
  --bg: #F6F5FA;
  --card: #FFFFFF;
  --soft: #EDECF1;
  --soft-2: #DFDED9;
  --line: #E6E5EB;
  --ink: #212121;
  --ink-2: #3F3F3F;
  --muted: #8B8A92;
  --on-ink: #FFFFFF;
  --alice: #D8DFE9;
  --honeydew: #CFDECA;
  --vanilla: #EFF0A3;
  --azure: #97C2EC;
  --beige: #D6D0C2;
  --linen: #DFDED9;
  --pebble: #B5B1AE;
  --haze: #B0BFCC;
  --dark: #212121;          /* texto sobre los colores pastel (igual en los dos temas) */
  --p1: #97C2EC;  --p2: #A9CC97;
  --danger: #C2412D;
  --ok-ink: #3D6B35;
  --t-plan: #EFF0A3; --t-cita: #CFDECA; --t-viaje: #97C2EC; --t-cumple: #D6D0C2; --t-aniversario: #B0BFCC; --t-pendiente: #B5B1AE; --t-otro: #DFDED9;
  --hero: #D8DFE9;
  --chip-line: #CFCED5;
  --shadow: none;
  --nav-shadow: 0 10px 30px rgba(33,33,33,.10);
  --f-title: "Urbanist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f: "Urbanist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 66px;
  --hour: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="claro"]) {
    --bg: #121212; --card: #1C1C1E; --soft: #29292C; --soft-2: #3F3F3F; --line: #2C2C30;
    --ink: #F6F5FA; --ink-2: #DFDED9; --muted: #9A99A1; --on-ink: #212121; --chip-line: #3F3F44;
    --nav-shadow: 0 10px 30px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="oscuro"] {
  --bg: #121212; --card: #1C1C1E; --soft: #29292C; --soft-2: #3F3F3F; --line: #2C2C30;
  --ink: #F6F5FA; --ink-2: #DFDED9; --muted: #9A99A1; --on-ink: #212121; --chip-line: #3F3F44;
  --nav-shadow: 0 10px 30px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; min-height: 100vh; font-weight: 500; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--azure); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.wrap { max-width: 560px; margin: 0 auto; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(var(--nav-h) + 48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.wrap.no-nav { padding-bottom: 40px; }
.title { font-family: var(--f-title); font-weight: 600; font-size: 2.05rem; line-height: 1.08; letter-spacing: -.025em; }
.title em { font-style: normal; font-weight: 400; color: var(--muted); }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 28px 2px 12px; }
.sec h2 { font-family: var(--f-title); font-weight: 600; font-size: 1.35rem; letter-spacing: -.02em; }
.sec a, .sec button.lnk { background: none; border: 1px solid var(--chip-line); border-radius: 999px; color: var(--ink); font-weight: 600; font-size: .85rem; padding: 5px 12px; text-decoration: none; }
.hint { color: var(--muted); font-size: .92rem; }
.center { text-align: center; }
.card { background: var(--card); border-radius: 28px; }
.pad { padding: 18px; }

/* Barra superior */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
.top .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.icon-btn { flex: none; border: none; background: var(--card); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); padding: 0; }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.accent { background: var(--ink); color: var(--on-ink); }
.duo { display: flex; align-items: center; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .95rem; color: var(--dark); overflow: hidden; border: 2.5px solid var(--bg); flex: none; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.sm { width: 28px; height: 28px; font-size: .74rem; border-width: 2px; }
.av.lg { width: 66px; height: 66px; font-size: 1.5rem; border-width: 3px; }
.duo .av + .av { margin-left: -10px; }
.av.p1 { background: var(--p1); } .av.p2 { background: var(--p2); } .av.p0 { background: var(--linen); }

/* Botones */
.btn { border: none; border-radius: 999px; padding: 13px 22px; font-weight: 600; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; text-decoration: none; background: var(--card); color: var(--ink); }
.btn svg { width: 19px; height: 19px; }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-accent { background: var(--vanilla); color: var(--dark); }
.btn-light { background: var(--dark); color: #fff; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; white-space: nowrap; padding-inline: 14px; }
.card .btn:not(.btn-primary):not(.btn-accent), .block .btn:not(.btn-primary):not(.btn-accent) { background: var(--soft); }
.link-danger { background: none; border: none; color: var(--danger); font-weight: 600; padding: 12px 4px; align-self: center; }
.link-danger.armed { background: var(--danger); color: #fff; border-radius: 999px; padding: 12px 20px; }
.arrow { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--dark); color: #fff; }
.arrow svg { width: 18px; height: 18px; }

/* Chips: píldoras con contorno, negras cuando están elegidas */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.2px solid var(--chip-line); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 8px 15px; font-size: .9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }

/* Segmento Día/Semana/Mes */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 1.2px solid var(--chip-line); background: transparent; border-radius: 999px; padding: 9px 6px; font-weight: 500; font-size: .92rem; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); font-weight: 600; }

/* Hero: cuenta regresiva */
.hero { position: relative; overflow: hidden; border-radius: 30px; padding: 22px 22px 20px; background: var(--hero); color: var(--dark); border: none; width: 100%; text-align: left; display: block; }
.hero .k { font-size: .9rem; font-weight: 600; color: #4E5560; }
.hero .big { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.hero .big b { font-size: 4.6rem; line-height: .95; font-weight: 700; letter-spacing: -.04em; }
.hero .big span { font-size: 1.35rem; font-weight: 500; color: #4E5560; }
.hero .what { font-size: 1.4rem; font-weight: 600; margin-top: 8px; line-height: 1.15; letter-spacing: -.01em; padding-right: 50px; }
.hero .when { margin-top: 12px; font-size: .9rem; display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--vanilla); border-radius: 999px; padding: 6px 12px; font-weight: 600; }
.hero .when svg { width: 16px; height: 16px; flex: none; }
.hero .em { position: absolute; right: 18px; top: 18px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.7); display: grid; place-items: center; font-size: 1.6rem; }
.hero.empty-hero .what { font-size: 1.3rem; }

/* Listas de filas */
.list { background: var(--card); border-radius: 26px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; background: none; border: none; text-align: left; color: inherit; text-decoration: none; }
.row + .row { border-top: 1px solid var(--line); }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
.row .tx span { display: block; color: var(--muted); font-size: .85rem; }
.row .ch { color: var(--muted); flex: none; } .row .ch svg { width: 18px; height: 18px; }
.ico { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; background: var(--soft); color: var(--ink); }
.ico svg { width: 21px; height: 21px; }
.pill { flex: none; font-size: .78rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--vanilla); color: var(--dark); white-space: nowrap; }
.pill.now { background: var(--ink); color: var(--on-ink); }
.pill.gray { background: transparent; border: 1.2px solid var(--chip-line); color: var(--ink-2); font-weight: 600; padding: 4px 10px; }
.pill.ok { background: var(--honeydew); color: var(--ok-ink); }
.date-badge { flex: none; width: 50px; text-align: center; border-radius: 18px; padding: 7px 0 6px; line-height: 1.05; color: var(--dark); }
.date-badge small { display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; opacity: .7; }
.date-badge b { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }

/* Tarjetas de ideas */
.ideas { display: grid; gap: 10px; }
.idea { display: flex; gap: 14px; align-items: flex-start; padding: 14px; background: var(--card); border: none; border-radius: 26px; width: 100%; text-align: left; color: inherit; position: relative; }
.idea .emo { flex: none; width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; font-size: 1.9rem; background: var(--soft); }
.idea .tx { flex: 1; min-width: 0; padding-right: 22px; }
.idea h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; letter-spacing: -.01em; }
.idea .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: .84rem; margin-top: 4px; align-items: center; }
.idea .who { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink-2); }
.idea .who i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.idea .tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.idea.done { opacity: .7; }
.idea.done h3 { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink) 35%, transparent); }
.idea .likes { position: absolute; top: 14px; right: 16px; font-size: .9rem; color: var(--ink); font-weight: 700; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.mini-idea { flex: none; width: 170px; scroll-snap-align: start; background: var(--card); border: none; border-radius: 26px; padding: 14px; text-align: left; color: inherit; display: flex; flex-direction: column; gap: 8px; }
.mini-idea:nth-child(3n+1) { background: var(--alice); color: var(--dark); }
.mini-idea:nth-child(3n+2) { background: var(--honeydew); color: var(--dark); }
.mini-idea:nth-child(3n) { background: var(--vanilla); color: var(--dark); }
.mini-idea.new { background: transparent; border: 1.5px dashed var(--chip-line); color: var(--ink); }
.mini-idea .emo { font-size: 1.7rem; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.65); }
.mini-idea.new .emo { background: var(--soft); }
.mini-idea b { font-size: .98rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini-idea span { font-size: .8rem; opacity: .75; }

/* Duelo: ¿quién propone más? */
.duel { padding: 18px; }
.duel h3 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
.duel .lead { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.duel .bar { display: flex; height: 16px; border-radius: 999px; overflow: hidden; margin: 14px 0 12px; background: var(--soft); }
.duel .bar i { display: block; height: 100%; transition: width .5s; }
.duel .bar i + i { border-left: 3px solid var(--card); }
.duel .people { display: flex; justify-content: space-between; gap: 10px; }
.duel .person { display: flex; align-items: center; gap: 10px; }
.duel .person.r { flex-direction: row-reverse; text-align: right; }
.duel .person b { font-size: 1.8rem; line-height: 1; font-weight: 700; letter-spacing: -.03em; }
.duel .person > div > span { display: block; font-size: .84rem; color: var(--muted); }
.crown { font-size: .9rem; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--card); border-radius: 26px; padding: 16px 18px; color: var(--ink); }
.stat:nth-child(1) { background: var(--alice); color: var(--dark); }
.stat:nth-child(2) { background: var(--honeydew); color: var(--dark); }
.stat:nth-child(3) { background: var(--vanilla); color: var(--dark); }
.stat b { display: block; font-size: 1.7rem; font-weight: 700; line-height: 1.1; letter-spacing: -.03em; }
.stat span { font-size: .84rem; opacity: .7; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 10px; align-items: center; padding: 6px 18px 16px; }
.vs .lbl { grid-column: 1 / -1; text-align: center; font-size: .8rem; color: var(--muted); font-weight: 600; margin-top: 12px; }
.vs .n { font-size: 1.4rem; font-weight: 700; }
.vs .n.r { text-align: right; }
.vs .mid { display: flex; gap: 3px; width: 130px; height: 10px; }
.vs .mid i { display: block; border-radius: 99px; height: 100%; }
.catbar { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 16px 18px; }
.catbar .t { height: 12px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.catbar .t i { display: block; height: 100%; background: var(--azure); border-radius: 99px; }
.catbar .c { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Detalle */
.d-head { text-align: center; padding: 8px 0 4px; }
.d-emo { width: 96px; height: 96px; border-radius: 50%; margin: 4px auto 14px; display: grid; place-items: center; font-size: 3rem; background: var(--alice); }
.d-head h1 { font-weight: 700; font-size: 2rem; line-height: 1.1; letter-spacing: -.03em; overflow-wrap: anywhere; }
.d-head .sub { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.byline { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 4px 14px 4px 4px; font-size: .88rem; font-weight: 600; }
.block { margin-top: 10px; padding: 18px 18px; }
.block h3 { font-size: .9rem; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.block p { white-space: pre-wrap; overflow-wrap: anywhere; }
.block.alice { background: var(--alice); color: var(--dark); }
.block.alice h3, .block.alice .hint { color: #5A6270; }
.money-big { font-size: 2.4rem; font-weight: 700; line-height: 1; letter-spacing: -.04em; }
.money-big small { font-size: .9rem; font-weight: 600; letter-spacing: 0; margin-left: 8px; background: var(--vanilla); color: var(--dark); padding: 4px 10px; border-radius: 99px; vertical-align: middle; }
.lines { margin-top: 14px; display: grid; gap: 8px; }
.line { display: flex; justify-content: space-between; gap: 10px; font-size: .95rem; }
.line span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; }
.todo { display: flex; align-items: center; gap: 12px; padding: 10px 0; width: 100%; background: none; border: none; text-align: left; }
.todo + .todo { border-top: 1px solid var(--line); }
.todo .box { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--chip-line); display: grid; place-items: center; color: transparent; }
.todo .box svg { width: 15px; height: 15px; }
.todo[aria-pressed="true"] .box { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.todo[aria-pressed="true"] .tt { text-decoration: line-through; color: var(--muted); }
.todo .tm { flex: none; font-size: .8rem; font-weight: 700; min-width: 58px; font-variant-numeric: tabular-nums; background: var(--honeydew); color: var(--dark); border-radius: 99px; padding: 3px 8px; text-align: center; }
.todo .tm:empty { background: none; }
.todo .tt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.todo .cs { flex: none; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.like-btn { border: 1.2px solid var(--ink); color: var(--ink); background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.like-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.like-btn svg { width: 18px; height: 18px; }

/* Calendario */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 10px; }
.cal-head h2 { font-weight: 700; font-size: 1.4rem; letter-spacing: -.02em; text-transform: capitalize; flex: 1; min-width: 0; }
.cal-head .nav2 { display: flex; gap: 6px; align-items: center; }
.today-btn { border: 1.2px solid var(--chip-line); background: transparent; border-radius: 999px; padding: 9px 14px; font-weight: 600; font-size: .88rem; }
.month { padding: 10px 8px 12px; }
.month .wd, .month .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.month .wd span { text-align: center; font-size: .78rem; font-weight: 600; color: var(--muted); padding: 4px 0 8px; }
.month .day { border: none; background: none; min-height: 74px; padding: 4px 2px; display: flex; flex-direction: column; align-items: stretch; gap: 2px; border-radius: 14px; text-align: left; color: inherit; min-width: 0; }
.month .day .n { align-self: center; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: .9rem; font-weight: 600; margin-bottom: 1px; font-variant-numeric: tabular-nums; }
.month .day.out .n { color: var(--muted); opacity: .5; }
.month .day.today .n { background: var(--ink); color: var(--on-ink); }
.month .day.sel { background: var(--soft); }
.month .ev { display: block; font-size: .64rem; line-height: 1.3; font-weight: 600; padding: 1px 5px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dark); }
.month .more { font-size: .62rem; color: var(--muted); text-align: center; font-weight: 700; }
.tgrid-wrap { overflow: hidden; padding: 0; }
.tgrid-head { display: grid; border-bottom: 1px solid var(--line); }
.tgrid-head .h { text-align: center; padding: 8px 0 6px; border: none; background: none; color: inherit; }
.tgrid-head .h small { display: block; font-size: .7rem; color: var(--muted); font-weight: 600; }
.tgrid-head .h b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-size: .95rem; font-variant-numeric: tabular-nums; }
.tgrid-head .h.today b { background: var(--ink); color: var(--on-ink); }
.allday { display: grid; border-bottom: 1px solid var(--line); min-height: 8px; }

/* ---------- Calendario ---------- */
function evsOn(iso) {
  return S.events.filter(e => occursOn(e, iso)).sort((a, b) => {
    const A = a.allDay || !a.time || evEnd(a) > a.date ? -1 : toMin(a.time), B = b.allDay || !b.time || evEnd(b) > b.date ? -1 : toMin(b.time);
    return A - B;
  });
}
const isTimed = e => !e.allDay && toMin(e.time) != null && evEnd(e) === e.date;
function calTitle(view, d) {
  const x = parse(d);
  if (view === "mes") return `${MESES[x.getMonth()]} ${x.getFullYear()}`;
  if (view === "dia") return `${DIAS[x.getDay()]} ${x.getDate()} ${MES3[x.getMonth()]}`;
  const s = parse(weekStart(d)), e = parse(addDays(weekStart(d), 6));
  return s.getMonth() === e.getMonth() ? `${s.getDate()} – ${e.getDate()} ${MES3[e.getMonth()]}` : `${s.getDate()} ${MES3[s.getMonth()]} – ${e.getDate()} ${MES3[e.getMonth()]}`;
}
function renderCal(r) {
  localStore("planes.vista", r.view);
  const step = r.view === "mes" ? null : r.view === "semana" ? 7 : 1;
  const prev = step ? addDays(r.d, -step) : addMonths(r.d, -1), next = step ? addDays(r.d, step) : addMonths(r.d, 1);
  let body = "";
  if (r.view === "mes") body = monthView(r.d);
  else body = timeGrid(r.view === "semana" ? [...Array(7)].map((_, k) => addDays(weekStart(r.d), k)) : [r.d], r.view === "dia");
  app.innerHTML = `<div class="wrap screen">
    ${topBar(`<h1 class="title">Calendario</h1>`, `${refreshBtn()}<button class="icon-btn accent" data-act="newEvent" data-date="${r.d}" aria-label="Nuevo evento">${I("plus")}</button>`)}
    <div class="seg" style="margin-top:10px">${[["dia", "Día"], ["semana", "Semana"], ["mes", "Mes"]].map(([k, l]) => `<button data-go="#cal/${k}/${r.d}" aria-current="${r.view === k}">${l}</button>`).join("")}</div>
    <div class="cal-head">
      <h2>${esc(calTitle(r.view, r.d))}</h2>
      <div class="nav2"><button class="today-btn" data-go="#cal/${r.view}/${todayISO()}">Hoy</button><button class="icon-btn" data-go="#cal/${r.view}/${prev}" aria-label="Anterior">${I("chevL")}</button><button class="icon-btn" data-go="#cal/${r.view}/${next}" aria-label="Siguiente">${I("chev")}</button></div>
    </div>
    ${body}
  </div>`;
  // Tocar una hora vacía crea un evento a esa hora.
  app.querySelectorAll(".tgrid .col").forEach(c => c.addEventListener("click", ev => {
    if (ev.target.closest(".blk")) return;
    const rect = c.getBoundingClientRect(), h = Math.max(0, Math.min(23, Math.floor((ev.clientY - rect.top) / parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour")))));
    openEventForm(null, { date: c.dataset.d, time: `${pad2(h)}:00` });
  }));
  const sc = app.querySelector(".tscroll");
  if (sc) {
    const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
    const key = r.view + r.d;
    let want;
    if (gridScroll.key === key) want = gridScroll.top;                    // se volvió a pintar (datos nuevos): no mover
    else {
      const first = Math.min(...[...app.querySelectorAll(".blk")].map(b => parseFloat(b.style.top)).filter(Number.isFinite), 8 * H);
      const isNow = r.d === todayISO() || (r.view === "semana" && weekStart(r.d) === weekStart(todayISO()));
      const now = new Date(), nowY = (now.getHours() + now.getMinutes() / 60) * H;
      want = isNow ? nowY - H * 2 : first - H / 2;
    }

// La cuadrícula de horas ocupa justo lo que queda de pantalla (sin que la página tenga que moverse).

function monthView(d) {

// Acomoda eventos que se enciman en columnas.
function layoutDay(evs) {

  const out = []; let group = [], groupEnd = -1;
  const flush = () => { const cols = []; group.forEach(it => { let c = cols.findIndex(end => end <= it.s); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.en; it.col = c; }); group.forEach(it => { it.cols = cols.length; out.push(it); }); group = []; };
  items.forEach(it => { if (it.s >= groupEnd) { flush(); groupEnd = -1; } group.push(it); groupEnd = Math.max(groupEnd, it.en); });
  flush();

}
function timeGrid(days, wide) {

  const alls = days.map(d => evsOn(d).filter(e => !isTimed(e)));
  const allRow = alls.some(a => a.length) ? `<div class="allday" style="grid-template-columns:${cols}"><span class="lab">todo<br>el día</span>${alls.map((a, k) => `<div class="cell">${a.map(e => `<button class="adev" style="${tstyle(e.type)}" data-go="#evento/${esc(e.id)}">${esc(e.title)}</button>`).join("")}</div>`).join("")}</div>` : "";
  let hours = ""; for (let h = 1; h < 24; h++) hours += `<span style="top:${h * H}px">${h % 12 || 12}${h < 12 ? "am" : "pm"}</span>`;
  const now = new Date(), nowTop = (now.getHours() * 60 + now.getMinutes()) / 60 * H;
  const colHtml = days.map(d => {
    const blocks = layoutDay(evsOn(d).filter(isTimed)).map(it => {

    }).join("");

  }).join("");
  const dayList = wide ? (() => { const evs = evsOn(days[0]); return evs.length ? `<div class="sec"><h2>${days[0] === t ? "Hoy" : "Este día"}</h2></div><div class="list">${evs.map(e => evRow(e, days[0], days[0] >= t)).join("")}</div>` : `<p class="hint center" style="margin-top:16px">Día libre Toca una hora para agendar algo.</p>`; })() : "";
  return `<div class="card tgrid-wrap">${head}${allRow}<div class="tscroll"><div class="tgrid" style="grid-template-columns:${cols}"><div class="hours" style="height:${24 * H}px">${hours}</div>${colHtml}</div></div></div>${dayList}`;
}

function gcalUrl(e) {

  const compact = iso => iso.replace(/-/g, "");
  let dates;
  if (!isTimed(e)) dates = `${compact(occ)}/${compact(addDays(occ, 1 + diffDays(e.date, evEnd(e))))}`;
  else { const s = toMin(e.time), en = toMin(e.endTime) > s ? toMin(e.endTime) : s + 60; const f = m => `${pad2(Math.floor(m / 60) % 24)}${pad2(m % 60)}00`; dates = `${compact(occ)}T${f(s)}/${compact(en >= 1440 ? addDays(occ, 1) : occ)}T${f(en % 1440)}`; }
  const p = new URLSearchParams({ action: "TEMPLATE", text: e.title, dates, details: e.note || "Agendado en Nuestros Planes", location: e.place || "", ctz: "America/Mexico_City" });
  const rr = { semanal: "WEEKLY", mensual: "MONTHLY", anual: "YEARLY" }[e.repeat];
  if (rr) p.set("recur", "RRULE:FREQ=" + rr);

}

// Foto cuadrada y comprimida (se guarda dentro de Firestore, ~40 KB).
function squarePhoto(file, size = 360, cap = 60000) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height), sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      const c = document.createElement("canvas"); c.width = c.height = Math.min(size, side);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, sx, sy, side, side, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.82, out = c.toDataURL("image/jpeg", q);
      while (out.length > cap && q > 0.4) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

  if (!("Notification" in window) || !("serviceWorker" in navigator)) { toast(pushStateText()); return; }
  try {
    if (!(await messagingSupported())) { toast("Este navegador no permite avisos con la app cerrada"); return; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("No se activaron los avisos"); if (sub) sub.textContent = pushStateText(); return; }
    const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
    const had = localStore("planes.push") || "";
    const token = await getToken(getMessaging(fbApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) { toast("No se pudo registrar este cel"); return; }
    await setDoc(doc(fdb, "planes", S.cid, "privado", me(), "avisos", "t-" + hashStr(token)), { token, device: (navigator.userAgent || "").slice(0, 140), createdAt: Date.now() });
    localStore("planes.push", token);
    if (had === token) { await reg.showNotification("Faltan 3 días para su cita", { body: "Así se verán sus avisos.", icon: "icon-192.png" }); toast("Te mandé un aviso de prueba"); }
    else toast("¡Listo! Les avisaré de sus planes");
    if (sub) sub.textContent = pushStateText();
  } catch (e) { console.error(e); toast(e && e.code === "permission-denied" ? "Firebase no dio permiso. Faltan las reglas nuevas." : "No se pudieron activar: " + ((e && (e.code || e.message)) || "error")); }
}

function typeEditor(kind, k) {

    root.querySelector("#teBack").addEventListener("click", typesSheet);
    root.querySelector("#teSave").addEventListener("click", async e => {
      const x = get(), btn = e.currentTarget;

        if (isCustom) {

    });
  });

  const remind = new Set(v.remind || DEFAULT_REMIND);
  const multi = !!(v.endDate && v.endDate > v.date);
  const ideas = [...S.ideas].sort((a, b) => a.done - b.done || (b.createdAt || 0) - (a.createdAt || 0));
  openSheet(`<form id="evF" style="display:contents">
    <div class="sheet-head"><h2>${it ? "Editar evento" : "Agendar"}</h2><button type="button" class="x" data-close aria-label="Cerrar">×</button></div>
    <label class="field">Conectar con un plan <span class="opt">De su lista de ideas</span><select class="input" id="eP"><option value="">Ninguno</option>${ideas.map(i => `<option value="${esc(i.id)}" ${v.planId === i.id ? "selected" : ""}>${esc(i.title)}${i.done ? " (hecho)" : ""}</option>`).join("")}</select></label>
    <label class="field">¿Qué es?<input class="input" id="eT" maxlength="90" required placeholder="Ej. Cena de aniversario" value="${esc(v.title)}"></label>
    <div class="field">Tipo<div class="chips" id="tChips">${typeChipsHtml()}</div><div class="ntbox card" hidden>${typeFormHtml("nt", {}, true)}<div class="btn-row"><button type="button" class="btn" data-ntcancel>Cancelar</button><button type="button" class="btn btn-primary" data-ntsave>Agregar tipo</button></div></div></div>
    <label class="field">Fecha<input class="input" type="date" id="eD" required value="${esc(v.date)}"></label>
    <label class="switch">Dura varios días<input type="checkbox" id="eMulti" ${multi ? "checked" : ""}></label>
    <label class="field" id="eEndW" ${multi ? "" : "hidden"}>Hasta<input class="input" type="date" id="eE" value="${esc(v.endDate || "")}"></label>
    <label class="switch">Todo el día<input type="checkbox" id="eAll" ${v.allDay ? "checked" : ""}></label>
    <div class="two" id="eTimes" ${v.allDay ? "hidden" : ""}><label class="field">Empieza<input class="input" type="time" id="eS" value="${esc(v.time)}"></label><label class="field"><span>Termina <span class="opt-in">(opcional)</span></span><input class="input" type="time" id="eF" value="${esc(v.endTime)}"></label></div>
    <label class="field" id="eRepW">Se repite<select class="input" id="eR">${REPEATS.map(r => `<option value="${r.k}" ${(v.repeat || "no") === r.k ? "selected" : ""}>${r.l}</option>`).join("")}</select></label>
    <label class="field">Lugar <span class="opt">Opcional</span><input class="input" id="eL" maxlength="140" placeholder="Ej. Restaurante Pujol" value="${esc(v.place)}"></label>
    <label class="field">Notas <span class="opt">Opcional</span><textarea class="input" id="eN" maxlength="600" placeholder="Ej. Reservación a nombre de Diego">${esc(v.note)}</textarea></label>
    <div class="field">Avisarnos <span class="opt">Les llega a los dos: “Faltan 7 días para…”</span><div class="chips" id="rChips">${REMINDERS.map(r => `<button type="button" class="chip" data-rm="${r.k}" aria-pressed="${remind.has(r.k)}">${r.l}</button>`).join("")}</div></div>
    <button class="btn btn-primary btn-block" type="submit" id="eSave">${it ? "Guardar cambios" : "Agendar"}</button>
    ${it ? `<button type="button" class="link-danger" id="eDel" data-label="Borrar del calendario">Borrar del calendario</button>` : ""}
  </form>`, root => {
    const f = root.querySelector("#evF");
    const paintT = () => root.querySelectorAll("#tChips [data-t]").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === type));
    const paintR = () => {
      const timed = !root.querySelector("#eAll").checked && !root.querySelector("#eMulti").checked;
      root.querySelectorAll("#rChips [data-rm]").forEach(b => { b.hidden = !timed && /[hm]$/.test(b.dataset.rm); });
      root.querySelector("#eRepW").hidden = root.querySelector("#eMulti").checked;
    };
    paintT(); paintR();
    const nt = wireNewType(root, t => { root.querySelector("#tChips").innerHTML = typeChipsHtml(); type = t.k; paintT(); });
    root.querySelector("#tChips").addEventListener("click", e => { if (e.target.closest("[data-newtype]")) return nt.toggle(); const b = e.target.closest("[data-t]"); if (!b) return; type = b.dataset.t; paintT();
      if ((type === "cumple" || type === "aniversario") && root.querySelector("#eR").value === "no" && !it) { root.querySelector("#eR").value = "anual"; root.querySelector("#eAll").checked = true; root.querySelector("#eTimes").hidden = true; paintR(); } });
    root.querySelector("#rChips").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (!b) return; const k = b.dataset.rm; remind.has(k) ? remind.delete(k) : remind.add(k); b.setAttribute("aria-pressed", remind.has(k)); });
    root.querySelector("#eAll").addEventListener("change", e => { root.querySelector("#eTimes").hidden = e.target.checked; paintR(); });
    root.querySelector("#eMulti").addEventListener("change", e => { root.querySelector("#eEndW").hidden = !e.target.checked; if (e.target.checked && !root.querySelector("#eE").value) root.querySelector("#eE").value = addDays(root.querySelector("#eD").value || todayISO(), 2); paintR(); });
    root.querySelector("#eP").addEventListener("change", e => {
      const pl = ideaById(e.target.value); if (!pl) return;
      const tt = root.querySelector("#eT"); if (!tt.value.trim() || ideas.some(i => i.title === tt.value.trim())) tt.value = pl.title;
      if (!root.querySelector("#eL").value && pl.place) root.querySelector("#eL").value = pl.place;
      const firstT = (pl.activities || []).map(a => a.time).filter(Boolean).sort()[0];
      if (firstT && !root.querySelector("#eS").value) root.querySelector("#eS").value = firstT;
      if (pl.cat === "viaje") { type = "viaje"; paintT(); }
    });
    root.querySelector("#eDel")?.addEventListener("click", async ev => {
      if (!arm("dele-" + id, ev.currentTarget, "Toca otra vez para borrar")) return;
      try { await deleteDoc(doc(fdb, "planes", S.cid, "eventos", id)); closeSheet(); go("#cal"); toast("Evento borrado"); } catch (e) { writeErr(e); }
    });
    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      const title = root.querySelector("#eT").value.trim(), date = root.querySelector("#eD").value;
      if (!title) { root.querySelector("#eT").focus(); return; }
      if (!date) { root.querySelector("#eD").focus(); return; }
      const isMulti = root.querySelector("#eMulti").checked, end = root.querySelector("#eE").value;
      const allDay = root.querySelector("#eAll").checked || isMulti;
      const time = allDay ? "" : root.querySelector("#eS").value;
      if (isMulti && (!end || end <= date)) { toast("La fecha de fin debe ser después del inicio"); return; }
      const data = {
        title, type, date, endDate: isMulti ? end : null, allDay: allDay || !time, time, endTime: allDay ? "" : root.querySelector("#eF").value,
        repeat: isMulti ? "no" : root.querySelector("#eR").value, planId: root.querySelector("#eP").value || null,
        place: root.querySelector("#eL").value.trim(), note: root.querySelector("#eN").value.trim(),
        remind: REMINDERS.map(r => r.k).filter(k => remind.has(k)), updatedAt: Date.now(),
      };
      const b = root.querySelector("#eSave"); b.disabled = true;
      try {
        if (it) await updateDoc(doc(fdb, "planes", S.cid, "eventos", id), data);
        else { const ref = await addDoc(collection(fdb, "planes", S.cid, "eventos"), { ...data, createdBy: me(), createdAt: Date.now() }); closeSheet(); go("#evento/" + ref.id); toast("¡Agendado!"); return; }
        closeSheet(); toast("Guardado");
      } catch (e) { b.disabled = false; writeErr(e); }
    });
  });
}

/* ---------- Acciones (delegadas) ---------- */
document.addEventListener("click", async ev => {
  const g = ev.target.closest("[data-go]");
  if (g && !ev.target.closest("#sheetRoot")) { ev.preventDefault(); go(g.dataset.go); return; }
  const a = ev.target.closest("[data-act]"); if (!a) return;
  const r = route();
  const act = a.dataset.act;
  if (act === "share") return shareInvite();
  if (act === "newIdea") return ideaForm(null);
  if (act === "editIdea") return ideaForm(a.dataset.id);
  if (act === "roulette") return roulette();
  if (act === "newEvent") return openEventForm(null, a.dataset.date ? { date: a.dataset.date } : {});
  if (act === "editEvent") return openEventForm(a.dataset.id);
  if (act === "push") return enablePush();
  if (act === "types") return typesSheet();
  if (act === "shortcuts") return shortcutsSheet();
  if (act === "refresh") { a.classList.add("spin"); a.disabled = true; location.replace(location.pathname + "?r=" + Date.now() + location.hash); return; }
  if (act === "signout") return signOut(auth);
  const i = r.v === "idea" && ideaById(r.id);
  if (!i) return;
  const ref = doc(fdb, "planes", S.cid, "ideas", i.id);
  try {
    if (act === "like") { const likes = { ...(i.likes || {}) }; if (likes[me()]) delete likes[me()]; else likes[me()] = true; await updateDoc(ref, { likes }); }
    if (act === "toggleAct") { const acts = (i.activities || []).map((x, k) => k === +a.dataset.k ? { ...x, done: !x.done } : x); await updateDoc(ref, { activities: acts }); }
    if (act === "doneIdea") { await updateDoc(ref, { done: !i.done, doneAt: i.done ? null : Date.now() }); if (!i.done) toast("¡Qué bonito! Quedó en sus recuerdos"); }
    if (act === "scheduleIdea") {
      const firstT = (i.activities || []).map(x => x.time).filter(Boolean).sort()[0] || "";
      openEventForm(null, { title: i.title, planId: i.id, place: i.place || "", time: firstT, type: i.cat === "viaje" ? "viaje" : "plan", date: addDays(todayISO(), 1) });
    }
  } catch (e) { writeErr(e); }
});

/* ---------- Datos ---------- */
let renderQ = false;
function dataRender() {
  if (renderQ) return; renderQ = true;
  requestAnimationFrame(() => { renderQ = false; if (!$("#sheetBg")) render(); else setNav(route()); });
}
function openCouple(id) {
  stopAll();
  S.cid = id; S.loaded = false; S.stale = false;
  if (joinId) history.replaceState(null, "", location.pathname + location.hash);
  const got = { couple: false, ideas: false, events: false };
  const timer = setTimeout(() => { if (!S.loaded) { S.stale = true; render(); } }, 10000);
  const done = k => { got[k] = true; if (got.couple && got.ideas && got.events && !S.loaded) { S.loaded = true; clearTimeout(timer); syncProfile(); if (justRefreshed) { justRefreshed = false; setTimeout(() => toast("Listo, todo actualizado"), 300); } } dataRender(); };
  const denied = part => err => {
    clearTimeout(timer);
    S.error = err && err.code === "permission-denied"
      ? `Firebase no dio permiso para leer ${part}. En Firestore Database → Rules pega las reglas nuevas (deben incluir “planes”) y dale Publicar.`
      : "No se pudo cargar. Revisa tu internet y recarga.";
    render();
  };
  unsubs.push(onSnapshot(doc(fdb, "planes", id), snap => { S.couple = snap.exists() ? snap.data() : null; done("couple"); }, denied("su espacio")));
  unsubs.push(onSnapshot(collection(fdb, "planes", id, "ideas"), snap => { S.ideas = snap.docs.map(d => ({ id: d.id, ...d.data() })); done("ideas"); }, denied("las ideas")));
  unsubs.push(onSnapshot(collection(fdb, "planes", id, "eventos"), snap => { S.events = snap.docs.map(d => ({ id: d.id, ...d.data() })); done("events"); }, denied("el calendario")));
}
// Guarda tu nombre y foto de Google para que tu pareja los vea.
async function syncProfile() {
  const c = S.couple; if (!c) return;
  const want = {};
  if (!c.names || !c.names[me()]) want["names." + me()] = firstName(S.user);
  const mine = c.photos && c.photos[me()];
  if (S.user.photoURL && (mine === undefined || (/^https:/.test(mine || "") && mine !== S.user.photoURL))) want["photos." + me()] = S.user.photoURL;
  if (Object.keys(want).length) try { await updateDoc(doc(fdb, "planes", S.cid), want); } catch (e) { console.warn(e); }
}
async function findCouple() {
  S.error = "";
  try {
    if (joinId) {
      const ref = doc(fdb, "planes", joinId);
      const snap = await getDoc(ref);
      if (!snap.exists()) { S.error = "Ese link de invitación no existe. Pide que te lo manden otra vez."; return render(); }
      const d = snap.data();
      if (!(d.members || []).includes(me())) {
        if ((d.members || []).length >= 2) { S.error = "Este espacio ya tiene a dos personas."; return render(); }
        await updateDoc(ref, { members: arrayUnion(me()), ["names." + me()]: firstName(S.user) });
        setTimeout(() => toast("¡Ya están conectados!"), 600);
      }
      return openCouple(joinId);
    }
    const res = await getDocs(query(collection(fdb, "planes"), where("members", "array-contains", me()), limit(1)));
    if (!res.empty) return openCouple(res.docs[0].id);
    S.loaded = true; S.couple = null; render();
  } catch (e) {
    console.error(e);
    S.error = e && e.code === "permission-denied" ? "Firebase no dio permiso. En Firestore Database → Rules pega las reglas nuevas (deben incluir “planes”) y dale Publicar." : "No se pudo conectar. Revisa tu internet.";
    render();
  }
}

window.addEventListener("hashchange", () => { closeSheet(); render(); });
// Refresca la cuenta regresiva cada minuto.
setInterval(() => { if (!$("#sheetBg") && ["inicio", "evento"].includes(route().v)) render(); }, 60000);
onAuthStateChanged(auth, user => {
  stopAll();
  Object.assign(S, { authReady: true, user, couple: null, ideas: [], events: [], loaded: false, cid: null, error: "" });
  render();
  if (user) findCouple();
});
</script>
</body>
